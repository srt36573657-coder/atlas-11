name: atlas11-collect-check
# 수집기만 한 번 돌려 결과를 reports/atlas11/probe/collect-<시각>.json 으로 남긴다(입력·발행은 건드리지 않음)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas11-daily
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p reports/atlas11/probe
          node scripts/atlas11/probe/minute_fixtures.mjs || true
          timeout 540 node scripts/atlas11/collect_krx_close.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out "reports/atlas11/probe/collect-$(date -u +%Y%m%dT%H%M%S).json" || true
      - if: always()
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          git add -f reports/atlas11/probe tests/atlas11/fixtures/naver-minute
          git commit -m "atlas11 collector check [skip ci]" && git pull --rebase -q && git push
