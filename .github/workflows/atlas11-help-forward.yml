name: atlas11-help-forward
# 고객센터 새 글을 사장님 카톡으로(사장님 2026-10-22(서울) 07:48 「여기에 글을 남기면 카톡 게시물말고 다른 방한나더 별로 만들어 내 카톡으로 오게해라」 · 명령문 docs/design/helpkakao-2026-10-22/order-0748.txt)
#   부르는 이 = Claude 일하는 방(매시 · scripts/atlas11/help/room.mjs) — 이 작업은 넷리파이 저장소(atlas11-help-v1)에서 「보낸 표시」 뒤 새 글만 꺼냄
#   mode=fetch: 방이 준 공개 열쇠(pub)로 잠가 알림 줄(annotations)로 돌려줌 — 기록 줄에는 글 수만 · 사람 글은 맨글로 남지 않음(scripts/atlas11/help/forward.mjs)
#   mode=ack:   방이 카톡을 다 보낸 뒤 「여기까지 보냄」(ack_id) — 앞으로만 옮김
#   선물 신청 알림도 같은 길(사장님 2026-10-25 15:37 「어 오게 해」) — fetch 가 넷리파이 저장소 atlas11-gift-v1 의 새 신청도 함께 잠가 돌려줌(번호 끝 네 자리만)
#     ack_id = 고객센터 글 번호 · 또는 「<고객센터 번호 또는 빈칸>+<선물 신청 번호>」 — 저장소마다 보낸 표시를 따로 옮김(scripts/atlas11/help/forward.mjs splitLast)
#   넷리파이 저장소에 쓰는 것은 「보낸 표시」(fwd/cursor) 하나뿐 · 처음(보낸 표시 없음)에는 사장님 말씀 때(07:48) 뒤 글부터
#   하지 않는 일: 고객 글 고치기 · 사이트에 보내기 · 비밀 값 찍기 · 답 글 보내기(깃허브 권한은 읽기만 · 넷리파이 열쇠는 이 작업 안에서만)
run-name: atlas11-help-forward ${{ inputs.mode }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '부른 방 표시(뜻 없는 짧은 글 — 방이 제가 부른 작업을 이 이름으로 찾음 · 두 방이 함께 불러도 섞이지 않게)'
        required: false
        default: ''
      mode:
        description: 'fetch(새 글 꺼내기) · ack(여기까지 보냄) · probe(시험 글 하나 — 카톡까지 가는지 확인) · giftprobe(시험 선물 신청 하나 — 카톡까지 가는지 확인)'
        required: true
        default: 'fetch'
      pub:
        description: '방의 공개 열쇠(X25519 · base64) — fetch 때'
        required: false
        default: ''
      ack_id:
        description: '보낸 마지막 글 번호 — ack 때'
        required: false
        default: ''
      phone:
        description: '시험 선물 신청 번호 — giftprobe 때(비우면 없는 번호 010-0000-0000 · 사장님 2026-10-25 17:28 「내 휴대폰 번호는 …야」 — 사장님 번호로 시험할 때만)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: atlas11-help-forward
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # forward.mjs 가 이름 한 곳(site/next/brand.js)을 들임(2026-10-27 22:01 5cb612d59) — 이 파일이 빠져 10-28 02시부터 fetch 가 모두 실패했음(틀림 장부 161 · 2026-10-30 고침)
          #   forward.mjs 가 새 파일을 들이면 여기에도 더함(tests/atlas11/help-forward.test.mjs 가 맞댐)
          sparse-checkout: |
            scripts/atlas11/help
            site/next/brand.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 넷리파이 저장소 읽기 준비(@netlify/blobs 하나만 · package.json 은 받지 않아 다른 것은 깔지 않음)
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts @netlify/blobs@11.1.1
      - name: 새 글 꺼내 잠그기(fetch)
        if: ${{ inputs.mode == 'fetch' }}
        env:
          PUB: ${{ inputs.pub }}
        run: node scripts/atlas11/help/forward.mjs --fetch --pub "$PUB" --out sealed.json
      - name: 잠긴 글을 알림 줄로(fetch)
        if: ${{ inputs.mode == 'fetch' }}
        run: node scripts/atlas11/help/forward.mjs --annotate sealed.json
      - name: 시험 글 하나(probe)
        # 사장님 2026-10-22 10:39 「해」(못 한 것 — 진짜 글이 카톡으로 가는지 확인) — 사이트 고객센터 문(/api/help)으로 「[시험]」 글 하나 · 새 기기 표시 · 글은 정해진 한 줄
        if: ${{ inputs.mode == 'probe' }}
        run: |
          KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")
          curl -fsS --max-time 30 -X POST https://aaa7377.com/api/help -H 'content-type: application/json' -H "x-help-key: $KEY" --data '{"op":"send","kind":"note","tone":"good","text":"[시험] 고객센터 글이 사장님 카톡으로 오는지 보는 시험 글이에요. 돌이 만드는 쪽이 보냈어요.","agree":true,"page":"help"}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log('시험 글 ' + (j.ok ? '들어감' : '안 들어감 ' + (j.error ?? '')))}catch{console.log('시험 글 답 꼴이 아님');process.exit(1)}})"
      - name: 시험 선물 신청 하나(giftprobe)
        # 사장님 2026-10-25 17:12 「그래」(물음 「시험 신청 하나로 카톡이 오는지 확인해 볼까요?」) — 사이트 선물 문(/api/gift)으로 새 기기 넷(보내는 이 하나 · 친구 셋 · 둘은 카톡 안)이 열고 시험 신청 하나
        #   번호는 없는 번호 010-0000-0000 · 관리자 화면에 「보낼 차례」로 남음(사장님이 「보냄 표시」를 누르면 지워짐) · 결과는 알림 줄 gift-probe 한 줄(번호 · 열쇠는 찍지 않음)
        if: ${{ inputs.mode == 'giftprobe' }}
        env:
          PROBE_PHONE: ${{ inputs.phone }}
        run: |
          node --input-type=module -e "
          import crypto from 'node:crypto';
          const B = 'https://aaa7377.com/api/gift', key = () => crypto.randomBytes(16).toString('base64url');
          const me = key(), r = crypto.createHash('sha256').update(me).digest('base64url').slice(0, 16), pd = (process.env.PROBE_PHONE || '').replace(/[^0-9]/g, '');
          const KK = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KAKAOTALK 10.8.1';
          for (let i = 0; i < 3; i++) {
            const res = await fetch(B + '/visit', {method: 'POST', headers: {'content-type': 'application/json', 'x-gift-key': key(), 'user-agent': i < 2 ? KK : 'atlas11-probe'}, body: JSON.stringify({r})});
            if (!res.ok) { console.log('::error title=gift-probe::친구 ' + (i + 1) + ' 못 셈 ' + res.status); process.exit(1); }
          }
          const c = await fetch(B + '/claim', {method: 'POST', headers: {'content-type': 'application/json', 'x-gift-key': me}, body: JSON.stringify({phone: pd.length >= 10 && pd.length <= 11 && /^01[016789]/.test(pd) ? pd : '010-0000-0000', agree: true, watched: true})});
          const j = await c.json().catch(() => ({}));
          console.log(c.ok && j.ok ? '::notice title=gift-probe::시험 신청 들어감' : '::error title=gift-probe::시험 신청 안 들어감 ' + c.status + ' ' + (j.error ?? ''));
          process.exit(c.ok && j.ok ? 0 : 1);
          "
      - name: 여기까지 보냄(ack)
        if: ${{ inputs.mode == 'ack' }}
        env:
          ACK_ID: ${{ inputs.ack_id }}
        run: node scripts/atlas11/help/forward.mjs --ack "$ACK_ID"
