name: aaa7377.com 올리기
run-name: aaa7377.com 올리기 · ${{ github.actor }}${{ inputs.preview_sha != '' && ' · 검사 기다림' || '' }}
# 2026-10-05 10:24 사장님 「나 여기서 클릭하면 업로드되게 만들어 줘」 — 이 작업이 그 단추다(파일 이름 atlas11-site.yml 은 그대로라 주소도 그대로)
# 누르는 곳: 이 작업 화면 오른쪽 「Run workflow」 → 펼쳐진 칸의 초록 「Run workflow」 — 2~3분 뒤 aaa7377.com 에 올라감
# 하는 일: 지금 저장소의 판(종가 · 수급 · 기사 · 일정)으로 화면 묶음을 다시 만들어 aaa7377.com 에 올린다
#   옛 판 종가 수집은 하지 않는다 — 그건 평일 16:00(atlas11-daily) · 19:00(atlas11-evening) 자동 실행이 한다
#   새 ATLAS(첫 화면)는 올릴 때마다 회차를 돈다(package.mjs → scripts/atlas11/t365/roll.mjs): 후보 1,378곳 일봉을 받아 그날까지 값으로 365곳을 다시 고르고 기록
#   (사장님 2026-10-11 12:41 「기준은 항상 오늘날짜로 … 업데이트는 하루에 4번 … 업데이트 탭 만들어서 기록」 — 하루 4번은 Claude 예약 작업이 이 작업을 누름 · reason 에 회차 이름)
# 결과: 실행 화면 맨 위 요약 칸에 「올라갔습니다」(주소 · 올린 때 · 파일 수) 또는 「못 올렸습니다 · 까닭」(scripts/atlas11/site_summary.mjs)
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '누른 까닭(예약 작업이 회차 이름을 적음 · 비워 두면 손 올림)'
        required: false
        default: ''
      # 2026-10-18 brief5 길 4 「검사와 묶음 겹치기」 — 넣으면 묶음을 먼저 만들고, 그 커밋의 모든 쪽 검사가 실패 0 이고 코드가 같을 때만 올림(아래 「올리기 전 검사 기다리기」)
      preview_sha:
        description: '올리기 전 검사를 기다릴 커밋(40자) — 비우면 예전 그대로'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: atlas11-daily
  cancel-in-progress: false
jobs:
  site:
    name: aaa7377.com 에 올리기
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.preview_sha != '' && 60 || 30 }} # 검사 기다림(최대 20분)이 있을 때만 60분 · 비우면 예전 그대로 30분
    env:
      TZ: Asia/Seoul
      ATLAS_UPDATE_REASON: ${{ inputs.reason }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: 시작 시각 적기
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: 저장소 받기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # 누른 때가 아니라 일을 시작할 때의 최신 판(같은 줄에 선 매일 실행이 먼저 넣은 기록까지) — 2026-10-12 17:19 손 올리기가 누른 때 판으로 받아 매일 실행 기록과 겹쳐 「기록 남기기」 실패
      - name: 노드 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 준비물 설치
        run: npm ci
      - name: 파이썬 준비(36곳 셈 numpy)
        run: python3 -m pip install --user --break-system-packages -q numpy || python3 -m pip install --user -q numpy
      - name: 화면 묶음 만들기
        run: |
          node scripts/atlas11/build_view.mjs
          node scripts/atlas11/package.mjs --no-full --out out
      - name: 올리기 전 검사 기다리기
        # preview_sha 를 넣었을 때만 — 묶는 동안 돈 모든 쪽 검사(atlas11-next-full.yml -f local=true)의 결과를 main 의 reports/atlas11/probe/next-preview/summary.json 기록에서 찾음
        #   검사한 코드와 이 묶음의 코드가 같고(먼저 맞댐) 그 커밋 · 모든 쪽 · 실패 0 일 때만 통과 → 아래 올리기가 돎
        #   코드 다름 · 검사 실패 · 결과 깨짐 · 20분 안에 결과 없음 → 이 단계가 실패 → 올리지 않고 이번 회차 기록도 남기지 않음(닫힌 쪽으로 실패 · scripts/atlas11/next/wait_preview.mjs)
        id: gate
        if: ${{ inputs.preview_sha != '' }}
        timeout-minutes: 25
        env:
          NETLIFY_AUTH_TOKEN: '' # 이 단계에는 넷리파이 열쇠 · 사이트 번호가 필요 없음
          NETLIFY_SITE_ID: ''
          PREVIEW_SHA: ${{ inputs.preview_sha }}
        run: node scripts/atlas11/next/wait_preview.mjs --sha "$PREVIEW_SHA" --every 30 --max-min 20
      - name: aaa7377.com 에 올리기
        id: deploy
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: node scripts/atlas11/deploy_netlify.mjs --dir dist
      - name: 열렸는지 확인
        if: ${{ always() && env.NETLIFY_AUTH_TOKEN != '' }} # 올리기가 실패해도 사이트 상태(응답 코드)를 남김 — 2026-10-09 넷리파이 Forbidden 까닭 찾기
        continue-on-error: true
        run: node scripts/atlas11/netlify_status.mjs
      - name: 열쇠 없음
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        run: echo "::warning::NETLIFY_AUTH_TOKEN 이 없어 올리지 못했습니다"
      - name: 결과 한 줄(요약 칸)
        if: always()
        continue-on-error: true
        run: node scripts/atlas11/site_summary.mjs --since "${{ steps.start.outputs.at }}" --deploy "${{ (steps.gate.outcome == 'failure' || steps.gate.outcome == 'cancelled') && 'gate' || steps.deploy.outcome }}" --token "${{ env.NETLIFY_AUTH_TOKEN != '' && 'yes' || 'no' }}"
      - name: 기록 남기기
        # 검사 기다림이 막았으면(preview_sha 를 넣고 통과 못 함) 이번 회차 기록(updates · inspect · surge · roll-latest …)을 남기지 않음 — 올라가지 않은 판의 기록을 다음 올리기가 싣지 않게 · 비우면 예전 그대로 always()
        if: ${{ always() && (inputs.preview_sha == '' || steps.gate.outcome == 'success') }}
        shell: bash
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          git add -A reports/
          [ -f deploy/netlify-site.json ] && git add deploy/netlify-site.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "atlas11 site deploy $(date +%Y-%m-%d) [skip ci]"
          # 같은 때 다른 기록이 먼저 들어가면 밀기가 막힘(2026-10-11 12:27 실제로 한 번) — 받아 붙이고 다시 밀기, 다섯 번까지
          # 2026-10-12 17:19 — 같은 「최신」 파일(roll-latest · deploy-latest)을 다른 기록이 먼저 고쳐 rebase 가 부딪히면 그대로 멈춰 다섯 번 모두 실패했음
          #   → 부딪히면 rebase 를 거두고, 겹친 곳은 이번 기록으로(-X theirs = 다시 얹는 이번 커밋) 다시 얹음 · 한 줄씩 붙는 기록(.jsonl)은 .gitattributes union 으로 두 쪽 줄을 모두 남김
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs --autostash -q && git push; then echo "겹친 「최신」 파일은 이번 기록으로 — $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "밀기 다시 $i — 다른 기록이 먼저 들어감"; sleep $((i * 7))
          done
          exit 1
