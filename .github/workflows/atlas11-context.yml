name: atlas11-context
# 관측 수집기만 한 번 돌려 결과를 기록한다(종가·채점·발행은 하지 않음) — 매일 실행 앞 단계와 같은 코드
# 휴장일에 누르면 바로 앞 거래일을 기준일로 모은다(--closed-day last-session · 2026-10-04 밤 일요일에 눌렀을 때 아무것도 안 모였던 일로 더함)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas11-daily
  cancel-in-progress: false
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Context collection
        run: timeout 600 node scripts/atlas11/collect_context.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --closed-day last-session || true
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          git add -A reports/
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "atlas11 context $(date +%Y-%m-%d) [skip ci]" && git pull --rebase -q && git push; fi
