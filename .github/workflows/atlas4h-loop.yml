name: atlas4h-loop
# ATLAS 4시간 엔진 3단계 — 고리 한 바퀴 단추(모으기 → 고리 → 감시 → 장부 올리기).
# 예약 시각 줄은 일부러 넣지 않았다. 사장님이 GitHub 화면에서 직접 붙여 넣는다(atlas4h/loop/cron-lines.md).
# 쓰는 곳은 atlas4h/ledger · atlas4h/raw 뿐이다. 사이트 올리기·화면 파일·다른 워크플로 부르기는 하지 않는다.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto = 지금 시각에 맞는 판 · 00·04·08·12·16·20 중 하나를 고를 수도 있음'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - '00'
          - '04'
          - '08'
          - '12'
          - '16'
          - '20'
      stop:
        description: 'true = 멈춤 단추(그림자 운전 — 봉인·채점만)'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: atlas4h
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 모으기 (지금 값 한 장)
        env:
          # 열쇠는 있을 때만 쓴다(없으면 그 둘째 출처는 빠진다). 수집기는 열쇠를 화면·파일에 쓰지 않는다.
          ATLAS4H_KRX_KEY: ${{ secrets.ATLAS4H_KRX_KEY }}
          ATLAS4H_ECOS_KEY: ${{ secrets.ATLAS4H_ECOS_KEY }}
          ATLAS4H_DART_KEY: ${{ secrets.ATLAS4H_DART_KEY }}
          ATLAS4H_FRED_KEY: ${{ secrets.ATLAS4H_FRED_KEY }}
        # 모으기가 실패해도 고리는 돈다(고리가 「이 바퀴의 장 없음」으로 적는다)
        continue-on-error: true
        run: node atlas4h/collect/collect.mjs --mode now
      - name: 고리 한 바퀴
        env:
          SLOT: ${{ inputs.slot || 'auto' }}
          STOP: ${{ inputs.stop && 'true' || 'false' }}
        shell: bash
        run: |
          set -o pipefail
          node atlas4h/loop/run.mjs --slot "$SLOT" --stop "$STOP" | tee "$RUNNER_TEMP/atlas4h-loop.txt"
      - name: 감시
        if: always()
        run: node atlas4h/loop/watch.mjs
      - name: 기록 올리기
        if: always()
        shell: bash
        env:
          SLOT: ${{ inputs.slot || 'auto' }}
        run: |
          git config user.name atlas4h-bot
          git config user.email atlas4h-bot@users.noreply.github.com
          for p in atlas4h/ledger atlas4h/raw; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 올리지 않음"
            exit 0
          fi
          # 실제로 돈 판 시각(auto 면 고리가 고른 시각) — 못 읽으면 입력값 그대로
          DONE=$(grep -o 'loop-[0-9]\{8\}-[0-9]\{2\}' "$RUNNER_TEMP/atlas4h-loop.txt" 2>/dev/null | head -n 1 | cut -d- -f3 || true)
          SLOT="${DONE:-$SLOT}"
          # 커밋 글은 깃 기록 규칙(atlas4h/harness/commit-rule.md)대로 — 하네스 H5 가 「무엇:」「왜:」를 본다
          {
            echo "atlas4h 고리 ${SLOT}시: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST [skip ci]"
            echo
            echo "무엇: 고리 한 바퀴 slot=${SLOT} — atlas4h/ledger(판·봉인·기준값·채점·고리·감시·지금 값) · atlas4h/raw(원문) 에 덧붙인 줄만 올림"
            echo "왜: 4시간 고리(명령문 <고리>) · 그림자 운전 — 화면은 안 건드림 (workflow 실행 ${GITHUB_RUN_ID})"
            echo
            echo "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
            echo "Claude-Session: https://claude.ai/code/session_0136T4eo8jpTLMmK9LpiQk4A"
          } > "$RUNNER_TEMP/atlas4h-commit-msg.txt"
          git commit -q -F "$RUNNER_TEMP/atlas4h-commit-msg.txt"
          git pull --rebase -q
          git push
