name: atlas11-evening
# ATLAS 11 · 거래일 저녁 7시(KST) — 수급·기사를 다시 모으고(16:00 값은 잠정일 수 있음) 「불장 닮은 7곳」을 다시 세고,
#   그날 판을 기록(public/data/atlas11/evening/<묶음>/<종가 날짜>.json · 한 번 쓰면 고치지 않음)해 바로 앞 기록과 견준 「들고 남」을 화면에 올린다.
#   2026-10-05 05:03 사장님 「매일 7시에 저냑 7시에 불장에서 내오든 불장같은 것이 불장이 된것이든 즉 여러 주건들에 이동이 내영되게 하라」 · 05:07 「해」
# 언제 도나
#   ① 예약 19:00 KST(아래 cron). 주의: GitHub 예약은 cron 줄을 마지막으로 고친 계정의 이름으로 돈다 — 이 줄은 저장소 주인이 GitHub 화면에서
#      한 번 고쳐 저장해야 돈다(atlas11-daily.yml 머리 주석 · 9/30 에 16:00 줄을 '0 7' → '1 7' 로 고친 것과 같은 방법: 여기서는 '0 10' → '1 10').
#   ② 매일 실행(atlas11-daily)이 끝날 때마다 — GitHub 예약이 늦게 오는 날(10/1 · 10/2 의 16:00 예약은 7시간쯤 늦게 옴) 16:00 판이 저녁 7시 뒤에 나오면 그 뒤 바로 기록
#   ③ 손으로(Run workflow)
#   기록은 그 종가 날짜의 저녁 7시가 지난 뒤에만 남긴다(16:00 판이 일찍 끝나도 그날 기록은 저녁 7시 실행이 남김) · 이미 있으면 ①②는 아무것도 하지 않는다(evening_gate.mjs).
on:
  schedule:
    - cron: '0 10 * * 1-5'   # 19:00 KST
  workflow_run:
    workflows: [atlas11-daily]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
# 매일 실행과 같은 줄에 선다 — 둘이 함께 돌며 같은 화면 묶음을 올리다 부딪히지 않게
concurrency:
  group: atlas11-daily
  cancel-in-progress: false
jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Gate (already recorded, or before 19:00 of that close date → stop)
        id: g
        shell: bash
        run: |
          node scripts/atlas11/evening_gate.mjs --event "${{ github.event_name }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Install
        if: steps.g.outputs.skip != 'true'
        run: npm ci
      - name: Context collection (investor flows · news · disclosures — record only)
        if: steps.g.outputs.skip != 'true'
        continue-on-error: true
        run: timeout 900 node scripts/atlas11/collect_context.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --closed-day last-session
      - name: Build view bundle with the evening record
        if: steps.g.outputs.skip != 'true'
        run: node scripts/atlas11/build_view.mjs --record evening
      - name: Package dist/
        if: steps.g.outputs.skip != 'true'
        run: node scripts/atlas11/package.mjs --no-full --out out
      - name: Netlify deploy
        if: ${{ steps.g.outputs.skip != 'true' && env.NETLIFY_AUTH_TOKEN != '' }}
        run: node scripts/atlas11/deploy_netlify.mjs --dir dist
      - name: Commit records
        if: ${{ always() && steps.g.outputs.skip != 'true' }}
        shell: bash
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          git add -A reports/ public/data/atlas11/evening/ public/data/atlas11/view/
          [ -f deploy/netlify-site.json ] && git add deploy/netlify-site.json
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "atlas11 evening $(date +%Y-%m-%d) [skip ci]" && git pull --rebase --autostash -q && git push; fi
