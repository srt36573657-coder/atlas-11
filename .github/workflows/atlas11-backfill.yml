name: atlas11-backfill
# 지난 기록 모으기(3년치) — 사장님이 버튼을 눌러야만 돈다(예약 없음). 예측 숫자·발행·채점은 하지 않는다.
#   2026-10-02 14:31 사장님 「일단 그렇게 해봐」: 매일 관측만 하던 재료 13가지 → 모으기 → 시험 → 좋아진 것만 켜기
#   모으는 것: FRED 거시(전체 기록 CSV) · 네이버 국고채·환율·유가·해외지수 · 52종목 투자자 동향(외국인·기관·개인 + 거래량)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas11-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backfill (3 years)
        run: timeout 2400 node scripts/atlas11/backfill_context.mjs --from 2023-01-01 --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          git add -A reports/atlas11/backfill reports/atlas11/raw/backfill
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "atlas11 backfill $(date +%Y-%m-%d) [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done; fi
