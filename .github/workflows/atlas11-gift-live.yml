name: atlas11-gift-live
# 친구 셋 선물 — 진짜 사이트에서 화면으로 끝까지 시험(사장님 2026-10-26(서울) 11:47 「지인이 카톡 3명 보냈는데 내게 알람 오지 않았어 시스템 문제 있어 확인해」)
#   보내는 사람(새 기기)이 회사 쪽 노란 「카톡 보내기」 → 글상자 「보내기」(휴대폰 공유 창은 가로채 주소만 봄) → 보낸 주소에 보낸 사람 표(r)가 있나
#   → 새 기기 셋(둘은 카톡 안)이 그 주소를 엶 → 서버가 셈(/api/gift/visit) → 보낸 사람 화면 수(/api/gift/me)가 친구 3명인가
#   신청은 하지 않음(전화번호 없음 · 사장님 카톡 알림 없음) · 진짜 저장소에 시험 연 기록 셋이 남음 · 결과는 알림 줄 gift-live 몇 줄(표 · 열쇠는 찍지 않음)
run-name: atlas11-gift-live
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: atlas11-gift-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저 준비(probe 와 같은 판)
        run: mkdir -p /tmp/pw && cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null
      - name: 화면으로 끝까지 시험
        run: |
          node --input-type=module -e "
          import {createRequire} from 'node:module';
          const require = createRequire('/tmp/pw/node_modules/');
          const {chromium} = require('playwright');
          const say = t => console.log('::notice title=gift-live::' + t);
          const bad = t => { console.log('::error title=gift-live::' + t); process.exitCode = 1; };
          const B = 'https://aaa7377.com', KK = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KAKAOTALK 10.8.1';
          const b = await chromium.launch();
          const seed = c => c.addInitScript(() => { try { localStorage.setItem('atlas:essence-seen', 'true'); localStorage.setItem('atlas:white-seen', 'true'); } catch (e) {} });
          const A = await b.newContext({viewport: {width: 390, height: 844}}); await seed(A);
          await A.addInitScript(() => { window.__shared = []; Object.defineProperty(Navigator.prototype, 'share', {configurable: true, value: async function (d) { window.__shared.push({url: d && d.url}); }}); });
          const pa = await A.newPage();
          await pa.goto(B + '/#/w/005930', {waitUntil: 'domcontentloaded'});
          await pa.waitForSelector('#view .acts .kk-yel', {timeout: 30000});
          await pa.waitForFunction(() => !!localStorage.getItem('atlas:gift:ref'), null, {timeout: 20000}).catch(() => {});
          const myRef = await pa.evaluate(() => localStorage.getItem('atlas:gift:ref'));
          await pa.locator('#view .acts .kk-yel').first().click();
          await pa.waitForSelector('.ps-dlg .ps-go', {timeout: 15000});
          await pa.locator('.ps-dlg .ps-go').click();
          await pa.waitForFunction(() => window.__shared.length > 0, null, {timeout: 15000}).catch(() => {});
          const sh = await pa.evaluate(() => window.__shared);
          const url = sh.length ? sh[sh.length - 1].url : null;
          let r = null; try { r = new URL(url).searchParams.get('r'); } catch (e) {}
          let where = '?'; try { const u = new URL(url); where = u.pathname + ' ' + u.hash.slice(0, 4); } catch (e) {}
          if (!url || !r || r !== myRef) bad('보낸 주소에 보낸 사람 표가 없음 · ' + where);
          else say('보낸 주소에 보낸 사람 표 있음 · ' + where);
          if (url) for (let i = 0; i < 3; i++) {
            const F = await b.newContext({viewport: {width: 390, height: 844}, userAgent: i < 2 ? KK : undefined}); await seed(F);
            const pf = await F.newPage(); let n = 0;
            pf.on('response', q => { if (q.url().includes('/api/gift/visit') && q.status() === 200) n++; });
            await pf.goto(url, {waitUntil: 'domcontentloaded'}); await pf.waitForTimeout(7000);
            const left = await pf.evaluate(() => /[?&]r=/.test(location.search));
            say('친구 ' + (i + 1) + (i < 2 ? ' 카톡 안' : '') + ' · 셈 요청 ' + n + ' · 주소에서 표 지움 ' + !left);
            await F.close();
          }
          const me = await pa.evaluate(async () => { const k = localStorage.getItem('atlas:gift:key'); const q = await fetch('/api/gift/me', {headers: {'x-gift-key': k}, cache: 'no-store'}); return q.ok ? q.json() : {status: q.status}; });
          if (me && me.friends === 3) say('보낸 사람 화면 수 = 친구 ' + me.friends + '명 · 카톡 안 ' + me.kk + ' · 신청할 수 있음 ' + me.can);
          else bad('보낸 사람 수가 3 이 아님 · ' + JSON.stringify(me).slice(0, 120));
          await b.close();
          "
