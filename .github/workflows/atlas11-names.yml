# ATLAS 한국 회사 영어 이름 받기 — 2026-10-06 20:33 사장님 「친구가 중국 그리고 미국인이야 언어팩을 만들어 줘야해」
#   영어판(/en) · 중국어판(/zh)에서 한국 회사 이름을 영어로 보이려고 야후 파이낸스 종목 정보의 영문 정식 이름을 한 번 받아 둔다
#   (네이버 증권 · 한국거래소 목록에는 회사 영어 이름 칸이 없거나 로그인이 필요했음 — 2026-10-06 20:37 · 20:51 실행).
#   결과는 public/data/atlas11/names-kr.json 한 파일만 적는다 — 판 · 기록 파일은 건드리지 않는다. 사이트에 올리지는 않는다.
#   예약(cron)은 두지 않는다 — 회사 목록이 바뀌었을 때만 「Run workflow」(docs/ATLAS_원칙.md 규칙 7).
name: 한국 회사 영어 이름 받기
#   2026-10-15(싱가포르) 23:35 사장님 「언어팩을 선태기하면 아틀란스가 영어로 나오게 하라」 — 입력 scope=all 이면 새 ATLAS 찾기 목록 모두(회사 주식 · 그 밖)를
#   scripts/atlas11/t365/names_en.mjs 로 받아 public/data/atlas11/names-en-all.json 한 파일만 적는다(옛 365곳 받기는 그대로).
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'old365 = 옛 365곳(names-kr.json) · all = 새 ATLAS 찾기 목록 모두(names-en-all.json)'
        required: false
        default: old365
        type: choice
        options: [old365, all]
permissions:
  contents: write
concurrency:
  group: atlas11-names
  cancel-in-progress: false
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 영어 이름 받기(365곳)
        if: inputs.scope != 'all'
        run: timeout 1500 node scripts/atlas11/collect_names.mjs
      - name: 영어 이름 받기(새 ATLAS 찾기 목록 모두)
        if: inputs.scope == 'all'
        run: timeout 6000 node scripts/atlas11/t365/names_en.mjs --jobs 3
      - name: 기록 올리기(names-kr.json · names-en-all.json 만)
        if: always()
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          F=public/data/atlas11/names-kr.json; [ "${{ inputs.scope }}" = all ] && F=public/data/atlas11/names-en-all.json
          [ -f "$F" ] || { echo "받은 것 없음"; exit 1; }
          git add -f "$F"
          git commit -q -m "atlas11 names ${{ inputs.scope || 'old365' }} [skip ci]" || { echo "올릴 것 없음"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 7; done
          exit 1
