name: atlas11-su-now
run-name: 지금 시장 받기 · ${{ github.event_name == 'schedule' && '예약' || github.actor }}
# 주문 1118-1239 · 사장님 2026-11-18(마카오) 12:39 「코스닥 지수 · 코스피 지수 · 외국인 수급 … 첫 화면에 보이게 … 하루에 세 번 … 아침 10시 · 오후 두시 · 장이 끝나고 6시 …
#   그때 상황에 맞게끔 우리 손자병법이 어떤 지략으로 이 시장을 상대해야 되는 것인가 … 반응형」 · 12:48 「응」 — docs/design/su-now-2026-11-18/order-1239.txt
# 한국 시각 10:01 · 14:01 · 18:01(평일) — 코스피 · 코스닥 지수 · 시장 전체에서 외국인 · 기관 · 개인이 사고판 돈 · 판 회사 그때 값을 받아 reports/atlas11/su-now/ 에 적고
#   곧바로 aaa7377.com 올리기(atlas11-site.yml · 검사 기다림 없이 — 코드는 그대로 · 자료만 새로)를 눌러 첫 화면 「지금 시장」 칸 · 지금 땅 · 지금 볼 꾀를 새로 셈
# 다른 예약(16:01 · 16:07 · 16:37 매일 · 19:00 저녁 · 20:23 · 21:47 고르기 · 매시 58분 올리기)과 시각이 겹치지 않음 · 매일 · 저녁 예약 파일은 고치지 않음(규칙 7)
# 누르는 것은 Claude 예약 작업 「손자병법 지금 시장 받기」(평일 한국 10:01 · 14:01 · 18:01) 하나뿐 — 깃허브 자체 예약(cron) 세 줄은 지움
#   주문 1119-0218 · 사장님 2026-11-19(마카오) 02:18 「응」(물음 「늦게 도는 깃허브 자체 예약은 지울까요?」의 답) — cron 이 제때 돌지 않고 몇 시간 늦은
#   한국 02:56 에 돌아(run 44364116077) 같은 값을 한 번 더 받고 올리기를 한 번 더 누름 · docs/design/su-now-2026-11-18/order-0218.txt · 틀림 장부 239
on:
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: atlas11-su-now
  cancel-in-progress: false
jobs:
  now:
    name: 지금 시장 받기
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 장이 늦게 여는 날 아침 회차는 장이 연 지 한 시간 뒤까지 기다림(주문 1119-0226) · 평소는 1~2분
    env:
      TZ: Asia/Seoul
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
        with:
          ref: main
      - name: 노드 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # 주문 1119-0226 · 사장님 2026-11-19(마카오) 02:26 「응」(물음 「수능 날처럼 장이 늦게 여는 날은, 받는 때를 스스로 늦추게 할까요?」의 답)
      #   늦게 여는 날 = docs/design/su-now-2026-11-18/late-open.json 의 days(수능 날 등) + 새해 첫 거래일(스스로 셈 · 오전 10시 개장)
      #   그날 한국 09:00 부터 「연 때 + 61분」 전에 누르면 그때까지 기다렸다가 받음(10:00 에 열면 11:01) · 밤에 손으로 누른 것 · 목록을 못 읽은 때는 기다리지 않음
      - name: 장이 늦게 여는 날이면 장이 연 지 한 시간 뒤까지 기다리기
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as D, json, os, time
          K = D.timezone(D.timedelta(hours=9))
          now = D.datetime.fromisoformat(os.environ['NOW_ISO']).astimezone(K) if os.environ.get('NOW_ISO') else D.datetime.now(K)
          try:
              cal = json.load(open('docs/design/su-now-2026-11-18/late-open.json', encoding='utf-8'))
          except Exception as e:
              print('늦게 여는 날 목록을 못 읽음 — 기다리지 않음:', e); raise SystemExit(0)
          day = now.date().isoformat()
          e = next((x for x in cal.get('days', []) if x.get('day') == day), None)
          if e is None:
              hol = set(cal.get('janHolidays', {}).get(str(now.year), []))
              d = D.date(now.year, 1, 2)
              while d.weekday() >= 5 or d.isoformat() in hol:
                  d += D.timedelta(days=1)
              if d.isoformat() == day:
                  e = {'day': day, 'open': '10:00', 'why': '새해 첫 거래일(스스로 셈)'}
          if e is None:
              print(day, '늦게 여는 날 목록에 없음 — 기다리지 않음'); raise SystemExit(0)
          h, m = map(int, e['open'].split(':'))
          target = now.replace(hour=h, minute=m, second=0, microsecond=0) + D.timedelta(minutes=61)
          morning = now.replace(hour=9, minute=0, second=0, microsecond=0)
          if not (morning <= now < target):
              print(day, e.get('why', ''), '— 늦게 여는 날이지만 아침 회차가 아님 · 기다리지 않음'); raise SystemExit(0)
          wait = (target - now).total_seconds()
          print(f"{day} {e.get('why', '')} — {e['open']} 에 엶 · 한국 {target:%H:%M} 까지 {int(wait // 60)}분 {int(wait % 60)}초 기다림")
          if not os.environ.get('DRY'):
              time.sleep(wait)
          PY
      - name: 지금 시장 받기(지수 · 사고판 돈 · 판 회사 그때 값)
        run: node scripts/atlas11/next/su_now.mjs
      - name: 적은 것 넣기
        shell: bash
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          git add reports/atlas11/su-now/
          if git diff --cached --quiet; then echo "적을 것 없음"; exit 0; fi
          git commit -q -m "atlas11 지금 시장 $(date +%Y-%m-%d) $(date +%H:%M) [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            sleep $((i * 7))
          done
          echo "::error::넣기 실패"; exit 1
      - name: aaa7377.com 올리기 누르기(첫 화면 지금 시장 · 지금 땅 · 지금 볼 꾀)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atlas11-site.yml --ref main -f reason="지금 시장 $(date +%H:%M)"
