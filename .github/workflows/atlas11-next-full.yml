name: atlas11-next-full
# 새 아틀란스 모든 쪽 검사 — 실제 사이트(aaa7377.com)에서 쪽마다 따로 돌림(사장님 2026-10-17 04:04 「첫화면 부터 마지막 페이지 까지 모두 바꿔」 · 04:23 「정말 빠르면서도 정밀하게 … 에이전트 총 동원해」 · 규칙 74)
#   쪽 검사 check_<이름>.mjs = 지금 아틀란스(/atlas/)의 그 쪽과 새 쪽(/next/?dev=1)을 같은 자료로 열어 숫자 · 글 · 고리를 맞댐(모든 회사 · 모든 칸)
#   쪽마다 다른 실행기에서 함께 돌고, 결과는 마지막에 한 번에 reports/atlas11/probe/next-full/ 로 올림 · 사이트를 바꾸지 않음(읽기만)
# 2026-10-17 고도리(규칙 76 「빠르고 정밀하게 — 무거운 화면 검사는 깃허브 여러 대」 · 자세히 docs/design/godori-2026-10-17/ci.md):
#   · 영어 검사(en — 혼자 38분)를 en1 ~ en6 여섯 대로 나눠 함께 돌림: next_en_check.mjs --shard k/6 = 한 번 다 돌 때와 같은 일감을 겹침 · 빠짐 없이 가름
#     gather 가 몫을 하나로 합침(--merge — 몫이 모두 · 같은 일감 목록인지도 맞댐) → summary.json 에는 en 한 줄(몫이 모두 0 일 때만 0 · seconds = 가장 긴 몫)
#   · local = 올리기 전 검사: 이 가지(--ref)를 실행기 안에서 묶어(package.mjs) 시험 서버(invite_dev.mjs · 127.0.0.1:8826)로 띄우고 같은 검사를 돌림
#     자료(/atlas/data)는 지금 사이트 것을 한 번만 받아(plan · dist-manifest.json 의 sha256 로 한 판인지 맞대 봄) 모든 검사가 같은 것을 씀 — 올린 뒤와 같은 자료
#     (저장소의 site/atlas/data 는 손으로 커밋할 때만 바뀌어 며칠 묵음 — 묵은 자료로 돌면 없는 실패가 남 · 2026-10-17 첫 시험) · data=stored 면 저장소 자료 · 못 받으면 저장소 자료로 돌고 적음
#     결과는 reports/atlas11/probe/next-preview/ (next-full 은 건드리지 않음 · 커밋 글에 preview · 가지 · 커밋 번호) · 사이트에는 아무것도 올리지 않음
#   · 쓰는 법: gh workflow run atlas11-next-full.yml -R srt36573657-coder/atlas-11 --ref <가지> -f local=true
# 2026-10-18 고도리 길 1(C1 · 사장님 10:09 「속도를 지금보다 10배 빠르게」) — 일 나누기를 걸린 초로(scripts/atlas11/next/shard/plan.mjs):
#   · en · co · range · past · grow 는 --shard k/n 몫으로 가름(몫 하나 = 작업 하나 · 일감 하나는 꼭 한 몫 — shard/part.mjs) · 나머지 쪽은 목표 초 안에서 한 작업에 묶음 · 작업 20개까지
#   · 몫 수는 셈으로(동시 P 대에서 끝나는 때 어림이 가장 이른 것) · 손으로: -f en_shards=12 · -f split=co=2,past=3(1 이면 안 나눔)
#   · 동시: local 20 · live 6(2026-10-18 오후 10 → 6 되돌림 · 오전 6 → 10 — rivals 는 모든 회사를 미리 받지 않고 받을 때도 4개씩 · 옛 쪽 기준값 다시 받기도 4개씩)
#   · gather 가 몫을 쪽 하나로 합침(en = next_en_check --merge · 나머지 = shard/merge.mjs — 몫 1 ~ n 한 번씩 · 같은 일감 목록 · 몫 합 = 전체)
#     → summary.json 은 그대로 쪽마다 한 줄(몫이 모두 0 일 때만 0 · seconds = 가장 긴 몫 · shards · codes · shardSeconds) · ok 는 모든 쪽이 0 일 때만
#   · 브라우저 받기는 작업 맨 처음에 뒤에서(저장소 받기 · 묶기와 겹침) — 검사 앞에서 끝나기를 기다림 · 못 받으면 그 작업은 실패(결과 없음 → 99)
on:
  workflow_dispatch:
    inputs:
      pages:
        description: '쪽 이름(쉼표) — 비우면 모두'
        required: false
        default: ''
      local:
        description: '올리기 전 검사 — 이 가지를 실행기 안에서 묶어 띄우고 검사(결과 next-preview)'
        type: boolean
        required: false
        default: false
      data:
        description: 'local 일 때 자료 — live = 지금 사이트 자료(올린 뒤와 같음) · stored = 저장소 site/atlas/data'
        type: choice
        options: [live, stored]
        required: false
        default: live
      en_shards:
        description: '영어 검사를 몇 대로 나눌지(비우면 걸린 초로 셈 · 1 ~ 20)'
        required: false
        default: ''
      split:
        description: '다른 쪽 몫 수(예 co=2,past=3 · 1 이면 안 나눔 · 비우면 걸린 초로 셈 — en · co · range · past · grow)'
        required: false
        default: ''
      old_refresh:
        description: '옛 쪽 기준값을 있어도 새로 찍기(--old-refresh — 보통은 옛 화면이 쓴 파일이 바뀌면 저절로 새로 찍음)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  actions: read # page 가 같은 실행의 data 일(지금 사이트 자료)이 끝났는지 보고 그 자료를 받음(gh api · gh run download · 2026-10-18)
# 지금 사이트 검사(live)는 한 번에 하나 — 2026-10-17 11:44 두 실행이 aaa7377.com 을 함께 두드려 co 926초 · rivals · cond 시간 넘음이 남
# 올리기 전 검사(local)는 가지마다 하나(사이트를 두드리지 않음 · 다른 가지끼리는 함께) · 기다리는 실행은 뒤에 온 것이 갈음(깃허브 동작)
concurrency:
  group: ${{ inputs.local && format('atlas11-next-full-local-{0}', github.ref_name) || 'atlas11-next-full-live' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
      shards: ${{ steps.p.outputs.shards }}
      split: ${{ steps.p.outputs.split }}
      t0: ${{ steps.p.outputs.t0 }}
    steps:
      - uses: actions/checkout@v4
        with: # 쪽 이름만 셈 — 검사 폴더만 받음(저장소 전체를 받으면 30초)
          sparse-checkout: scripts/atlas11/next
          filter: blob:none
      - id: p
        env:
          WANT: ${{ inputs.pages }}
          NS: ${{ inputs.en_shards }}
          SPLIT: ${{ inputs.split }}
          LOCAL: ${{ inputs.local }}
          PAR: ${{ inputs.local && 20 || 6 }} # 아래 page 의 max-parallel 과 같은 수(두 곳 같게)
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          # 일 목록 — 쪽마다 걸린 초(깃허브 실측)로 몫 수 · 묶음을 정함: list = [{job, pages, base, shard}] (몫 작업 = base · shard k/n) · split = {쪽: 몫 수}
          #   긴 일부터(깃허브는 이 차례로 시작) · 모르는 새 검사는 제 작업 하나로 맨 앞 · 자세히 scripts/atlas11/next/shard/plan.mjs 머리 글
          node scripts/atlas11/next/shard/plan.mjs
          echo "local=${{ inputs.local }}"
  data: # 지금 사이트 자료(local) — plan · page 와 함께 돎: page 는 저장소 받기 · 묶기를 끝낸 뒤 이 일이 끝나기를 기다려 자료를 받음(2026-10-18 C1 — 전에는 plan 안이라 page 가 이것(49 ~ 63초)을 기다리며 시작 못 함)
    if: ${{ inputs.local && inputs.data != 'stored' }}
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.d.outputs.data }}
      asof: ${{ steps.d.outputs.asof }}
      built: ${{ steps.d.outputs.built }}
      dsecs: ${{ steps.d.outputs.secs }}
      dwhy: ${{ steps.d.outputs.why }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 지금 사이트 자료 받기(local — 한 번만 받아 모든 검사가 같은 판을 씀)
        id: d
        if: ${{ inputs.local && inputs.data != 'stored' }}
        run: |
          # 파일 목록 · sha256 = 지금 사이트의 dist-manifest.json(올릴 때 package.mjs 가 dist 모든 파일로 씀) — 파일마다 그 판의 sha256 과 맞아야 받음
          #   → 받은 것은 모두 한 판(받는 사이 올림이 끼면 바뀐 파일이 sha256 다름으로 걸려 새 목록으로 처음부터 · 세 번까지)
          # 넷리파이를 세게 두드리지 않게 한 번에 8개(24개는 막혀 8분 넘게 걸림) · 3분 안에 못 받으면 저장소 자료로 돎(까닭 · 셈 = summary.json 의 data)
          node --input-type=module - <<'EOF'
          import fs from 'node:fs'; import path from 'node:path'; import {createHash} from 'node:crypto';
          const B = 'https://aaa7377.com/', OUT = 'live-data', T0 = Date.now(), BUDGET = 180e3, C = 8;
          const sha = b => createHash('sha256').update(b).digest('hex'), wait = ms => new Promise(r => setTimeout(r, ms)), sec = () => Math.round((Date.now() - T0) / 1000);
          const st = {req: 0, http: {}, sha: 0, err: {}};
          const put = kv => fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(kv).map(([k, v]) => `${k}=${String(v).replace(/[\r\n]+/g, ' ')}`).join('\n') + '\n');
          async function get(f, want = null, tries = 6) {
            let last = '', shaBad = 0;
            for (let i = 0; i < tries; i++) {
              if (Date.now() - T0 > BUDGET) throw Error('시간 넘음 ' + f);
              st.req++;
              try {
                const r = await fetch(B + f, {signal: AbortSignal.timeout(20000)});
                if (r.ok) { const b = Buffer.from(await r.arrayBuffer()); if (!want || sha(b) === want) return b; st.sha++; last = 'sha256 다름'; if (++shaBad >= 2) break; } // 두 번 다르면 올림이 낀 것 — 새 목록으로
                else { st.http[r.status] = (st.http[r.status] || 0) + 1; last = 'HTTP ' + r.status; if (r.status === 404) break; if (r.status === 429 || r.status === 503) await wait(Math.min(10, Number(r.headers.get('retry-after')) || 3) * 1000); }
              } catch (e) { const k = String(e?.cause?.code || e?.name || e?.message || e).slice(0, 40); st.err[k] = (st.err[k] || 0) + 1; last = k; }
              await wait(400 * (i + 1));
            }
            throw Error(f + ' ' + last);
          }
          try {
            let ok = false, note = '';
            for (let round = 1; round <= 3 && !ok; round++) {
              const man = JSON.parse(await get('dist-manifest.json', null, 8)), files = Object.keys(man.hashes ?? {}).filter(f => f.startsWith('atlas/data/')).sort();
              if (!files.includes('atlas/data/mkt.json') || !files.includes('atlas/data/core.json')) throw Error('dist-manifest.json 에 atlas/data 가 없음');
              fs.rmSync(OUT, {recursive: true, force: true});
              let i = 0, bytes = 0; const bad = [];
              await Promise.all(Array.from({length: C}, async () => { while (i < files.length && bad.length < 12) { const f = files[i++]; try { const b = await get(f, man.hashes[f]); fs.mkdirSync(path.dirname(path.join(OUT, f)), {recursive: true}); fs.writeFileSync(path.join(OUT, f), b); bytes += b.length; } catch (e) { bad.push(String(e.message)); } } }));
              if (!bad.length) {
                ok = true; const asOf = JSON.parse(fs.readFileSync(path.join(OUT, 'atlas/data/mkt.json'), 'utf8')).asOf;
                put({data: 'live', asof: asOf, built: man.builtAt, secs: sec(), files: files.length});
                console.log(`지금 사이트 자료 ${files.length}개 · ${(bytes / 1e6).toFixed(1)}MB · sha256 모두 맞음(한 판) · 고른 날 ${asOf} · 묶은 때 ${man.builtAt} · ${sec()}초 · ${JSON.stringify(st)}`);
              } else { note = `${round}번째 ${i}/${files.length}에서 멈춤 — 못 받은 것 ${bad.length}(${bad.slice(0, 2).join(' · ')})`; console.log(note); }
            }
            if (!ok) throw Error(note);
          } catch (e) {
            const why = String(e?.message ?? e).slice(0, 160) + ' · ' + JSON.stringify(st);
            put({data: 'stored', why, secs: sec()});
            console.log('지금 사이트 자료를 못 받음 — 저장소 자료로 돎 · ' + why);
          }
          EOF
      - uses: actions/upload-artifact@v4
        if: ${{ steps.d.outputs.data == 'live' }}
        with:
          name: live-data
          path: live-data/
          retention-days: 1
          if-no-files-found: error
  page:
    name: page (${{ matrix.job }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # 지금 사이트(live)는 한 번에 6대(2026-10-18 오후 10 → 6 되돌림 — 10대로 돈 실제 사이트 검사 네 번 모두 쪽 열기 · 누르기가 멈춤(문서 받기 33초) · 쪽 하나씩 다시 돌리면 0 · 어제 6대 실패 0)(2026-10-18 오전 · 6 → 10) — 넷리파이가 한꺼번에 몰리는 것을 막아 「자료를 못 받음」 · 시간 넘음이 남(2026-10-17 12:24 · 16대 + 다른 검사 · 그때 rivals 는 2,557개를 24개씩)
      # 올리기 전(local)은 실행기마다 제 시험 서버라 모두 한꺼번에 · 이 수를 바꾸면 plan 의 PAR 도 같게
      max-parallel: ${{ inputs.local && 20 || 6 }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.list) }}
    env:
      LOCAL: ${{ inputs.local && '1' || '0' }}
      PAGES: ${{ matrix.pages }}
      PIECE_OF: ${{ matrix.base }} # 몫 작업이면 쪽 이름(예 co) · 아니면 빈칸
      PIECE: ${{ matrix.shard }} # 몫 작업이면 k/n · 아니면 빈칸
    steps:
      - name: 브라우저 준비(뒤에서 — 저장소 받기 · 묶기와 겹침 · 검사 앞에서 기다림)
        run: | # npm 저장소는 따로(/tmp/pw/.npm — setup-node 의 npm 캐시를 풀어 놓는 것과 겹치지 않게)
          mkdir -p /tmp/pw
          nohup bash -c 'cd /tmp/pw && npm_config_cache=/tmp/pw/.npm npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && ./node_modules/.bin/playwright install --with-deps chromium >/dev/null; echo $? > /tmp/pw/.done' > /tmp/pw.log 2>&1 &
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ inputs.local && 'npm' || '' }}
      - name: 올리기 전 — 이 가지를 묶어 시험 서버로 띄움
        if: ${{ inputs.local }}
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_DATA: ${{ inputs.data }}
        run: |
          t0=$(date +%s)
          npm ci --omit=dev --no-audit --no-fund >/tmp/npm.log 2>&1 || { tail -c 2000 /tmp/npm.log; exit 1; }
          # 묶기(dist/) — 실행기에서도 종가를 새로 받지 않음(GITHUB_ACTIONS=false · 저장소 자료 그대로) · 네 눈 점검은 짧게(사이트 올리기 때는 눈마다 1,000만 번 그대로)
          GITHUB_ACTIONS=false ATLAS_INSPECT_N=20000 node scripts/atlas11/package.mjs --no-full --out ../out >/tmp/pack.log 2>&1 || { tail -c 3000 /tmp/pack.log; exit 1; }
          tail -n 2 /tmp/pack.log | cut -c1-400
          # 자료 받기 — 함께 도는 data 일이 끝나기를 기다림(4초마다 · 4분까지 · data=stored 면 안 기다림) → 그 실행의 live-data 를 받음 · 못 받으면 저장소 자료로 돌고 exit.json 의 data 에 적음
          if [ "$WANT_DATA" != stored ]; then
            w0=$(date +%s)
            for i in $(seq 1 60); do
              st=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name == "data") | .status' 2>/tmp/gh.err) || { echo "data 일을 못 봄 — $(head -c 200 /tmp/gh.err)"; break; }
              [ "$st" = completed ] && break
              sleep 4
            done
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n live-data -D live-data >/tmp/dl.log 2>&1 || echo "live-data 못 받음 — 저장소 자료로($(head -c 200 /tmp/dl.log))"
            echo "data 일 기다림 $(( $(date +%s) - w0 ))초"
          fi
          # 자료 — data 일이 받은 지금 사이트 판(sha256 맞댄 것)으로 dist/atlas/data 를 통째로 바꿈 · 없으면 저장소 자료 그대로
          if [ -f live-data/atlas/data/mkt.json ]; then rm -rf dist/atlas/data && mkdir -p dist/atlas/data && cp -r live-data/atlas/data/. dist/atlas/data/ && src=live; else src=stored; fi
          # 새 화면 작은 자료(dist/next/data 의 home-summary · median20) — 바꿔 넣은 지금 사이트 자료로 다시 셈(올리기의 package.mjs 가 굴린 자료로 buildData 하는 것과 같게 · 2026-10-18 주인)
          #   묶을 때(package.mjs)는 저장소 자료로 셈했으므로 · 못 만들면 그 파일은 그대로 두고 감(올리기와 같음 — 검사가 다름을 잡음)
          if [ "$src" = live ]; then node scripts/atlas11/next/build_data.mjs --site dist > /tmp/bd.log 2>&1 || echo "새 화면 작은 자료 못 만듦(지금 사이트 자료로)"; tail -n 3 /tmp/bd.log | cut -c1-300; fi
          echo "DATA=$src $(node -p 'require("./dist/atlas/data/mkt.json").asOf' 2>/dev/null || echo '?')" >> "$GITHUB_ENV"
          # 시험 서버 — 넷리파이처럼 dist/ 를 내보냄(보안 머리말 · /api/letter · /api/invite 포함) · 열쇠는 이 실행기에서만 쓰는 시험 열쇠(진짜 열쇠 아님)
          key=$(node -e 'process.stdout.write(require("crypto").randomBytes(24).toString("base64url"))')
          echo "ATLAS_DEV_OWNER_KEY=$key" >> "$GITHUB_ENV" # 진화 칸 검사(check_jinhwa)가 「사장님 열쇠 기기」 길을 시험 — 이 실행기에서만 쓰는 시험 열쇠(진짜 열쇠 아님 · 사장님 2026-10-18 16:39 [9] 1)
          nohup node scripts/atlas11/invite_dev.mjs --dir dist --port 8826 --owner-key "$key" >/tmp/dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fs -o /dev/null http://127.0.0.1:8826/next/ 2>/dev/null && curl -fs -o /dev/null http://127.0.0.1:8826/atlas/data/core.json 2>/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8826/next/ || { cat /tmp/dev.log; exit 1; }
          echo "BUILD_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          echo "묶고 띄움 $(( $(date +%s) - t0 ))초 · $(head -c 300 /tmp/dev.log)"
      # 옛 쪽 기준값(scripts/atlas11/next/oldsnap.mjs · 명령문 [1] 9) — 앞 실행이 찍은 것을 받아 둠 · 검사가 옛 화면이 쓴 파일 sha256 을 모두 맞대 보고 같을 때만 씀(다르면 새로 찍음)
      - uses: actions/cache/restore@v4
        if: ${{ !cancelled() }}
        with:
          path: oldsnap
          key: oldsnap-v1-${{ matrix.job }}-${{ github.run_id }}
          restore-keys: oldsnap-v1-${{ matrix.job }}-
      - name: 검사
        if: ${{ !cancelled() }}
        env:
          OLD_REFRESH: ${{ inputs.old_refresh && '1' || '0' }}
        run: |
          mkdir -p out oldsnap
          # 브라우저 — 맨 처음 뒤에서 받기 시작한 것이 끝나기를 기다림(5분까지) · 못 받았으면 이 작업은 실패(쪽 결과 없음 → 모으기가 99 로 적음)
          for i in $(seq 1 900); do [ -s /tmp/pw/.done ] && break; sleep 1; done # 15분까지(2026-10-22 20:48 ~ 21:26 세 번 연달아 작업 몇 개가 5분 안에 브라우저를 못 받아 결과 없이 끝남 — 코드와 무관)
          if [ "$(cat /tmp/pw/.done 2>/dev/null)" != 0 ]; then echo "브라우저 준비 실패($(cat /tmp/pw/.done 2>/dev/null || echo 시간 넘음))"; tail -c 3000 /tmp/pw.log; exit 1; fi
          snap0=$(cat oldsnap/*.json 2>/dev/null | sha256sum | cut -c1-16)
          # 쪽마다 시간 끝 — 작업 시간(75분) 안에서 남은 만큼만(60분 뒤 끝) · 넘기면 그 쪽만 끊고(124) 끝 글을 남김 · 시간이 모자라면 뒤 쪽은 97
          #   (2026-10-20 실제 사이트 큰 시험: 한 작업이 75분을 넘겨 통째로 끊겨 쪽 넷이 「결과 없음」(99) — 어느 쪽이 왜 오래 걸렸는지 글이 남지 않던 것)
          end=$(( $(date +%s) + 3600 ))
          base=https://aaa7377.com; mode=live
          if [ "$LOCAL" = 1 ]; then base=http://127.0.0.1:8826; mode=local; fi
          for n in $PAGES; do # 쪽 하나씩(묶음은 차례로 · 몫 작업은 몫 하나) · 쪽마다 결과 셋(json · exit.json · tail.txt — 이름은 몫 이름 그대로 · 예 co2)
            t0=$(date +%s)
            pg=$n; sh=""
            if [ -n "$PIECE" ]; then pg=$PIECE_OF; sh="--shard $PIECE"; fi # 몫 하나 — 일감을 가르는 셈은 검사 안(shard/part.mjs · 영어는 next_en_check)
            case "$pg" in
              next) f=next_check.mjs; extra="" ;;
              en) f=next_en_check.mjs; extra="--modules --dev 0 --all $sh" ;;
              chx|grow|rivals) f="check_$pg.mjs"; extra="--all --old-snap oldsnap/$n.json $sh"; if [ "$OLD_REFRESH" = 1 ]; then extra="$extra --old-refresh"; fi ;; # 옛 쪽 기준값을 쓰는 검사(옛 쪽 때 chx 86% · grow 90% · rivals 79% — 2026-10-17 39039859850) · 몫이면 몫마다 제 파일
              *) f="check_$pg.mjs"; extra="--all $sh" ;;
            esac
            left=$(( end - $(date +%s) )); [ "$left" -gt 4200 ] && left=4200
            if [ "$LOCAL" = 1 ] && ! curl -fs -o /dev/null "$base/next/"; then
              code=98; { echo "시험 서버가 안 떴음 — 묶기 · 띄우기 실패"; tail -c 2500 /tmp/pack.log 2>/dev/null; tail -c 1200 /tmp/dev.log 2>/dev/null; } > "out/$n.log"
            elif [ "$left" -lt 120 ]; then
              code=97; echo "작업 시간이 모자라 이 쪽을 못 돌림 — 앞 쪽들이 오래 걸림(작업 75분 · 쪽은 남은 시간까지만)" > "out/$n.log"
            else
              set +e
              PW_DIR=/tmp/pw/ timeout "$left" node "scripts/atlas11/next/$f" --base "$base" --pw /tmp/pw/ $extra --out "out/$n.json" > "out/$n.log" 2>&1
              code=$?
              set -e
              if [ "$code" = 124 ]; then echo "시간 넘김 — ${left}초 안에 못 끝남(작업 시간 75분 안에서 남은 만큼) · 위가 멈춘 곳의 끝 글" >> "out/$n.log"; fi
            fi
            echo "{\"name\":\"$n\",\"code\":$code,\"seconds\":$(( $(date +%s) - t0 )),\"mode\":\"$mode\",\"sha\":\"$GITHUB_SHA\"${BUILD_S:+,\"build\":$BUILD_S}${DATA:+,\"data\":\"$DATA\"}}" > "out/$n.exit.json"
            tail -c 4000 "out/$n.log" > "out/$n.tail.txt"; rm -f "out/$n.log"
            echo "끝 코드 $code · $(cat "out/$n.exit.json")"
          done
          snap1=$(cat oldsnap/*.json 2>/dev/null | sha256sum | cut -c1-16)
          if [ -n "$(ls oldsnap 2>/dev/null)" ] && [ "$snap0" != "$snap1" ]; then echo "SNAP_NEW=1" >> "$GITHUB_ENV"; echo "옛 쪽 기준값을 새로 찍음 — 저장"; fi
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && env.SNAP_NEW == '1' }}
        with:
          path: oldsnap
          key: oldsnap-v1-${{ matrix.job }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-full-${{ matrix.job }}
          path: out/
  gather:
    needs: [plan, data, page]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      LOCAL: ${{ inputs.local && '1' || '0' }}
      SPLIT: ${{ needs.plan.outputs.split }}
      PLAN: ${{ needs.plan.outputs.list }}
      T0: ${{ needs.plan.outputs.t0 }}
      REF: ${{ github.ref_name }}
      DATA_SRC: ${{ needs.data.outputs.data }}
      DATA_ASOF: ${{ needs.data.outputs.asof }}
      DATA_BUILT: ${{ needs.data.outputs.built }}
      DATA_SECS: ${{ needs.data.outputs.dsecs }}
      DATA_WHY: ${{ needs.data.outputs.dwhy }}
      DATA_ASK: ${{ inputs.data }}
    steps:
      - uses: actions/checkout@v4
        with: # 합치는 셈(scripts/atlas11/next) · 이름 한 곳(site/next/brand.js) · 결과 폴더만 받음 — 저장소 전체(1.4GB)를 받으면 25초
          sparse-checkout: |
            scripts/atlas11/next
            site/next
            reports/atlas11/probe
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true # 받을 것이 하나도 없어도 아래가 「결과 없음」으로 적음
        with:
          path: art
          pattern: next-full-*
          merge-multiple: true
      - name: 몫 합치기 · 빠진 결과 적기
        run: |
          mkdir -p art
          # 몫(en1 ~ enN · co1 ~ coN · range · past · grow …) → 쪽 하나 — 이 실행의 가지에 든 셈으로, 아래에서 main 으로 되돌리기 전에
          #   영어 = next_en_check.mjs --merge · 나머지 = shard/merge.mjs(몫 1 ~ n 한 번씩 · 같은 일감 목록 · 몫 합 = 전체 — 아니면 그 쪽 실패)
          #   쪽 한 줄(exit.json): 몫이 모두 0 이고 합치기도 0 일 때만 0 · seconds = 가장 긴 몫 · shards · codes · shardSeconds — 못 끝낸 몫은 99
          for pg in $(node -e 'const s = JSON.parse(process.env.SPLIT || "{}"); console.log(Object.keys(s).filter(k => s[k] > 1).sort().join(" "))'); do
            n=$(node -p 'JSON.parse(process.env.SPLIT)[process.argv[1]]' "$pg")
            files=""; for k in $(seq 1 "$n"); do if [ -f "art/$pg$k.json" ]; then files="$files art/$pg$k.json"; fi; done
            set +e
            if [ "$pg" = en ]; then node scripts/atlas11/next/next_en_check.mjs --merge $files --shards "$n" --out art/en.json > art/en.merge.txt 2>&1
            else node scripts/atlas11/next/shard/merge.mjs $files --shards "$n" --out "art/$pg.json" > "art/$pg.merge.txt" 2>&1; fi
            mc=$?
            set -e
            node -e '
              const fs = require("fs"), pg = process.argv[1], n = Number(process.argv[2]), mc = Number(process.argv[3]);
              const ex = []; for (let k = 1; k <= n; k++) { try { ex.push(JSON.parse(fs.readFileSync(`art/${pg}${k}.exit.json`, "utf8"))); } catch { ex.push({name: pg + k, code: 99, seconds: 0}); } }
              let merged = ""; try { merged = fs.readFileSync(`art/${pg}.merge.txt`, "utf8").trim(); } catch {}
              const tails = []; for (let k = 1; k <= n; k++) { let t = "결과 없음"; try { t = fs.readFileSync(`art/${pg}${k}.tail.txt`, "utf8").trim(); } catch {} tails.push(`── ${pg}${k}/${n} ──\n` + t); }
              const b = ex.map(x => x.build).filter(v => v != null), e0 = ex.find(x => x.mode);
              const out = {name: pg, code: mc === 0 && ex.every(x => x.code === 0) ? 0 : 1, seconds: Math.max(0, ...ex.map(x => x.seconds || 0)), shards: n, codes: ex.map(x => x.code), shardSeconds: ex.map(x => x.seconds || 0)};
              if (e0) { out.mode = e0.mode; out.sha = e0.sha; }
              const ds = [...new Set(ex.map(x => x.data).filter(Boolean))]; if (ds.length) out.data = ds.join(" | ");
              if (b.length) out.build = Math.max(...b);
              fs.writeFileSync(`art/${pg}.exit.json`, JSON.stringify(out) + "\n");
              fs.writeFileSync(`art/${pg}.tail.txt`, "합침: " + merged.slice(-1500) + "\n" + tails.join("\n") + "\n");
              console.log(JSON.stringify(out));' "$pg" "$n" "$mc"
            rm -f art/$pg[0-9]*.json art/$pg[0-9]*.tail.txt "art/$pg.merge.txt"
          done
          # 계획했는데 결과가 없는 쪽(작업이 끝나지 못함)은 끝 코드 99 로 적음 — 요약에서 조용히 빠지지 않게(몫 작업은 그 쪽 이름으로)
          node -e '
            const fs = require("fs"), plan = JSON.parse(process.env.PLAN || "[]").flatMap(x => (x.base ? [x.base] : String(x.pages ?? x).split(" ").filter(Boolean)));
            for (const nm of new Set(plan)) {
              const f = `art/${nm}.exit.json`;
              if (!fs.existsSync(f)) { fs.writeFileSync(f, JSON.stringify({name: nm, code: 99, seconds: 0, why: "결과 없음 — 작업이 끝나지 못함"}) + "\n"); console.log("결과 없음 " + nm); }
            }'
          ls art
      - name: 결과 올리기
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          if [ "$LOCAL" = 1 ]; then dir=reports/atlas11/probe/next-preview; msg="atlas11 probe next-preview $REF ${GITHUB_SHA::7} [skip ci]"; else dir=reports/atlas11/probe/next-full; msg="atlas11 probe next-full [skip ci]"; fi
          # 결과 올리기 — 다른 실행이 먼저 올려도 섞이지 않게: 맨 새 줄기 위에서 다시 만들어 올림(2026-10-17 · 두 실행이 summary.json 을 함께 고쳐 rebase 가 막히고 결과가 안 올라간 일)
          ok=0 # 끝내 못 올리면 이 일을 실패로(조용히 잃지 않게 — 결과를 기다리는 올리기 문이 40분 기다린 뒤 막히던 것 · 2026-10-18 O2 F3)
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ "$LOCAL" = 1 ]; then rm -rf "$dir"; fi # 미리 보기는 한 번에 한 판(가지 · 커밋)만 — 앞 판 결과와 섞이지 않게
            mkdir -p "$dir"
            cp art/* "$dir"/ 2>/dev/null || true
            DIR="$dir" node -e '
              const fs = require("fs"), d = process.env.DIR, local = process.env.LOCAL === "1", t0 = Number(process.env.T0) || 0;
              const ex = fs.readdirSync(d).filter(f => f.endsWith(".exit.json")).sort().map(f => JSON.parse(fs.readFileSync(d + "/" + f, "utf8")));
              const sum = {schema: "atlas11-next-full-1", at: new Date().toISOString(), base: local ? "http://127.0.0.1:8826" : "https://aaa7377.com", mode: local ? "local" : "live",
                ref: process.env.REF, sha: process.env.GITHUB_SHA, run: Number(process.env.GITHUB_RUN_ID), wallSeconds: t0 ? Math.round(Date.now() / 1000) - t0 : null,
                ...(local ? {data: process.env.DATA_SRC === "live" ? {from: "live", asOf: process.env.DATA_ASOF, built: process.env.DATA_BUILT, seconds: Number(process.env.DATA_SECS) || null}
                  : {from: "stored", why: process.env.DATA_ASK === "stored" ? "-f data=stored" : process.env.DATA_WHY || "지금 사이트 자료를 못 받음", seconds: Number(process.env.DATA_SECS) || null}} : {}),
                pages: ex, ok: ex.length > 0 && ex.every(x => x.code === 0)};
              fs.writeFileSync(d + "/summary.json", JSON.stringify(sum, null, 1) + "\n"); console.log(JSON.stringify(sum));'
            git add -f "$dir"
            if git diff --cached --quiet; then ok=1; break; fi # 바뀐 것 없음 = 같은 결과가 이미 main 에 있음
            git commit -q -m "$msg" || break
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((i * 7))
          done
          [ "$ok" = 1 ] || { echo "결과를 main 에 못 올림(여섯 번)"; exit 1; }
