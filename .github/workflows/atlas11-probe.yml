name: atlas11-probe
on:
  workflow_dispatch:
    inputs:
      day:
        description: 'YYYYMMDD'
        required: false
        default: '20260929'
      which:
        description: 'planets | livewhite | livephone | sources | yahoo52 | deep | context | context2 | netlify | home | indexlong | livecheck | liveview | liveen | livenext | livediag | liveshot | livesage | purgedeploys | fxrate | livecal'
        required: false
        default: 'sources'
      shots:
        description: 'liveshot 쪽 목록 — 이름=#/주소 를 쉼표로(비우면 첫 화면 · 싹 달력 · 급등 · 삼성전자 · 오늘 시장 · 반도체 업종) · 사장님 2026-10-26 05:14 기록 쪽(#/t/pick)을 진짜 사이트에서 보려고'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04 # 2026-10-29 14:40 — ubuntu-latest(26 으로 옮겨 가는 중)에서 liveshot · livenext 가 3초 만에 끝나 사진 0장(설치 실패로 봄) · 24.04 로 고정
    timeout-minutes: ${{ inputs.which == 'livecal' && 32 || inputs.which == 'liveen' && 45 || inputs.which == 'livephone' && 45 || inputs.which == 'livenext' && 25 || inputs.which == 'livesage' && 25 || 14 }} # livenext 25분 — 2026-10-28 01:38 진짜 사이트 큰 검사가 14분 줄에 걸려 잘림(10-27 19:15 에도 한 번) · 설치 3분 + 검사 20분 안
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          NETLIFY_AUTH_TOKEN: ${{ (inputs.which == 'netlify' || inputs.which == 'purgedeploys') && secrets.NETLIFY_AUTH_TOKEN || '' }}
          NETLIFY_SITE_ID: ${{ (inputs.which == 'netlify' || inputs.which == 'purgedeploys') && secrets.NETLIFY_SITE_ID || '' }}
          SHOTS: ${{ inputs.shots }}
        run: |
          mkdir -p reports/atlas11/probe
          if [ "${{ inputs.which }}" = "yahoo52" ]; then timeout 600 node scripts/atlas11/probe/yahoo52.mjs 600 || true; elif [ "${{ inputs.which }}" = "deep" ]; then timeout 300 node scripts/atlas11/probe/deep.mjs || true; elif [ "${{ inputs.which }}" = "context" ]; then timeout 600 node scripts/atlas11/probe/context.mjs "${{ inputs.day || '20260929' }}" || true; elif [ "${{ inputs.which }}" = "context2" ]; then timeout 600 node scripts/atlas11/probe/context2.mjs || true; elif [ "${{ inputs.which }}" = "netlify" ]; then timeout 120 node scripts/atlas11/probe/netlify_sites.mjs || true; elif [ "${{ inputs.which }}" = "home" ]; then timeout 300 node scripts/atlas11/probe/home.mjs || true; elif [ "${{ inputs.which }}" = "indexlong" ]; then timeout 400 node scripts/atlas11/probe/index_long.mjs || true; elif [ "${{ inputs.which }}" = "livecheck" ]; then timeout 120 node scripts/atlas11/probe/live_check.mjs || true; elif [ "${{ inputs.which }}" = "planets" ]; then mkdir -p /tmp/sh && (cd /tmp/sh && npm i -s --no-audit --no-fund sharp@0.33.5 >/dev/null) && SHARP_DIR=/tmp/sh/node_modules timeout 400 node scripts/atlas11/probe/planets.mjs || true; elif [ "${{ inputs.which }}" = "livewhite" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 400 node scripts/atlas11/probe/live_white.mjs || true; elif [ "${{ inputs.which }}" = "livephone" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && { npx -y playwright@1.56.1 install --with-deps webkit chromium >/dev/null || npx -y playwright@1.56.1 install --with-deps chromium >/dev/null || true; }) && PW_DIR=/tmp/pw/node_modules timeout 900 node scripts/atlas11/probe/live_phone.mjs || true; elif [ "${{ inputs.which }}" = "liveview" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 300 node scripts/atlas11/probe/live_view.mjs || true; elif [ "${{ inputs.which }}" = "liveen" ]; then mkdir -p /tmp/pw reports/atlas11/probe/live-en && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && timeout 2400 node scripts/atlas11/t365/en_check.mjs --base https://aaa7377.com --jobs 4 --others 600 --pw /tmp/pw/ --out reports/atlas11/probe/live-en/summary.json || true; elif [ "${{ inputs.which }}" = "livenext" ]; then mkdir -p /tmp/pw reports/atlas11/probe/live-next && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && timeout 1200 node scripts/atlas11/next/next_check.mjs --base https://aaa7377.com --pw /tmp/pw/ --out reports/atlas11/probe/live-next/summary.json || true; elif [ "${{ inputs.which }}" = "livediag" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 300 node scripts/atlas11/probe/live_diag.mjs || true; elif [ "${{ inputs.which }}" = "livesage" ]; then mkdir -p /tmp/pw reports/atlas11/probe/live-sage && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && timeout 1200 node scripts/atlas11/next/check_sage.mjs --base https://aaa7377.com --pw /tmp/pw/ --out reports/atlas11/probe/live-sage/summary.json || true; elif [ "${{ inputs.which }}" = "liveshot" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 300 node scripts/atlas11/probe/live_shot.mjs || true; elif [ "${{ inputs.which }}" = "purgedeploys" ]; then timeout 600 node scripts/atlas11/probe/netlify_purge.mjs || true; elif [ "${{ inputs.which }}" = "fxrate" ]; then timeout 400 node scripts/atlas11/probe/fxrate.mjs || true; elif [ "${{ inputs.which }}" = "livecal" ]; then mkdir -p /tmp/pw reports/atlas11/probe/live-cal && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && { CAL_LAP=1 timeout 1500 node scripts/atlas11/next/check_cal.mjs --base https://aaa7377.com --all --pw /tmp/pw/ --out reports/atlas11/probe/live-cal/cal.json > reports/atlas11/probe/live-cal/log.txt 2>&1; echo "exit $?" >> reports/atlas11/probe/live-cal/log.txt; } || true; else timeout 600 node scripts/atlas11/probe/sources.mjs "${{ inputs.day || '20260929' }}" || true; fi
      - if: always()
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          git add -f reports/atlas11/probe
          git commit -m "atlas11 probe ${{ inputs.which }} [skip ci]" && git pull --rebase -q && git push
