name: atlas11-probe
on:
  workflow_dispatch:
    inputs:
      day:
        description: 'YYYYMMDD'
        required: false
        default: '20260929'
      which:
        description: 'sources | yahoo52 | deep | context | context2 | netlify | home | indexlong | livecheck | liveview | purgedeploys'
        required: false
        default: 'sources'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          NETLIFY_AUTH_TOKEN: ${{ (inputs.which == 'netlify' || inputs.which == 'purgedeploys') && secrets.NETLIFY_AUTH_TOKEN || '' }}
          NETLIFY_SITE_ID: ${{ (inputs.which == 'netlify' || inputs.which == 'purgedeploys') && secrets.NETLIFY_SITE_ID || '' }}
        run: |
          mkdir -p reports/atlas11/probe
          if [ "${{ inputs.which }}" = "yahoo52" ]; then timeout 600 node scripts/atlas11/probe/yahoo52.mjs 600 || true; elif [ "${{ inputs.which }}" = "deep" ]; then timeout 300 node scripts/atlas11/probe/deep.mjs || true; elif [ "${{ inputs.which }}" = "context" ]; then timeout 600 node scripts/atlas11/probe/context.mjs "${{ inputs.day || '20260929' }}" || true; elif [ "${{ inputs.which }}" = "context2" ]; then timeout 600 node scripts/atlas11/probe/context2.mjs || true; elif [ "${{ inputs.which }}" = "netlify" ]; then timeout 120 node scripts/atlas11/probe/netlify_sites.mjs || true; elif [ "${{ inputs.which }}" = "home" ]; then timeout 300 node scripts/atlas11/probe/home.mjs || true; elif [ "${{ inputs.which }}" = "indexlong" ]; then timeout 400 node scripts/atlas11/probe/index_long.mjs || true; elif [ "${{ inputs.which }}" = "livecheck" ]; then timeout 120 node scripts/atlas11/probe/live_check.mjs || true; elif [ "${{ inputs.which }}" = "liveview" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 300 node scripts/atlas11/probe/live_view.mjs || true; elif [ "${{ inputs.which }}" = "purgedeploys" ]; then timeout 600 node scripts/atlas11/probe/netlify_purge.mjs || true; else timeout 600 node scripts/atlas11/probe/sources.mjs "${{ inputs.day || '20260929' }}" || true; fi
      - if: always()
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          git add -f reports/atlas11/probe
          git commit -m "atlas11 probe ${{ inputs.which }} [skip ci]" && git pull --rebase -q && git push
