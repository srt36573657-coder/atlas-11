name: atlas11-probe
on:
  workflow_dispatch:
    inputs:
      day:
        description: 'YYYYMMDD'
        required: false
        default: '20260929'
      which:
        description: 'liveguide | liveco | planets | livewhite | livephone | sources | yahoo52 | deep | context | context2 | netlify | home | indexlong | livecheck | liveview | liveen | livenext | livediag | purgedeploys'
        required: false
        default: 'sources'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.which == 'liveen' && 45 || inputs.which == 'livephone' && 25 || 14 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          NETLIFY_AUTH_TOKEN: ${{ (inputs.which == 'netlify' || inputs.which == 'purgedeploys') && secrets.NETLIFY_AUTH_TOKEN || '' }}
          NETLIFY_SITE_ID: ${{ (inputs.which == 'netlify' || inputs.which == 'purgedeploys') && secrets.NETLIFY_SITE_ID || '' }}
        run: |
          mkdir -p reports/atlas11/probe
          if [ "${{ inputs.which }}" = "yahoo52" ]; then timeout 600 node scripts/atlas11/probe/yahoo52.mjs 600 || true; elif [ "${{ inputs.which }}" = "deep" ]; then timeout 300 node scripts/atlas11/probe/deep.mjs || true; elif [ "${{ inputs.which }}" = "context" ]; then timeout 600 node scripts/atlas11/probe/context.mjs "${{ inputs.day || '20260929' }}" || true; elif [ "${{ inputs.which }}" = "context2" ]; then timeout 600 node scripts/atlas11/probe/context2.mjs || true; elif [ "${{ inputs.which }}" = "netlify" ]; then timeout 120 node scripts/atlas11/probe/netlify_sites.mjs || true; elif [ "${{ inputs.which }}" = "home" ]; then timeout 300 node scripts/atlas11/probe/home.mjs || true; elif [ "${{ inputs.which }}" = "indexlong" ]; then timeout 400 node scripts/atlas11/probe/index_long.mjs || true; elif [ "${{ inputs.which }}" = "livecheck" ]; then timeout 120 node scripts/atlas11/probe/live_check.mjs || true; elif [ "${{ inputs.which }}" = "liveguide" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 300 node scripts/atlas11/probe/live_guide.mjs || true; elif [ "${{ inputs.which }}" = "liveco" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 300 node scripts/atlas11/probe/live_co.mjs || true; elif [ "${{ inputs.which }}" = "planets" ]; then mkdir -p /tmp/sh && (cd /tmp/sh && npm i -s --no-audit --no-fund sharp@0.33.5 >/dev/null) && SHARP_DIR=/tmp/sh/node_modules timeout 400 node scripts/atlas11/probe/planets.mjs || true; elif [ "${{ inputs.which }}" = "livewhite" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 400 node scripts/atlas11/probe/live_white.mjs || true; elif [ "${{ inputs.which }}" = "livephone" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && { npx -y playwright@1.56.1 install --with-deps webkit chromium >/dev/null || npx -y playwright@1.56.1 install --with-deps chromium >/dev/null || true; }) && PW_DIR=/tmp/pw/node_modules timeout 900 node scripts/atlas11/probe/live_phone.mjs || true; elif [ "${{ inputs.which }}" = "liveview" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 300 node scripts/atlas11/probe/live_view.mjs || true; elif [ "${{ inputs.which }}" = "liveen" ]; then mkdir -p /tmp/pw reports/atlas11/probe/live-en && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && timeout 2400 node scripts/atlas11/t365/en_check.mjs --base https://aaa7377.com --jobs 4 --others 600 --pw /tmp/pw/ --out reports/atlas11/probe/live-en/summary.json || true; elif [ "${{ inputs.which }}" = "livenext" ]; then mkdir -p /tmp/pw reports/atlas11/probe/live-next && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && timeout 720 node scripts/atlas11/next/next_check.mjs --base https://aaa7377.com --pw /tmp/pw/ --out reports/atlas11/probe/live-next/summary.json || true; elif [ "${{ inputs.which }}" = "livediag" ]; then mkdir -p /tmp/pw && (cd /tmp/pw && npm i -s --no-audit --no-fund playwright@1.56.1 >/dev/null && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null) && PW_DIR=/tmp/pw/node_modules timeout 300 node scripts/atlas11/probe/live_diag.mjs || true; elif [ "${{ inputs.which }}" = "purgedeploys" ]; then timeout 600 node scripts/atlas11/probe/netlify_purge.mjs || true; else timeout 600 node scripts/atlas11/probe/sources.mjs "${{ inputs.day || '20260929' }}" || true; fi
      - if: always()
        run: |
          git config user.name atlas11-bot
          git config user.email atlas11-bot@users.noreply.github.com
          git add -f reports/atlas11/probe
          git commit -m "atlas11 probe ${{ inputs.which }} [skip ci]" && git pull --rebase -q && git push
