<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS 지도 샘플 6 · 등산로 지도</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="sheet.css">
<style>
/* 6 등산로 지도 — 산 하나 = 큰 갈래 하나 · 산 아래 = 1년 가장 낮은 값 · 정상 = 1년 가장 높은 값 · 점 = 업종의 지금 자리 */
#map .sh-maphead { margin: 2px 0 8px; gap: 6px; }
#map .sh-maphead > span { white-space: nowrap; }
#map svg text { font-family: var(--font); }
.mt-name { font-size: 14px; font-weight: 700; fill: var(--ink); }
.mt-alt { font-size: 13px; fill: var(--sub); }
.mt-alt tspan { font-weight: 700; fill: var(--ink); }
.mt-tick { font-size: 11px; fill: var(--sub); }
.mt-mark { font-size: 11px; font-weight: 700; fill: var(--ink); }
.nw { white-space: nowrap; }
</style>
</head>
<body>
<main class="sheet">
  <header class="sh-head">
    <div class="sh-num" id="num"></div>
    <div><h1 class="sh-title" id="title"></h1><p class="sh-sub" id="sub"></p></div>
    <p class="sh-tag" id="tag"></p>
  </header>
  <p class="sh-q" id="question"></p>
  <section class="sh-map" id="map" aria-label="지도"></section>
  <section class="sh-box"><h2>범례 <small>지도 읽는 법</small></h2><div class="sh-legend" id="legend"></div></section>
  <section class="sh-box"><h2>이 지도로 읽은 것 <small>실제 숫자</small></h2><ol class="sh-read" id="reads"></ol></section>
  <p class="sh-why" id="why" hidden></p>
  <footer class="sh-foot" id="foot"></footer>
</main>
<script src="data.js"></script>
<script src="lib.js"></script>
<script>
(async function () {
  const K = L.side('kr');
  const P = K.place;
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const T = n => L.tok(n);
  const C = {card: T('--card'), ink: T('--ink'), ink2: T('--ink2'), sub: T('--sub'), geum: T('--geum')};
  // 산 빛: 위 = 돌빛(옅은 회녹) · 아래(갈래 평균 높이까지) = 청자빛
  C.stone = L.mix(C.card, C.ink, dark ? 0.10 : 0.075);
  C.celadon = L.mix(C.card, C.geum, dark ? 0.42 : 0.30);
  const pc = v => Math.round(v * 100) + '%';
  const f2 = v => (Math.round(v * 100) / 100).toString();

  // ── 자료: 회사 자리(pos52) → 업종 높이(평균) → 갈래 높이(업종 높이의 평균) ──
  const groups = K.groups.map(g => {
    const cs = K.companiesOf(g.id), ok = cs.filter(c => L.finite(c.pos52));
    return {...g, cs, ok, alt: L.mean(ok.map(c => c.pos52))};
  }).filter(g => L.finite(g.alt));
  const fams = K.families.map(f => {
    const gs = groups.filter(g => g.fam === f.id).sort((a, b) => b.alt - a.alt);
    return {...f, gs, alt: L.mean(gs.map(g => g.alt))};
  }).filter(f => f.gs.length).sort((a, b) => b.alt - a.alt);
  const skipped = K.companies.filter(c => !L.finite(c.pos52));
  const late = K.companies.filter(c => c.c60last && c.c60last !== P.asOf);
  const counts = [...new Set(K.groups.map(g => g.count))];
  const TOP = 0.9, LOW = 0.3;

  // ── 읽은 것 셋(모두 셈한 값) ──
  const byAlt = [...groups].sort((a, b) => b.alt - a.alt);
  const nTop = groups.filter(g => g.alt >= TOP), nLow = groups.filter(g => g.alt < LOW).sort((a, b) => a.alt - b.alt);
  const ex = gs => gs.map(g => `<b class="nw">${g.label} ${pc(g.alt)}</b>`).join('&nbsp;· ');   // 「·」는 앞 이름에 붙여 줄바꿈
  const of = n => `<span class="nw"><b>${n}개</b> / ${groups.length}</span>`;
  const ex1 = nTop.length ? nTop.slice(0, 2) : byAlt.slice(0, 2);       // 읽은 것 1 이 이름 대는 업종(지도에 ① 표시)
  const ex2 = nLow.length ? nLow.slice(0, 2) : byAlt.slice(-1);         // 읽은 것 2 가 이름 대는 업종(지도에 ② 표시)
  const read1 = nTop.length
    ? `정상 근처(90% 이상)까지 올라온 업종은 ${of(nTop.length)} — ${ex(ex1)}`
    : `정상 근처(90% 이상)까지 올라온 업종은 ${of(0)} — 가장 높은 곳도 ${ex(ex1)}`;
  const read2 = nLow.length
    ? `산 아래 쪽(30% 아래)에 머문 업종은 ${of(nLow.length)} — 가장 낮은 곳은 ${ex(ex2)}`
    : `산 아래 쪽(30% 아래)에 머문 업종은 ${of(0)} — 가장 낮은 곳도 ${ex(ex2)}`;
  const fHi = fams[0], fLo = fams[fams.length - 1];
  const read3 = `정상에 가장 가까운 갈래는 <span class="nw"><b>${fHi.label}</b>(정상의 <b>${pc(fHi.alt)}</b>)</span>, 가장 먼 갈래는 <span class="nw"><b>${fLo.label}</b>(<b>${pc(fLo.alt)}</b>)</span>`;
  const mark = new Map([...ex1.map(g => [g.id, 1]), ...ex2.map(g => [g.id, 2])]);

  // ── 산 모양(12개 모두 같은 모양 — 높이 눈금이 같아야 서로 견줄 수 있음) ──
  const HM = 86;                                   // 산 아래(0%) → 정상(100%) 높이(px) · 높이는 곧은 눈금
  const SIDE = {L: {hw: 56, w: 0.5, k: 1.6}, R: {hw: 53, w: 0.6, k: 1.3}};
  const prof = (s, u) => { const p = SIDE[s]; return p.w * (1 + Math.cos(Math.PI * u)) / 2 + (1 - p.w) * Math.pow(1 - u, p.k); };
  const hwAt = (s, a) => { let lo = 0, hi = 1; for (let i = 0; i < 44; i++) { const m = (lo + hi) / 2; if (prof(s, m) > a) lo = m; else hi = m; } return SIDE[s].hw * (lo + hi) / 2; };
  const sil = [];
  for (let i = 0; i <= 64; i++) { const u = 1 - i / 64; sil.push([-SIDE.L.hw * u, -HM * prof('L', u)]); }
  for (let i = 1; i <= 64; i++) { const u = i / 64; sil.push([SIDE.R.hw * u, -HM * prof('R', u)]); }
  const silD = 'M' + sil.map(p => f2(p[0]) + ',' + f2(p[1])).join('L') + 'Z';
  // 오른쪽 그늘 면(산이 산처럼 보이게 하는 옅은 그늘 — 뜻 없음 · 아주 옅게)
  const faceD = 'M0,' + f2(-HM) + 'L' + sil.slice(65).map(p => f2(p[0]) + ',' + f2(p[1])).join('L') + `L${f2(SIDE.R.hw * 0.2)},0Q${f2(SIDE.R.hw * 0.04)},${f2(-HM * 0.42)} 0,${f2(-HM)}Z`;

  // ── 점(업종) 놓기 — 높이는 제 값 그대로 · 겹치면 옆으로만 비킴 ──
  const RDOT = 4.1, RING = 1.5, DMIN = 2 * RDOT + RING;          // 점 둘레끼리 닿을 만큼만 떨어뜨림
  const EDGE = RDOT + RING / 2 + 1.6;                             // 점과 길 꺾임은 산 테두리 안쪽으로
  const xMin = a => -hwAt('L', a) + EDGE, xMax = a => hwAt('R', a) - EDGE;
  // 길이 꺾이는 높이: 산마다 여러 벌(간격 · 첫 꺾임)을 놓아 보고, 점이 안 겹치고 옆으로 덜 비키는 벌을 고름
  const pickCorners = (alts, sp, ph) => {
    const out = []; let prev = 0;
    for (let d = ph; d <= 0.94; d += sp) {
      let best = null, bestScore = -Infinity;
      for (let c = d - 0.04; c <= d + 0.04 + 1e-9; c += 0.0025) {
        if (c < prev + 0.10 || c > 0.95) continue;
        const gap = Math.min(0.065, ...alts.map(a => Math.abs(a - c)));
        const score = gap - 0.25 * Math.abs(c - d);
        if (score > bestScore) { bestScore = score; best = c; }
      }
      if (best != null) { out.push(best); prev = best; }
    }
    return out;
  };
  let minGap = Infinity, maxNudge = 0;
  const layout = gs => {
    let best = null;
    for (const sp of [0.15, 0.16, 0.17, 0.18, 0.19, 0.20]) for (let ph = 0.10; ph <= 0.2201; ph += 0.01) {
      const r = trial(gs, pickCorners(gs.map(g => g.alt), sp, ph));
      const score = r.overlap * 100 + r.maxNudge * 0.5 + r.sumNudge * 0.1 + Math.abs(sp - 0.17) * 20 + Math.abs(ph - 0.17) * 5;
      if (!best || score < best.score) best = {...r, score};
    }
    const {it, pts} = best;
    for (let i = 0; i < it.length; i++) { maxNudge = Math.max(maxNudge, Math.abs(it[i].x - it[i].x0)); for (let j = i + 1; j < it.length; j++) minGap = Math.min(minGap, Math.hypot(it[i].x - it[j].x, it[i].y - it[j].y)); }
    return {it, trail: trailThrough(pts, it)};
  };
  const trial = (gs, corners) => {
    const pts = [{x: -SIDE.L.hw * 0.5, a: 0}, ...corners.map((a, i) => ({x: i % 2 ? xMin(a) : xMax(a), a, corner: true})), {x: 0, a: 1}];
    const legOf = a => { let k = 0; while (k < pts.length - 2 && a > pts[k + 1].a) k++; return k; };
    const X = a => { const k = legOf(a), p = pts[k], q = pts[k + 1]; return p.x + (q.x - p.x) * (a - p.a) / ((q.a - p.a) || 1); };
    const it = gs.map(g => { const k = legOf(g.alt); return {g, a: g.alt, y: -HM * g.alt, x0: X(g.alt), x: X(g.alt), leg: k, dir: Math.sign(pts[k + 1].x - pts[k].x) || 1}; });
    for (let n = 0; n < 900; n++) {
      let moved = false;
      for (let i = 0; i < it.length; i++) for (let j = i + 1; j < it.length; j++) {
        const p = it[i], q = it[j], dy = q.y - p.y, d = Math.hypot(q.x - p.x, dy);
        if (d >= DMIN - 1e-6) continue;
        const need = Math.sqrt(Math.max(0, DMIN * DMIN - dy * dy)) + 0.05;
        const [lo, hi] = (p.a < q.a || (p.a === q.a && i < j)) ? [p, q] : [q, p];
        if (lo.leg === hi.leg) {            // 같은 길: 높은 점이 길 가는 쪽으로 앞서게
          const def = need - (hi.x - lo.x) * hi.dir; if (def > 0) { hi.x += hi.dir * def / 2; lo.x -= hi.dir * def / 2; moved = true; }
        } else {                             // 꺾인 곳 둘레: 이미 벌어진 쪽으로 더 벌림
          const sg = Math.sign(hi.x - lo.x) || hi.dir, def = need - Math.abs(hi.x - lo.x);
          if (def > 0) { hi.x += sg * def * 0.6; lo.x -= sg * def * 0.4; moved = true; }
        }
        for (const o of [p, q]) o.x = Math.max(xMin(o.a), Math.min(xMax(o.a), o.x));
      }
      if (!moved) break;
    }
    let overlap = 0, mx = 0, sum = 0;
    for (let i = 0; i < it.length; i++) { const nd = Math.abs(it[i].x - it[i].x0); mx = Math.max(mx, nd); sum += nd; for (let j = i + 1; j < it.length; j++) overlap += Math.max(0, DMIN - 0.02 - Math.hypot(it[i].x - it[j].x, it[i].y - it[j].y)); }
    return {it, pts, overlap, maxNudge: mx, sumNudge: sum};
  };
  // 길: 출발점 → (꺾임 · 점을 높이 차례로) → 정상 — 점은 모두 길 위에 놓임
  const trailThrough = (pts, it) => {
    const seq =[...pts.slice(1, -1).map(p => ({x: p.x, y: -HM * p.a, a: p.a, corner: true, o: 1})), ...it.map(o => ({x: o.x, y: o.y, a: o.a, o: 0}))]
      .sort((u, v) => u.a - v.a || u.o - v.o);
    const all = [{x: pts[0].x, y: 0}, ...seq, {x: 0, y: -HM}];
    let d = `M${f2(all[0].x)},${f2(all[0].y)}`;
    for (let i = 1; i < all.length; i++) {
      const p = all[i];
      if (p.corner) {
        const a = all[i - 1], b = all[i + 1], lin = Math.hypot(p.x - a.x, p.y - a.y), lout = Math.hypot(b.x - p.x, b.y - p.y);
        const r = Math.min(6, lin / 2.2, lout / 2.2);
        if (r > 0.6) { d += `L${f2(p.x - (p.x - a.x) / lin * r)},${f2(p.y - (p.y - a.y) / lin * r)}Q${f2(p.x)},${f2(p.y)} ${f2(p.x + (b.x - p.x) / lout * r)},${f2(p.y + (b.y - p.y) / lout * r)}`; continue; }
      }
      d += `L${f2(p.x)},${f2(p.y)}`;
    }
    return d;
  };

  // ── 지도 그리기 ──
  const map = document.getElementById('map');
  map.append(L.el('div', {class: 'sh-maphead'},
    L.el('span', {html: `<b>${P.label} 큰 갈래 ${fams.length} · 업종 ${groups.length}</b>`}),
    L.el('span', null, `1년 = 52주 · ${L.korDate(P.asOf)}까지`)));
  const ms = getComputedStyle(map);
  const W = Math.floor(map.clientWidth - parseFloat(ms.paddingLeft) - parseFloat(ms.paddingRight));
  const COLS = 3, CW = W / COLS, ROWS = Math.ceil(fams.length / COLS);
  const SUMMIT = 17, NAME = 19, ALT = 37, RH = SUMMIT + HM + ALT + 8;   // 한 줄 높이: 깃발 · 산 · 이름 두 줄
  const H = ROWS * RH - 4;
  const svg = L.sv('svg', {viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img',
    'aria-label': `큰 갈래 ${fams.length}개를 산 ${fams.length}개로 — 정상에 가까운 갈래부터`});
  svg.append(L.sv('defs', null, L.sv('clipPath', {id: 'peak', clipPathUnits: 'userSpaceOnUse'}, L.sv('path', {d: silD}))));
  await document.fonts.load('700 14px "Gowun Batang"', fams.map(f => f.label).join('') + '정상의%0123456789');
  await document.fonts.load('400 13px "Gowun Batang"', '정상의%0123456789');

  fams.forEach((f, idx) => {
    const col = idx % COLS, row = Math.floor(idx / COLS);
    const cx = col * CW + CW / 2, yB = row * RH + SUMMIT + HM;
    const g = L.sv('g', {transform: `translate(${f2(cx)},${f2(yB)})`});
    g.append(L.sv('title', null, `${f.label} — 정상의 ${pc(f.alt)} · 업종 ${f.gs.length}개`));
    // 산 몸(돌빛) + 갈래 평균 높이까지 청자빛 + 옅은 그늘 면
    g.append(L.sv('path', {d: silD, fill: C.stone}));
    g.append(L.sv('rect', {x: -SIDE.L.hw - 1, y: f2(-HM * f.alt), width: SIDE.L.hw + SIDE.R.hw + 2, height: f2(HM * f.alt + 1), fill: C.celadon, 'clip-path': 'url(#peak)'}));
    g.append(L.sv('path', {d: faceD, fill: dark ? '#000' : C.ink, 'fill-opacity': dark ? 0.13 : 0.045}));
    // 등고선 25 · 50 · 75%
    for (const a of [0.25, 0.5, 0.75]) g.append(L.sv('line', {x1: f2(-hwAt('L', a)), x2: f2(hwAt('R', a)), y1: f2(-HM * a), y2: f2(-HM * a), stroke: C.ink, 'stroke-opacity': dark ? 0.17 : 0.14, 'stroke-width': 0.8}));
    // 땅 선
    g.append(L.sv('line', {x1: -SIDE.L.hw - 2, x2: SIDE.R.hw + 2, y1: 0.4, y2: 0.4, stroke: C.ink, 'stroke-opacity': dark ? 0.30 : 0.22, 'stroke-width': 1}));
    // 등산로(점선) — 점을 꿰어 정상까지
    const {it, trail} = layout(f.gs);
    g.append(L.sv('path', {d: trail, fill: 'none', stroke: C.ink2, 'stroke-opacity': dark ? 0.62 : 0.55, 'stroke-width': 1.2, 'stroke-dasharray': '2.2 2.6', 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}));
    // 정상 깃발
    g.append(L.sv('line', {x1: 0, x2: 0, y1: -HM, y2: -HM - 14, stroke: C.ink2, 'stroke-width': 1.1, 'stroke-linecap': 'round'}));
    g.append(L.sv('path', {d: `M0.5,${-HM - 14}L10.5,${-HM - 11.4}L0.5,${-HM - 8.8}Z`, fill: C.geum}));
    // 업종 점(오르는 사람)
    for (const o of [...it].sort((a, b) => a.a - b.a)) {
      g.append(L.sv('circle', {cx: f2(o.x), cy: f2(o.y), r: RDOT, fill: o.a >= TOP ? C.geum : C.ink, stroke: C.card, 'stroke-width': RING},
        L.sv('title', null, `${o.g.label} — 정상의 ${pc(o.a)}`)));
    }
    // 첫 칸 산에만 등고선 눈금
    const ticks = col === 0 ? [0.25, 0.5, 0.75].map(a => ({a, x: -hwAt('L', a) - 4, y: -HM * a + 3.8})) : [];
    for (const t of ticks) g.append(L.sv('text', {class: 'mt-tick', x: f2(t.x), y: f2(t.y), 'text-anchor': 'end'}, Math.round(t.a * 100) + '%'));
    // 읽은 것 1 · 2 가 이름 댄 업종 옆에 같은 번호(①②) — 지도에서 바로 찾게
    const BR = 7, placed = [];
    const rectGap = (bx, by, x0, y0, x1, y1) => Math.hypot(Math.max(x0 - bx, 0, bx - x1), Math.max(y0 - by, 0, by - y1));
    for (const o of it.filter(o => mark.has(o.g.id))) {
      const dist = RDOT + RING / 2 + BR + 1.6;
      const cands = [180, 0, 215, 325, 145, 35, 270, 90].map(deg => { const r = deg * Math.PI / 180; return {x: o.x + dist * Math.cos(r), y: o.y + dist * Math.sin(r)}; });
      const clear = c => Math.min(
        CW / 2 - BR - 1 - Math.abs(c.x), -BR - 1.5 - c.y, c.y - (-HM - 16 + BR),
        ...it.filter(q => q !== o).map(q => Math.hypot(q.x - c.x, q.y - c.y) - (RDOT + RING / 2 + BR + 1)),
        ...placed.map(p => Math.hypot(p.x - c.x, p.y - c.y) - (2 * BR + 2)),
        rectGap(c.x, c.y, -1.5, -HM - 15, 12, -HM + 1) - BR - 1,
        ...ticks.map(t => rectGap(c.x, c.y, t.x - 22, t.y - 10, t.x, t.y + 1) - BR - 1));
      const pick = cands.find(c => clear(c) >= 0) || cands.reduce((b, c) => clear(c) > clear(b) ? c : b);
      placed.push(pick);
      g.append(L.sv('g', {class: 'mt-badge'},
        L.sv('circle', {cx: f2(pick.x), cy: f2(pick.y), r: BR, fill: T('--fill'), stroke: C.sub, 'stroke-width': 0.9}),
        L.sv('text', {class: 'mt-mark', x: f2(pick.x), y: f2(pick.y + 3.9), 'text-anchor': 'middle'}, mark.get(o.g.id))));
    }
    // 이름 · 정상의 NN%
    const big = L.textW(f.label, 14) <= CW - 6;
    g.append(L.sv('text', {class: 'mt-name', x: 0, y: NAME, 'text-anchor': 'middle', style: big ? null : 'font-size:13px'}, f.label));
    g.append(L.sv('text', {class: 'mt-alt', x: 0, y: ALT, 'text-anchor': 'middle'}, '정상의 ', L.sv('tspan', null, pc(f.alt))));
    svg.append(g);
  });
  map.append(svg);

  // ── 범례 칸(작은 그림) ──
  const sw = (...kids) => L.sv('svg', {class: 'sw', viewBox: '0 0 54 26', width: 54, height: 26}, ...kids);
  // 범례 산 = 지도의 산 모양을 줄인 것(같은 모양)
  let clipN = 0;
  const miniMt = (cx, base, sx, sy, fillTo) => {
    const id = 'lgclip' + (++clipN);
    return L.sv('g', {transform: `translate(${cx},${base}) scale(${sx},${sy})`},
      L.sv('clipPath', {id}, L.sv('path', {d: silD})),
      L.sv('path', {d: silD, fill: C.stone}),
      fillTo ? L.sv('rect', {x: -SIDE.L.hw - 1, y: f2(-HM * fillTo), width: SIDE.L.hw + SIDE.R.hw + 2, height: f2(HM * fillTo + 1), fill: C.celadon, 'clip-path': `url(#${id})`}) : null);
  };
  const dashTrail = d => L.sv('path', {d, fill: 'none', stroke: C.ink2, 'stroke-opacity': dark ? 0.7 : 0.6, 'stroke-width': 1.2, 'stroke-dasharray': '2.2 2.6', 'stroke-linecap': 'round'});
  const swBase = sw(miniMt(27, 21.5, 0.4, 0.2),
    ...[0.25, 0.5, 0.75].map(a => L.sv('line', {x1: f2(27 - hwAt('L', a) * 0.4), x2: f2(27 + hwAt('R', a) * 0.4), y1: f2(21.5 - HM * a * 0.2), y2: f2(21.5 - HM * a * 0.2), stroke: C.ink, 'stroke-opacity': dark ? 0.35 : 0.3, 'stroke-width': 0.8})),
    L.sv('line', {x1: 2, x2: 52, y1: 22, y2: 22, stroke: C.ink, 'stroke-width': 2, 'stroke-linecap': 'round'}));
  const swFlag = sw(miniMt(27, 26.5, 0.4, 0.14), L.sv('line', {x1: 27, x2: 27, y1: 14.5, y2: 2, stroke: C.ink2, 'stroke-width': 1.2}), L.sv('path', {d: 'M27.5,2L37,4.6L27.5,7.2Z', fill: C.geum}));
  const swDot = fill => sw(dashTrail('M4,22L50,6'), L.sv('circle', {cx: 27, cy: 14, r: RDOT + 0.4, fill, stroke: C.card, 'stroke-width': RING}));
  const swOrder = sw(...[0.78, 0.5, 0.22].map((a, i) => miniMt(9 + i * 18, 24.5, 0.15, 0.24, a)));

  const span = h => `<span>${h}</span>`;   // 읽은 것 한 줄 = 글 한 덩이(굵은 글씨가 칸을 나누지 않게)
  L.fill({
    num: 6,
    title: '등산로 지도',
    sub: '산 아래 = 1년 가장 낮은 값 · 정상 = 1년 가장 높은 값 · 점 = 지금',
    question: '이 지도가 답하는 물음: <b>1년(52주) 동안 가장 낮았던 값과 가장 높았던 값 사이에서, 지금 어디쯤 올라와 있나?</b>',
    legend: [
      [swBase, '<b>산 아래</b> = 지난 1년 가장 낮은 종가 · <span class="nw">가는 줄 = 25 · 50 · 75%</span>'],
      [swFlag, '<b>정상 깃발</b> = 지난 1년 가장 높은 종가'],
      [swDot(C.ink), `<b>점 하나</b> = 업종 하나(회사 ${counts.length === 1 ? counts[0] + '곳' : '여러 곳'} 평균 자리) · <span class="nw">점 옆 번호 = 아래 「읽은 것」 번호</span>`],
      [swDot(C.geum), `<b>옥빛 점</b> = 정상 근처(90% 이상) — <span class="nw">이번에는 <b>${nTop.length}개</b></span>`],
      [swOrder, '<b>산 차례</b> = 정상에 가까운 갈래부터 · <span class="nw">짙게 칠한 높이 = 갈래 평균</span>'],
    ],
    reads: [read1, read2, read3].map(span),
    why: '<b>잘 보이는 것</b>: 1년 길 가운데 지금 높은 자리인지 낮은 자리인지 · <b>잘 안 보이는 것</b>: 얼마나 빨리 올라왔는지, 회사 크기',
    foot: [
      '자리 = (지금 종가 − 52주 가장 낮은 종가) ÷ (52주 가장 높은 − 가장 낮은) · 0% = 산 아래 · 100% = 정상',
      `${P.label} ${K.companies.length}곳 · 지금 = ${L.korDate(P.asOf)} ${P.close} 종가 · 52주 = 그날까지 1년`,
      '업종 높이 = 그 업종 회사들 자리의 평균 · 갈래 높이(정상의 ○○%) = 그 갈래 업종 높이들의 평균',
      skipped.length ? `자리를 셀 수 없는 ${skipped.length}곳은 뺌(1년 가장 높은 값 = 가장 낮은 값): ${skipped.map(c => `${c.name}(${c.groupLabel})`).join(' · ')} → 그 업종은 ${[...new Set(skipped.map(c => K.companiesOf(c.group).filter(x => L.finite(x.pos52)).length))].join(' · ')}곳 평균` : '자리를 셀 수 없는 곳: 없음',
      ...late.map(c => `${c.name}는 ${L.korDate(c.c60last)} 종가로 셈(${L.md(P.asOf)} 종가 없음)`),
      '점의 높이는 셈한 값 그대로 · 높이가 비슷한 점은 옆으로만 비켜 놓고, 길이 점을 꿰어 지나가게 그림',
      '샘플 — 아직 사이트에 없음',
    ],
  });

  // 부제는 「…=…」 덩이째로만 줄을 바꿈
  const subEl = document.getElementById('sub');
  subEl.replaceChildren(...subEl.textContent.split(' · ').flatMap((s, i) => [i ? ' · ' : '', L.el('span', {class: 'nw'}, s)]));

  await document.fonts.ready;
  window.READY = true;
})().catch(e => { document.body.prepend(L.el('pre', null, String(e && e.stack || e))); window.READY = true; });
</script>
</body>
</html>
