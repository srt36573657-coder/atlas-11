<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>될 듯한 테마</title>
<style>
:root{--bg:#080808;--ink:#FFF;--sub:#BDBDBD;--line:#1B1B1B;--edge:#6A6A6A;--up:#FF6A3D;--dn:#6C86FF;--gold:#F9D21C}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#080808}
body{color:#fff;font:19px/1.5 "Pretendard Variable","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;padding-bottom:72px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}.up{color:var(--up)}.dn{color:var(--dn)}
.top{display:flex;align-items:center;height:64px;padding:0 8px;border-bottom:1px solid var(--line)}
.pill{height:48px;padding:0 16px;border:1px solid var(--edge);border-radius:24px;background:#141414;display:flex;align-items:center;font-size:17px;font-weight:600}
.ttl{flex:1;text-align:center;font-size:21px;font-weight:700;letter-spacing:.14em}
.grp{display:flex;border:1px solid var(--edge);border-radius:24px;background:#141414}.grp span{width:44px;height:46px;display:flex;align-items:center;justify-content:center;font-size:17px}
.v{padding:0 16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px}
h1{font-size:34px;word-break:keep-all;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.hd img{width:120px;height:96px;flex:none}
.say{display:inline-flex;gap:8px;align-items:center;margin:4px 0 16px;padding:8px 16px;border:1px solid #262626;border-radius:22px 22px 22px 6px;background:#161616;font-size:19px}
.say i{white-space:nowrap;flex:none;font-style:normal;color:#A6A6A6;font-size:17px;padding-right:8px;border-right:1px solid #3A3A3A}
.card{display:block;border:1px solid var(--edge);border-radius:20px;padding:16px;margin:0 0 16px}
.card .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-size:24px;font-weight:800;letter-spacing:-.02em}
.gd{font-size:17px;color:var(--sub)}.gd b{color:#fff}
.t{font-size:17px;color:#D6D6D6;line-height:1.5}.t b{color:#fff}
.key{display:flex;gap:16px;font-size:17px;color:var(--sub);margin:4px 0 0}.key i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:6px}
.more{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-top:1px solid var(--line);font-size:19px}
.safe{color:var(--sub);font-size:17px;margin:16px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;background:#080808;border-top:1px solid var(--line)}.tabs span{flex:1;display:flex;align-items:center;justify-content:center;font-size:17px;color:#8A8A8A}.tabs .on{color:#fff;font-weight:700}
.step{display:grid;grid-template-columns:32px 1fr;column-gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.step .no{width:27px;height:27px;border:1px solid #8A8A8A;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px}
.step b{font-size:21px}.big{font-size:30px;font-weight:300}
.row{display:grid;grid-template-columns:1fr 84px 96px;align-items:center;gap:8px;min-height:56px;border-top:1px solid var(--line);font-size:19px}
.row b{text-align:right;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:26px;font-size:19px;font-weight:700;margin:0 0 8px}
.w{background:#fff;color:#080808}.o{border:1px solid var(--edge)}
h2{font-size:21px;margin:16px 0 8px}
.unk{border:1px dashed #6A6A6A;border-radius:16px;padding:16px;margin:16px 0}
.map{border:1px solid var(--edge);border-radius:20px;padding:16px 16px 8px;margin:0 0 16px}
.map p{font-size:17px;color:#D6D6D6}.ck{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.ck span{border:1px solid #3A3A3A;border-radius:14px;padding:2px 10px;font-size:17px;color:#D6D6D6}
.ck .y{border-color:#FF6A3D;color:#fff}.ck .n{color:#8A8A8A;border-style:dashed}
.fold{border:1px solid #3A3A3A;border-radius:16px;padding:12px 16px;margin:0 0 16px;font-size:17px;color:#D6D6D6}.fold summary{font-size:19px;color:#fff;min-height:32px}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px;margin:8px 0}.bars i{flex:1;background:#FF6A3D;border-radius:2px 2px 0 0}.bars i.o{background:#5E5E5E}
.done{border:1px solid #3A3A3A;border-radius:16px;padding:12px 16px;margin:0 0 16px;font-size:17px;color:#BDBDBD}
</style></head><body>
