:root{--ink:#f6f0e2;--soft:#d3d8ee;--fire:#ffa071;--bloom:#f7b0d6;--gold:#ffd97a;--night:#050817;--line:rgba(255,232,190,.2)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night)}
body{background:var(--night);color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;font-size:21px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:0 16px 40px}
.serif{font-family:'Gowun Batang','Pretendard Variable',serif}

/* 머리 */
.top{display:flex;justify-content:space-between;align-items:center;padding-top:16px}
.brand{font-size:25px;font-weight:700;letter-spacing:.18em;color:var(--gold);text-shadow:0 0 14px rgba(255,210,120,.45)}
.date{font-size:17px;color:var(--soft)}
h1{font-weight:700;font-size:clamp(24px,7.3vw,29px);line-height:1.34;margin-top:12px;letter-spacing:-.01em}
h1 .now{color:#fffaf0;text-shadow:0 0 16px rgba(255,236,190,.6)}
h1 .next{color:#c4d4ff}
.lead{font-size:19px;color:var(--soft);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:19px}
.legend span{display:inline-flex;align-items:center;gap:9px}
.dot{display:inline-block;flex:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 5px 2px rgba(255,242,205,.95),0 0 16px 6px rgba(255,214,140,.45)}
.dot.dim{width:9px;height:9px;margin:0 2px;background:#d8e4ff;box-shadow:0 0 6px 2px rgba(170,198,255,.6);animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.34}50%{opacity:1}}

/* 하늘 */
.sky{position:relative;margin-top:6px;width:100%;aspect-ratio:360/460}
.sn{position:absolute;font-size:17px;font-weight:600;color:#fff7e6;white-space:nowrap;line-height:1.2;text-shadow:0 0 6px #050817,0 0 12px #050817}
.sky svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lab{position:absolute;line-height:1.18;padding:4px 2px}
.lab b{display:block;font-size:22px;font-weight:700;letter-spacing:.02em}
.lab i{display:block;font-style:normal;font-size:17px;color:var(--soft)}
.lab.fire b{color:var(--fire)} .lab.bloom b{color:var(--bloom)} .lab.money b{color:var(--gold)}
.tw{animation:tw 2.8s ease-in-out infinite}
.safe{margin-top:4px;text-align:center;font-size:18px;color:#efe7d3;letter-spacing:.01em}
.safe::before,.safe::after{content:'';display:inline-block;width:26px;height:1px;background:var(--line);vertical-align:middle;margin:0 10px}
.down{display:block;text-align:center;margin-top:10px;font-size:18px;color:var(--soft)}
.down b{color:var(--ink);font-weight:600}

/* 별자리 목록 */
.cons{margin-top:44px;padding-top:6px;border-top:1px solid var(--line)}
.cons h2{font-size:28px;font-weight:700;margin-top:18px;display:flex;align-items:center;gap:10px}
.cons h2 .k{font-size:22px}
.cons .what{font-size:19px;color:var(--soft);margin-top:2px}
.half{margin-top:18px}
.half h3{font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--ink)}
.half h3 em{font-style:normal;font-size:17px;color:var(--soft);font-weight:400}
.chart{list-style:none;position:relative;margin-top:6px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.chart li{position:relative;height:50px;display:flex;align-items:center}
.chart a{display:flex;align-items:center;gap:12px;min-width:0;max-width:100%;padding:6px 6px 6px 0;margin-left:var(--x,0px)}
.st{flex:none;width:14px;height:14px;border-radius:50%;background:#fffaf0;box-shadow:0 0 5px 2px rgba(255,244,214,.95),0 0 18px 7px var(--glow)}
.chart.dim .st{width:10px;height:10px;margin:0 2px;background:#dfe8ff;box-shadow:0 0 6px 2px rgba(180,205,255,.6),0 0 14px 4px var(--glow2);animation:tw 2.6s ease-in-out infinite}
.nm{font-size:21px;font-weight:600;min-width:0;overflow-wrap:anywhere;color:#fffaf0}
.chart.dim .nm{font-weight:500;color:#dbe4ff}
.v{flex:none;font-size:17px;color:var(--soft);font-variant-numeric:tabular-nums}
.twin{flex:none;font-size:17px;color:var(--gold);border:1px solid rgba(255,217,122,.45);border-radius:999px;padding:0 8px;line-height:1.4}
.past{margin-top:8px;font-size:18px;line-height:1.55;color:var(--soft);padding:10px 12px;border-left:2px solid var(--line);background:rgba(255,255,255,.03);border-radius:0 10px 10px 0}
.past b{color:var(--ink);font-weight:600}
.fire{--c:var(--fire);--glow:rgba(255,140,90,.55);--glow2:rgba(255,150,110,.35)}
.bloom{--c:var(--bloom);--glow:rgba(247,150,205,.55);--glow2:rgba(247,170,215,.35)}
.money{--c:var(--gold);--glow:rgba(255,205,100,.55);--glow2:rgba(255,215,130,.35)}
.cons h2 .k{color:var(--c)}
.foot{margin-top:44px;text-align:center;font-size:17px;color:var(--soft);line-height:1.7}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <header class="top">
    <span class="brand serif">수르</span>
    <span class="date" id="date">밤하늘</span>
  </header>
  <h1 class="serif"><span class="now">지금 빛나는 회사 21곳</span><br><span class="next">곧 떠오를 듯한 회사 21곳</span></h1>
  <p class="lead">별 하나가 한국 주식 회사 하나예요.</p>
  <div class="legend">
    <span><i class="dot"></i>빛나는 별 = 지금</span>
    <span><i class="dot dim"></i>깜박이는 별 = 될 듯</span>
  </div>

  <div class="sky" id="sky">
    <svg id="skysvg" viewBox="0 0 360 460" aria-hidden="false"></svg>
    <a class="lab fire serif" href="#c-hot" style="left:54%;top:7%"><b>불장자리</b><i>값이 크게 오른 곳</i></a>
    <a class="lab bloom serif" href="#c-bloom" style="left:4%;top:51%"><b>꽃자리</b><i>꽃이 피는 곳</i></a>
    <a class="lab money serif" href="#c-money" style="left:59%;top:79%"><b>돈자리</b><i>돈이 몰리는 곳</i></a>
  </div>
  <p class="safe">앞날을 맞히는 목록이 아니에요.</p>
  <a class="down" href="#c-hot">아래로 내리면 <b>별 42개의 이름</b></a>

  <div id="lists"></div>
  <p class="foot" id="foot"></p>
</main>
<script>
(function(){
  // 뒤 하늘: 작은 별가루와 은하수
  var cv=document.getElementById('bg'),cx=cv.getContext('2d');
  function seed(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
  function paint(){
    var w=innerWidth,h=innerHeight,r=Math.min(devicePixelRatio||1,2);
    cv.width=w*r;cv.height=h*r;cx.setTransform(r,0,0,r,0,0);
    var g=cx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#070b22');g.addColorStop(.55,'#060a1c');g.addColorStop(1,'#04060f');
    cx.fillStyle=g;cx.fillRect(0,0,w,h);
    var m=cx.createRadialGradient(w*.78,h*.18,0,w*.78,h*.18,Math.max(w,h)*.7);
    m.addColorStop(0,'rgba(120,110,200,.20)');m.addColorStop(.45,'rgba(70,60,140,.08)');m.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=m;cx.fillRect(0,0,w,h);
    var n=cx.createRadialGradient(w*.1,h*.85,0,w*.1,h*.85,Math.max(w,h)*.55);
