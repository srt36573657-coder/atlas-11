<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수르 신문</title>
<link rel="stylesheet" href="/app/fonts.css">
<style>
@font-face{font-family:'Gowun Batang';font-weight:700;font-display:swap;src:url(/fonts/gowun-batang/gowun-batang-korean-700-normal.woff2) format('woff2');unicode-range:U+1100-11FF,U+3130-318F,U+AC00-D7A3,U+3000-303F,U+00B7}
@font-face{font-family:'Gowun Batang';font-weight:700;font-display:swap;src:url(/fonts/gowun-batang/gowun-batang-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
:root{--paper:#f4eee2;--ink:#14110d;--ink2:#2f2820;--red:#a8231b;--soft:#e9e0cf}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;font-size:20px;line-height:1.45;word-break:keep-all}
a{color:inherit;text-decoration:none}
.page{max-width:760px;margin:0 auto;padding:8px 16px 36px}
.serif{font-family:'Gowun Batang','Pretendard Variable',serif;font-weight:700}

/* 제호 줄: 왼 귀 · 제호 · 오른 귀 */
.plate{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 0 8px}
.ear{border:1.5px solid var(--ink);padding:5px 4px;font-size:17px;line-height:1.2;text-align:center;color:var(--ink2)}
.ear b{display:block;font-size:21px;color:var(--ink);font-weight:800;letter-spacing:-.02em;margin:2px 0}
.ear.r b{color:var(--red)}
.mast{font-size:74px;line-height:.95;margin:0;letter-spacing:-.04em;text-align:center}
.rule2{border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);height:7px}
.motto{display:flex;justify-content:space-between;gap:8px;font-size:17px;font-weight:600;padding:4px 0;border-bottom:1px solid var(--ink);color:var(--ink2)}

/* 머리기사 */
.head{font-size:40px;line-height:1.12;margin:12px 0 6px;text-align:center;letter-spacing:-.03em}
.head .dot{color:var(--red);padding:0 .12em}
.deck{font-size:20px;line-height:1.4;text-align:center;margin:0 0 6px;font-weight:500}
.safe{text-align:center;font-size:18px;font-weight:700;margin:0 0 12px;padding:4px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}

/* 단 나누기 */
.row{display:grid;grid-template-columns:1fr 1fr}
.c{padding:0 11px 0 0;min-width:0}
.c.r{padding:0 0 0 11px;border-left:1.5px solid var(--ink)}
.kick{display:flex;align-items:baseline;gap:6px;border-bottom:3px solid var(--ink);padding-bottom:3px;flex-wrap:wrap}
.kick .big{font-size:30px;line-height:1.1;letter-spacing:-.03em}
.kick .sm{font-size:17px;font-weight:700;color:var(--ink2)}
.r .kick{border-bottom-color:var(--red)}
.r .kick .big{color:var(--red)}
.band-t{font-size:21px;font-weight:800;margin:10px 0 0;letter-spacing:-.02em;line-height:1.25}
.r .band-t{color:var(--red)}
.band-w{font-size:17px;line-height:1.3;color:var(--ink2);margin:2px 0 4px}
.co{display:block;font-size:19px;font-weight:650;line-height:1.3;padding:4px 0 4px;border-bottom:1px dotted #7a6c5a;letter-spacing:-.02em}
.co:active{background:var(--soft)}
.both{color:var(--red);font-size:17px;margin-left:3px}
.past{border:1.5px solid var(--ink);margin:8px 0 2px;padding:6px 7px;background:#fbf8f1}
.past .t{font-size:17px;line-height:1.3;color:var(--ink2);display:block}
.past .n{font-size:22px;font-weight:800;line-height:1.25;display:block;letter-spacing:-.02em}
.past .n em{font-style:normal;color:var(--red)}
.past .b{font-size:17px;line-height:1.3;display:block;color:var(--ink2)}
.note{font-size:17px;line-height:1.35;color:var(--ink2);margin:8px 0 0}
.foot{margin-top:18px;border-top:4px solid var(--ink);padding-top:8px;font-size:17px;line-height:1.45;color:var(--ink2)}
.foot p{margin:0 0 6px}
.wait{font-size:20px;text-align:center;padding:30px 0}
@media (max-width:360px){
  .mast{font-size:60px}
  .head{font-size:33px}
  .kick .big{font-size:26px}
  .co{font-size:17px}
  .band-t{font-size:19px}
  .c{padding-right:8px}.c.r{padding-left:8px}
  .ear b{font-size:19px}
}
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="plate">
      <div class="ear" id="earL">자료 날짜<b id="dateBig">…</b><span id="dateDay">…</span></div>
      <h1 class="mast serif">수르</h1>
      <div class="ear r" id="earR">지난 1년<br>100번에<b id="pastBig">…</b></div>
    </div>
    <div class="rule2"></div>
    <div class="motto"><span>될 듯한 걸 찾아 주는 신문</span><span>한국 주식 회사</span></div>
  </header>

  <h2 class="head serif">오늘의 21<span class="dot">·</span>곧의 21</h2>
  <p class="deck">지금 그런 회사 21곳과,<br>곧 그렇게 될 듯한 회사 21곳을<br>나란히 실었어요.</p>
  <p class="safe">앞날을 맞히는 목록이 아니에요.</p>

  <section class="cols" id="cols" aria-label="지금과 될 듯">
    <div class="row"><div class="c"><div class="kick"><span class="big serif">지금</span><span class="sm">오늘의 21</span></div></div>
    <div class="c r"><div class="kick"><span class="big serif">될 듯</span><span class="sm">곧의 21</span></div></div></div>
  </section>
  <p class="wait" id="wait">신문을 펴는 중이에요…</p>

  <footer class="foot" id="foot"></footer>
</main>
<script>
(function(){
  var BANDS = [
    {now:'hot',  next:'hotNext',  nowT:'불장 7',       nextT:'불장이 될 듯 7',
     nowW:'요즘 가장 많이 오른 업종의 회사', nextW:'불장 일곱 바로 아래에서 오르는 곳',
     did:'한 달 안에 불장에 든 때'},
    {now:'bloom',next:'bloomNext',nowT:'꽃이 될 7',    nextT:'꽃이 될 듯 7',
     nowW:'아직 싹, 업종이 시장보다 앞선 곳', nextW:'싹 가운데 닷새 새 앞서 나간 곳',
     did:'한 달 안에 꽃이 된 때'},
    {now:'money',next:'moneyNext',nowT:'돈이 몰리는 7', nextT:'돈이 몰릴 듯 7',
     nowW:'한 달 새 회사 크기가 가장 많이 는 곳', nextW:'바로 아래 업종에서 회사 크기가 는 곳',
     did:'한 달 안에 돈이 몰린 때'}
  ];
  var DAYS = ['일','월','화','수','목','금','토'];
  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

  fetch('/su/data/su21.json').then(function(r){ return r.json(); }).then(function(d){
    var both = {}; (d.overlap||[]).forEach(function(o){ both[o.code]=1; });
    // 귀: 날짜
    var ds = (d.asOf && d.asOf.board) || ''; var p = ds.split('-');
    if (p.length===3){
      var dt = new Date(+p[0], +p[1]-1, +p[2]);
      document.getElementById('dateBig').textContent = (+p[1]) + '월 ' + (+p[2]) + '일';
      document.getElementById('dateDay').textContent = DAYS[dt.getDay()] + '요일';
    }
    // 귀: 지난 1년 (세 목록의 100번에 몇 번 — 가장 적은 것 ~ 가장 많은 것)
    var per = ['hotNext','bloomNext','moneyNext'].map(function(k){ return d.past && d.past[k] ? d.past[k].per100 : null; }).filter(function(x){ return x!=null; });
    if (per.length){
      var lo = Math.min.apply(null, per), hi = Math.max.apply(null, per);
      document.getElementById('pastBig').textContent = (lo===hi ? lo : lo + '~' + hi) + '번';
    }
    var cols = document.getElementById('cols');
    function list(box, arr){
      (arr||[]).forEach(function(c){
        var a = el('a','co'); a.href = '#/c/' + c.code; a.textContent = c.name;
        if (both[c.code]) { var s = el('span','both','◆'); s.setAttribute('aria-label','두 목록에 함께'); a.appendChild(s); }
        box.appendChild(a);
      });
    }
    BANDS.forEach(function(b, i){
      // 줄 하나: 머리(왼 · 오른) — 높이가 같아지도록 한 줄에
      var hd = el('div','row'), l1 = el('div','c'), r1 = el('div','c r');
      l1.appendChild(el('h3','band-t',b.nowT)); l1.appendChild(el('p','band-w',b.nowW));
      r1.appendChild(el('h3','band-t',b.nextT)); r1.appendChild(el('p','band-w',b.nextW));
      hd.appendChild(l1); hd.appendChild(r1); cols.appendChild(hd);
      // 줄 둘: 회사 이름(왼 지금 · 오른 될 듯) + 작은 상자
      var bd = el('div','row'), l = el('div','c'), r = el('div','c r');
      list(l, d.lists[b.now]);
      if ((i===0 || i===2) && (d.overlap||[]).length) l.appendChild(el('p','note','◆ 불장과 돈, 두 목록에 함께 든 곳'));
      list(r, d.lists[b.next]);
      var ps = d.past && d.past[b.next];
      if (ps){
        var box = el('div','past');
        box.appendChild(el('span','t','지난 1년, ' + b.did));
        var n = el('span','n'); n.appendChild(document.createTextNode('100번에 ')); n.appendChild(el('em',null, ps.per100 + '번')); box.appendChild(n);
        box.appendChild(el('span','b','아무 회사는 ' + ps.base100 + '번'));
        r.appendChild(box);
      }
      bd.appendChild(l); bd.appendChild(r); cols.appendChild(bd);
    });
    document.getElementById('wait').remove();
    var f = document.getElementById('foot');
    f.appendChild(el('p',null,'회사 이름을 누르면 그 회사 쪽이 열려요.'));
    f.appendChild(el('p',null,'자료 날짜: ' + (p.length===3 ? p[0] + '. ' + (+p[1]) + '. ' + (+p[2]) + '.' : ds) + ' · 네이버 증권 그날 마지막 값을 수르가 셈.'));
    f.appendChild(el('p',null,'지난 1년 기록은 지금의 우량주 365곳으로 셈해서, 살아남은 곳만 본 치우침이 있어요.'));
  }).catch(function(){
    var w = document.getElementById('wait'); if (w) w.textContent = '자료를 못 받아 왔어요. 잠시 뒤 다시 열어 주세요.';
  });
})();
</script>
</body>
</html>
