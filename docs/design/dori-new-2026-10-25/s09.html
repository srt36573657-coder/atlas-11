  <span class="no"><b>9</b>점으로 찍은 해</span>
  <p class="why"><em>워홀 방식</em> 크고 작은 망점으로 찍은 해 하나 · 판이 살짝 어긋남</p>
  <p class="why"><em>잡스 방식</em> 동그라미 하나와 숫자 넷 — 그것만 봄</p>
  <p class="why"><em>누르는 곳</em> 조각을 누르면 그 자리 업종이 열림 · 「싹」은 37곳</p>
