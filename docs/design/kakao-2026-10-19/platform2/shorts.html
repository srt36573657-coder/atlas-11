<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꽃돌이 · 시황(두 번째 판)</title>
<link rel="stylesheet" href="../../../../site/atlas/fonts.css">
<style>
/* 플랫폼 두 번째 판 — 한 벌 뼈대: ① 위 막대 → ② 제목 + 꽃돌이 물음 → ③ 읽는 곳 → ④ 엄지 자리(노랑 칠은 이것 하나) → ⑤ 아래 단추 다섯
   절제: 칠한 노랑 = 한 화면 하나(가장 중요한 누름) · 고른 칸은 흰 테 · 꽃돌이 말은 밝은 회색 바탕 · 색은 오름 · 내림 숫자와 작은 꽃 하나에만 */

:root{--bg:#080808;--ink:#FFFFFF;--soft:#BDBDBD;--line:#2E2E2E;--edge:#8A8A8A;--say:#1E1E1E;--up:#FF6A3D;--dn:#6C86FF;--key:#F6C744}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#080808}
body{color:#FFFFFF;font:19px/1.5 "Pretendard Variable","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;padding-bottom:64px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;background:none;border:0}
.nw{white-space:nowrap}
.serif{font-family:"Gowun Batang",serif;font-weight:400}
.up{color:#FF6A3D}.dn{color:#6C86FF}
/* ① 위 막대 — 카톡 꼴 · 색 없음 */
.top{display:flex;align-items:center;gap:8px;height:64px;padding:0 12px}
.solo,.group{background:#1B1B1B;border-radius:30px;display:flex;align-items:center;height:56px;padding:0 4px}
.tb{min-width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#FFFFFF;border-radius:24px}
#jhBtn{padding:0 12px}
.ttl{flex:1;text-align:center;font-size:22px;letter-spacing:.32em;text-indent:.32em;white-space:nowrap}
#view{padding:0 16px;display:flex;flex-direction:column;min-height:calc(100vh - 128px);min-height:calc(100svh - 128px)}
/* ② 제목 한 줄 + 꽃돌이 물음 한 줄 */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:4px}
.h1{font-family:"Gowun Batang",serif;font-weight:400;font-size:36px;line-height:1.1;letter-spacing:.01em}
.when{font-size:17px;color:#BDBDBD;margin-top:4px;line-height:1.3}
.when b{color:#FFFFFF;font-weight:700}
.flower{flex:0 0 auto;width:46px;height:50px;display:block}
.askrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.say{display:inline-flex;align-items:center;gap:8px;min-width:0;background:#1E1E1E;border-radius:22px 22px 22px 6px;padding:9px 16px;font-family:"Gowun Batang",serif;font-size:19px;line-height:1.3;white-space:nowrap}
.say .who{flex:0 0 auto;font-family:"Pretendard Variable","Apple SD Gothic Neo",sans-serif;font-size:17px;color:#A6A6A6;padding-right:8px;border-right:1px solid #3A3A3A}
.ic{margin-left:auto;flex:0 0 auto;width:48px;height:48px;border-radius:24px;border:1px solid #8A8A8A;display:flex;align-items:center;justify-content:center}
/* ③ 읽는 곳 — 가는 실 한 가닥 · 마디 번호 · 숫자는 크게 단위는 작게 */
.story{list-style:none;position:relative;margin-top:14px}
.story::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:1px;background:#2E2E2E}
.ch{position:relative;padding-left:40px}
.ch+.ch{margin-top:14px;padding-top:12px;border-top:1px solid #1B1B1B}
.no{position:absolute;left:0;top:0;width:27px;height:27px;border-radius:50%;border:1px solid #8A8A8A;background:#080808;display:flex;align-items:center;justify-content:center;font-family:"Gowun Batang",serif;font-size:17px;line-height:1;color:#FFFFFF}
.ch+.ch .no{top:12px}
.lbl{display:flex;align-items:baseline;gap:8px;white-space:nowrap;min-height:27px}
.lbl .t{font-family:"Gowun Batang",serif;font-size:21px;line-height:1.25;font-weight:400}
.lbl .sub{margin-left:auto;font-size:17px;color:#BDBDBD}
.cap{font-size:17px;line-height:1.4;color:#BDBDBD}
.v{font-family:"Gowun Batang",serif;font-weight:400;line-height:1}
.u{font-size:17px;color:#BDBDBD;margin-left:2px;font-family:"Pretendard Variable","Apple SD Gothic Neo",sans-serif}
.lb{font-size:17px;color:#BDBDBD;line-height:1.2}
.ghostbtn{min-height:48px;padding:0 14px;border:1px solid #8A8A8A;border-radius:24px;font-size:17px;color:#FFFFFF;white-space:nowrap}
/* ④ 엄지 자리 — 할 일 하나만 노랑 · 나머지는 글 단추 */
.dock{position:sticky;bottom:64px;z-index:2;margin:auto -16px 0;padding:10px 16px 6px;background:#080808;border-top:1px solid #2E2E2E}
.key{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:28px;background:#F6C744;color:#111111;font-family:"Gowun Batang",serif;font-weight:700;font-size:20px;white-space:nowrap}
.txt{display:flex;align-items:stretch;justify-content:space-between;margin-top:2px}
.txt a,.txt summary{min-height:48px;min-width:48px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-size:17px;color:#D6D6D6;white-space:nowrap;cursor:pointer;list-style:none}
.txt summary::-webkit-details-marker{display:none}
.seg{display:flex;gap:2px;margin-bottom:8px}
.krow{display:flex;align-items:center;gap:6px;padding-bottom:4px}
.krow .key{flex:1 1 auto;width:auto}
.krow .side{flex:0 0 auto;min-height:48px;display:flex;align-items:center;padding:0 6px;font-size:17px;color:#D6D6D6;white-space:nowrap}
.seg a{flex:1 1 0;min-width:0;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#BDBDBD;border:1px solid transparent;border-radius:24px;white-space:nowrap}
.seg a[aria-current]{border-color:#FFFFFF;color:#FFFFFF;font-weight:700}
/* ⑤ 아래 단추 다섯 — 지금 칸은 흰 글 + 흰 밑줄(색 없음) */
.tabs{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;background:#080808;border-top:1px solid #1E1E1E}
.tabs a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:17px;color:#A6A6A6;min-height:48px;letter-spacing:-0.04em;white-space:nowrap}
.tabs a::after{content:"";width:18px;height:2px;background:transparent}
.tabs a[aria-current]{color:#FFFFFF;font-weight:700}
.tabs a[aria-current]::after{background:#FFFFFF}
@media (max-width:359px){
 .top{padding:0 8px}.ttl{font-size:20px;letter-spacing:.18em;text-indent:.18em}
 #view{padding:0 10px}.dock{margin:auto -10px 0;padding:8px 10px 6px}
 .h1{font-size:30px}.say{white-space:normal;font-size:17px}
 .ch{padding-left:36px}.lbl{flex-wrap:wrap;white-space:normal}.lbl .sub{margin-left:0}
 .txt a,.txt summary{padding:0 2px;letter-spacing:-0.04em}.tabs a{letter-spacing:-0.07em}
}

.strip{display:flex;gap:4px;margin:2px 0 8px}
.strip i{flex:1;height:3px;border-radius:2px;background:#2E2E2E}
.strip i.on{background:#FFFFFF}
.big{font-size:60px;letter-spacing:-.01em;margin-top:6px}
.big .u{font-size:24px;color:#6C86FF;margin-left:4px}
.sub2{font-size:19px;margin-top:6px}
.chart{display:block;width:100%;height:auto;margin-top:10px}
.next{display:flex;align-items:center;gap:10px;min-height:48px;font-size:19px;line-height:1.4}
.next b{font-family:"Gowun Batang",serif;font-weight:400;font-size:21px}
.next .go{margin-left:auto;font-size:24px;color:#BDBDBD}
</style>
</head>
