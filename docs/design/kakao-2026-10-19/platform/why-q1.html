<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꽃돌이 시안 — 열한 질문 1 / 11</title>
<link rel="stylesheet" href="../../../../site/atlas/fonts.css">
<style>
:root{--bg:#080808;--ink:#FFFFFF;--soft:#BDBDBD;--thread:#4E4E4E;--hair:#2E2E2E;--edge:#8A8A8A;--mine:#F6C744;--say:#282828;--up:#FF6A3D;--dn:#6C86FF;--go:#7DC46E;--wait:#E3A632;--rest:#F2545B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#080808}
body{color:#FFFFFF;font:19px/1.5 "Pretendard Variable","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;padding-bottom:64px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;background:none;border:0}
.nw{white-space:nowrap}
.serif{font-family:"Gowun Batang",serif;font-weight:400}
.n{font-family:"Gowun Batang",serif}
.top{display:flex;align-items:center;gap:8px;height:64px;padding:0 12px}
.solo,.group{background:#1B1B1B;border-radius:30px;display:flex;align-items:center;height:56px;padding:0 4px}
.tb{min-width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#FFFFFF;border-radius:24px}
#jhBtn{padding:0 12px}
.ttl{flex:1;text-align:center;font-size:22px;letter-spacing:.32em;text-indent:.32em;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px}
.ttl::after{content:"";width:5px;height:5px;border-radius:50%;background:#F6C744;margin-left:-.32em}
#view{padding:0 14px 0 12px;display:flex;flex-direction:column;min-height:calc(100vh - 128px)}
.flower{flex:0 0 auto;width:60px;height:60px;display:block;margin-right:-4px}
.flower.sm{width:40px;height:40px}
/* 머리 */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.h1{font-size:40px;line-height:1.1;padding-top:2px}
.lead{margin-top:6px;font-size:19px;line-height:1.5;color:#FFFFFF;word-break:keep-all}
/* 실 · 번호 */
.story{list-style:none;position:relative;margin-top:14px}
.story::before{content:"";position:absolute;left:17px;top:20px;bottom:20px;width:1px;background:#4E4E4E}
.ch{position:relative;padding-left:46px}
.ch+.ch{margin-top:14px}
.no{position:absolute;left:0;top:2px;width:35px;height:35px;border-radius:50%;border:1px solid #8A8A8A;background:#080808;display:flex;align-items:center;justify-content:center;font-family:"Gowun Batang",serif;font-size:19px;line-height:1;color:#FFFFFF}
.no.on{border-color:#F6C744;color:#F6C744}
.lbl{display:flex;align-items:center;gap:8px;min-height:38px;white-space:nowrap}
.lbl .t{font-family:"Gowun Batang",serif;font-size:24px;line-height:1.2}
.lbl .sub{margin-left:auto;font-size:17px;color:#BDBDBD}
/* 꽃돌이 말풍선 · 내 말풍선 */
.say{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:#282828;border-radius:24px 24px 24px 8px;padding:8px 16px 8px 8px;font-size:19px;line-height:1.35;font-family:"Gowun Batang",serif}
.say img{width:32px;height:32px;flex:0 0 auto}
.me{display:flex;justify-content:flex-end}
.mine{display:inline-block;max-width:84%;background:#F6C744;color:#111111;border-radius:24px 24px 8px 24px;padding:8px 16px;font-size:19px;line-height:1.35;font-weight:600;word-break:keep-all}
.mine .k{font-weight:400;color:#3A2F00}
.ghost{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:1.5px dashed #8A8A8A;border-radius:8px 24px 24px 24px;padding:4px 16px 4px 6px;font-size:20px;line-height:1.2;white-space:nowrap;font-family:"Gowun Batang",serif}
.ghost img{width:30px;height:30px;flex:0 0 auto}
.mem{display:flex;align-items:center;gap:6px;margin-top:4px;padding-left:4px;font-size:17px;line-height:1.3;color:#BDBDBD;white-space:nowrap}
.note{font-size:17px;line-height:1.5;color:#BDBDBD;word-break:keep-all}
/* 신호 점 — 초록 좋음 · 노랑 주의 · 빨강 위험(글을 함께) */
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:0 0 auto;vertical-align:-1px}
.dot.g{background:#7DC46E}.dot.y{background:#E3A632}.dot.r{background:#F2545B}
.ring{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #8A8A8A;flex:0 0 auto}
/* 고른 종목 한 줄 */
.stk{display:flex;align-items:baseline;gap:8px;flex-wrap:nowrap;white-space:nowrap;font-size:17px;color:#BDBDBD}
.stk b{font-size:20px;color:#FFFFFF;font-weight:700}
.stk .v{font-family:"Gowun Batang",serif;font-size:20px;color:#FFFFFF}
/* 엄지 칸 */
.dock{position:sticky;bottom:64px;z-index:2;margin:auto -14px 0 -12px;padding:10px 14px 10px 12px;background:#141414;border-radius:28px 28px 0 0;border-top:1px solid #2E2E2E}
.find .bar{height:60px;background:#080808;border:2px solid #F6C744;border-radius:30px;display:flex;align-items:center;padding:0 5px 0 18px;gap:8px}
.find input{flex:1;min-width:0;height:48px;font-size:19px;color:#FFFFFF;outline:0;font-family:"Gowun Batang",serif}
.find input::placeholder{color:#BDBDBD}
.find button{flex:0 0 auto;height:48px;border-radius:999px;background:#F6C744;color:#111111;font-family:"Gowun Batang",serif;font-weight:700;font-size:19px;padding:0 18px;white-space:nowrap}
.pills{display:flex;gap:6px;margin-top:8px}
.pills a,.pills button{flex:1 1 0;min-width:0;min-height:48px;display:flex;align-items:center;justify-content:center;font-family:"Gowun Batang",serif;font-size:17px;color:#FFFFFF;border:1px solid #8A8A8A;border-radius:999px;white-space:nowrap;padding:0 8px}
.tabs{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;background:#080808;border-top:1px solid #1E1E1E}
.tabs a{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:#A6A6A6;min-height:48px;letter-spacing:-0.04em;white-space:nowrap}
.tabs a[aria-current]{color:#FFFFFF;font-weight:700;flex-direction:column;gap:3px}
.tabs a[aria-current]::after{content:"";width:4px;height:4px;border-radius:50%;background:#F6C744}

.bar1{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.step{display:flex;align-items:baseline;gap:6px;font-size:17px;color:#BDBDBD}
.step b{font-family:"Gowun Batang",serif;font-weight:400;font-size:30px;color:#F6C744;line-height:1}
.ticks{display:flex;gap:4px;margin-top:10px}
.ticks i{flex:1 1 0;height:4px;border-radius:2px;background:#3A3A3A}
.ticks i.on{background:#F6C744}
.chat{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.qbig{font-size:36px;line-height:1.15;padding:12px 22px 12px 10px;gap:10px}
.qbig img{width:40px;height:40px}
.qno{color:#BDBDBD;font-size:22px;margin-right:2px}
.say.s{font-size:17px}
.ask{font-size:17px;color:#BDBDBD;padding-left:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 18px;border:1px solid #8A8A8A;border-radius:29px;font-family:"Gowun Batang",serif;font-size:21px;color:#FFFFFF;background:#080808;text-align:left;width:100%}
.dock .row2{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.back{min-height:48px;padding:0 16px;border:1px solid #8A8A8A;border-radius:999px;font-size:17px;color:#FFFFFF}
.dock .hint2{font-size:17px;color:#BDBDBD}
</style>
</head>
