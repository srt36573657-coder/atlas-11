<title>우주 돌이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 판: 천장 벽화처럼 읽는 밤하늘 — 금빛 두 줄 테를 두른 큰 하늘 판 하나, 그 아래로 글판이 한 줄로 흐름 · 한 화면에 질문 하나 · 맨 아래는 늘 다음 한 걸음 */
:root {
  --sky: #060A14; --sky-2: #0C1322; --sky-3: #141D33; --line: #243050;
  --ink: #EEF1F7; --dim: #B4BDCE; --faint: #8C97AC;
  --moon: #F3E7C8; --wax: #FFC857; --wax-soft: rgba(255, 200, 87, .10);
  --up: #FF6A3D; --down: #5EA2FF;
  --ok: #4CC38A; --warn: #F2C14E; --bad: #FF6B6B;
  --frame: #9C8456; --frame-soft: rgba(156, 132, 86, .45);
  --moon-base: #101A30; --moon-edge: #3A4766; --star: #DCE5FF; --sky-glow: #101A33; --next-sub: #5A5446;
  --serif: "Gowun Batang", "Nanum Myeongjo", "Noto Serif KR", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --fs-1: 17px; --fs-2: 20px; --fs-3: 23px; --fs-4: 28px; --fs-5: 34px; --fs-6: 46px;
  --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 40px;
  --r: 18px;
  color-scheme: dark;
}
html, body { background: var(--sky); color: var(--ink); }
body { margin: 0; font-family: var(--sans); font-size: var(--fs-2); line-height: 1.55; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sky); }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
a { color: inherit; }
figure { position: relative; margin: 0; }
:focus-visible { outline: 3px solid var(--wax); outline-offset: 3px; border-radius: 6px; }

/* 위 띠 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; gap: var(--sp-1); min-height: 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(6, 10, 20, .88); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.top .back { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-left: -12px; border: 0; background: none; color: var(--ink); font: inherit; font-size: var(--fs-4); cursor: pointer; }
.brand { flex: none; white-space: nowrap; display: inline-flex; align-items: center; min-height: 48px; min-width: 48px; font-family: var(--serif); font-size: var(--fs-4); font-weight: 700; color: var(--moon); text-decoration: none; letter-spacing: .02em; }
.top .when { min-width: 0; overflow: hidden; text-overflow: ellipsis; margin-left: auto; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-size: var(--fs-1); white-space: nowrap; }

/* 본문 */
main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--sp-3) calc(112px + env(safe-area-inset-bottom, 0px)); outline: none; }
.page { display: flex; flex-direction: column; gap: var(--sp-3); }
.page.enter { animation: rise .42s cubic-bezier(.2, .7, .2, 1); }
.page.enter.back-in { animation-name: rise-back; }
@keyframes rise { from { opacity: .35; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes rise-back { from { opacity: .35; transform: scale(1.015); } to { opacity: 1; transform: none; } }
.block { display: flex; flex-direction: column; gap: var(--sp-1); }
.eyebrow { margin: 0; color: var(--dim); font-size: var(--fs-1); letter-spacing: .03em; }
.hero { margin: 0; font-family: var(--serif); font-size: var(--fs-6); font-weight: 700; line-height: 1.18; text-wrap: balance; }
.hero em { font-style: normal; color: var(--wax); }
.t { margin: 0; font-family: var(--serif); font-size: var(--fs-5); font-weight: 700; line-height: 1.22; text-wrap: balance; }
.q { margin: 0; font-family: var(--serif); font-size: var(--fs-4); font-weight: 700; line-height: 1.3; text-wrap: balance; }
.lead { margin: 0; font-size: var(--fs-3); line-height: 1.5; }
.sub { margin: 0; color: var(--dim); font-size: var(--fs-2); }
.cap { margin: 0; color: var(--faint); font-size: var(--fs-1); }
.center { text-align: center; }
b.wax, .wax { color: var(--wax); }
.up { color: var(--up); } .dn { color: var(--down); } .fl { color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 2px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-size: var(--fs-1); }
.chip.wax { border-color: var(--wax); color: var(--wax); }
.chip svg { width: 22px; height: 22px; }
a.chip { min-height: 44px; text-decoration: none; }
.meta .near { flex: 1 1 96px; min-width: 80px; max-width: 160px; }

/* 하늘 판 — 금빛 두 줄 테(천장 벽화의 그린 테두리) */
.sky { position: relative; margin: 0; border: 1px solid var(--frame); border-radius: 8px; padding: 6px; background: radial-gradient(120% 90% at 30% 25%, var(--sky-glow) 0%, var(--sky) 70%); box-shadow: inset 0 0 0 5px var(--sky), inset 0 0 0 6px var(--frame-soft); }
.sky svg { display: block; width: 100%; height: auto; }
.skyin { position: relative; }
.ov { position: absolute; z-index: 2; font-size: var(--fs-1); line-height: 1.2; white-space: nowrap; pointer-events: none; text-shadow: 0 0 6px var(--sky), 0 0 3px var(--sky); }
.ov.mid { transform: translate(-50%, -50%); }
.ov.end { transform: translate(-100%, -50%); }
.ov.start { transform: translate(0, -50%); }
.ov.wax { color: var(--wax); font-weight: 700; }
.ov.moon { color: var(--moon); }
.ov.dim { color: var(--dim); }
.ov.big { font-size: var(--fs-2); font-weight: 700; }
.ax { stroke: var(--line); stroke-width: 1.2; }
.orbit { fill: none; stroke: var(--faint); stroke-width: 1; stroke-dasharray: 3 7; opacity: .7; }
.arw { fill: var(--faint); opacity: .8; }
.zone-s { fill: var(--wax-soft); }
.st { fill: var(--faint); }
.st.S { fill: var(--wax); opacity: .9; }
.st.B { fill: var(--moon); opacity: .85; }
.st.W, .st.Q { fill: var(--faint); opacity: .75; }
.ring { fill: none; stroke: var(--wax); stroke-width: 1.4; opacity: .65; }
.trail { fill: none; stroke: var(--wax); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .55; stroke-dasharray: 2 5; }
.tdot { fill: var(--wax); opacity: .5; }
.glow { fill: var(--wax); opacity: .16; }
.real { fill: var(--wax); }
.tap { fill: transparent; cursor: pointer; }
.tap:focus-visible { outline: none; stroke: var(--wax); stroke-width: 2; }
@media (prefers-reduced-motion: no-preference) {
  .glow { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes breathe { 0%, 100% { opacity: .10; transform: scale(.85); } 50% { opacity: .24; transform: scale(1.12); } }
}
/* 달 */
.m-base { fill: var(--moon-base); stroke: var(--moon-edge); stroke-width: 1.5; }
.moon.wax .m-lit { fill: var(--wax); }
.moon.full .m-lit { fill: var(--moon); }
.moon.wane .m-lit { fill: var(--dim); }
.mi { flex: none; width: 40px; height: 40px; }
.mi.s { width: 28px; height: 28px; }
.mi.xl { width: 64px; height: 64px; }

/* 줄 고리 */
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: var(--sp-2); min-height: 72px; padding-block: 10px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; cursor: pointer; }
.row:active { background: var(--sky-2); }
.row .mid { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
.row .nm { font-size: var(--fs-3); font-weight: 700; line-height: 1.3; }
.row .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--sp-1); color: var(--dim); font-size: var(--fs-1); }
.row .end { flex: none; color: var(--dim); font-size: var(--fs-2); text-align: right; }
.row .end b { color: var(--ink); font-size: var(--fs-3); }
.row .go { flex: none; color: var(--faint); font-size: var(--fs-4); line-height: 1; }
.row.static { cursor: default; }

/* 오늘 답 */
.answer { display: flex; flex-direction: column; gap: var(--sp-1); }
.realcard { display: flex; align-items: center; gap: var(--sp-2); min-height: 96px; padding: var(--sp-2); border: 1px solid var(--wax); border-radius: var(--r); background: linear-gradient(180deg, rgba(255, 200, 87, .08), rgba(255, 200, 87, .02)); color: var(--ink); text-decoration: none; }
.realcard .nm { font-family: var(--serif); font-size: var(--fs-5); font-weight: 700; color: var(--wax); line-height: 1.2; }
.realcard .meta { color: var(--dim); font-size: var(--fs-1); }
.realcard .mid { display: flex; flex: 1; flex-direction: column; gap: 6px; min-width: 0; }
.realcard .go { flex: none; color: var(--wax); font-size: var(--fs-4); }

/* 네 별 · 작은 별 줄 */
.four { flex: none; }
.four .s4 { fill: none; stroke: var(--wax); stroke-width: 1.6; }
.four .s4.on { fill: var(--wax); }
.four .l4 { stroke: var(--wax); stroke-width: 1; opacity: .4; }
.cond { display: flex; flex-direction: column; gap: var(--sp-1); margin: 0; padding: 0; list-style: none; }
.cond li { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
.cond li.on { border-color: rgba(255, 200, 87, .55); background: var(--wax-soft); }
.cond .k { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--faint); color: var(--faint); font-size: var(--fs-1); font-weight: 700; }
.cond li.on .k { border-color: var(--wax); background: var(--wax); color: var(--sky); }
.cond .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cond .tx b { font-size: var(--fs-2); }
.cond .tx span { color: var(--dim); font-size: var(--fs-1); }
.kite { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto; }
.kite .kl { stroke: var(--wax); stroke-width: 1.2; opacity: .35; }
.kite .ks { fill: var(--moon-base); stroke: var(--faint); stroke-width: 1.5; }
.kite .ks.on { fill: var(--wax); stroke: var(--wax); }
.kite .kg { fill: var(--wax); opacity: .18; }

/* 막대 */
.near { display: block; width: 100%; height: 8px; }
.near .b0 { fill: var(--sky-3); }
.near .b1 { fill: var(--wax); }
.bar100 { display: flex; flex-direction: column; gap: 12px; }
.bar100 .r { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3.4em; align-items: center; gap: var(--sp-1); font-size: var(--fs-1); color: var(--dim); }
.bar100 .r b { color: var(--ink); text-align: right; font-size: var(--fs-2); font-variant-numeric: tabular-nums; }
.bar100 svg { display: block; width: 100%; height: 14px; }
.bar100 .t0 { fill: var(--sky-3); }
.bar100 .t1 { fill: var(--wax); }
.bar100 .t2 { fill: var(--dim); }

/* 기록 상자 · 다음 단추 · 안전 글 */
.rec { display: flex; flex-direction: column; gap: 12px; padding: var(--sp-2); border: 1px dashed var(--frame); border-radius: var(--r); }
.next { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); min-height: 72px; padding: 10px 22px; border-radius: 999px; background: var(--moon); color: var(--sky); text-decoration: none; cursor: pointer; }
.next .nx { display: flex; flex-direction: column; min-width: 0; }
.next small { font-size: var(--fs-1); color: var(--next-sub); font-weight: 600; }
.next b { font-size: var(--fs-3); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.next i { flex: none; font-style: normal; font-size: var(--fs-4); }
.next.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.next.ghost small { color: var(--dim); }
.safe { margin: var(--sp-2) 0 0; padding-top: var(--sp-2); border-top: 1px solid var(--line); color: var(--faint); font-size: var(--fs-1); line-height: 1.6; }

/* 일곱 별(북두칠성) */
.steps { display: flex; align-items: center; gap: var(--sp-2); }
.steps svg { flex: none; width: 132px; height: auto; }
.steps .st-tx { display: flex; flex-direction: column; min-width: 0; }
.steps .st-tx b { font-size: var(--fs-2); }
.steps .st-tx span { color: var(--dim); font-size: var(--fs-1); }
.dl { stroke: var(--faint); stroke-width: 1.4; opacity: .45; }
.dl.on { stroke: var(--wax); opacity: .9; }
.dp { stroke: var(--moon); stroke-width: 1.2; stroke-dasharray: 3 5; opacity: .55; }
.ds { fill: var(--moon-base); stroke: var(--faint); stroke-width: 1.6; }
.ds.done { fill: var(--wax); stroke: var(--wax); }
.ds.now { fill: var(--wax); stroke: var(--moon); stroke-width: 2.5; }
.pol { fill: var(--moon); }
.dipfig { position: relative; margin: 0; }
.dipfig svg { display: block; width: 100%; height: auto; }

/* 그림(선 · 막대) */
.chart { position: relative; margin: 0; }
.chart svg { display: block; width: 100%; height: auto; }
.ln { fill: none; stroke: var(--moon); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ar { fill: rgba(243, 231, 200, .08); }
.gd { stroke: var(--line); stroke-width: 1; }
.hi { fill: var(--up); } .lo { fill: var(--down); } .nowp { fill: var(--wax); }
.spark { flex: none; width: 96px; height: 36px; }
.spark .sl { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark .sl.up { stroke: var(--up); } .spark .sl.dn { stroke: var(--down); } .spark .sl.fl { stroke: var(--dim); }
.facts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; margin: 0; }
.facts > div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px var(--sp-2); padding-block: 12px; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--dim); font-size: var(--fs-1); }
.facts dd { margin: 0; font-size: var(--fs-2); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.hbars { display: flex; flex-direction: column; gap: 14px; }
.hb { display: flex; flex-direction: column; gap: 6px; color: var(--ink); text-decoration: none; }
.hb .lbl { display: flex; justify-content: space-between; gap: var(--sp-1); font-size: var(--fs-1); color: var(--dim); }
.hb .lbl b { color: var(--ink); font-size: var(--fs-2); }
.hb.me .lbl b { color: var(--wax); }
.hb svg { display: block; width: 100%; height: 16px; }
.hb .h0 { fill: var(--sky-3); } .hb .h1 { fill: var(--dim); } .hb.me .h1 { fill: var(--wax); }
.grow3 { display: flex; flex-direction: column; gap: var(--sp-3); }
.g3 { display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-2); border: 1px solid var(--line); border-radius: var(--r); }
.g3 h3 { margin: 0; font-size: var(--fs-3); }
.g3 .say { margin: 0; color: var(--dim); font-size: var(--fs-1); }
.g3 svg { display: block; width: 100%; height: auto; }
.g3 .yb { fill: var(--dim); } .g3 .yb.last { fill: var(--moon); } .g3 .yb.neg { fill: var(--down); }
.g3 .zero { stroke: var(--faint); stroke-width: 1; }
.yrs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-1); text-align: center; }
.yrs span { display: flex; flex-direction: column; color: var(--dim); font-size: var(--fs-1); }
.yrs b { color: var(--ink); font-size: var(--fs-1); font-variant-numeric: tabular-nums; }
.band svg { display: block; width: 100%; height: auto; }
.band .bb { fill: var(--sky-3); }
.band .bf { fill: rgba(243, 231, 200, .22); }
.band .bn { fill: var(--wax); }
.band-l { display: flex; justify-content: space-between; gap: var(--sp-1); color: var(--dim); font-size: var(--fs-1); }

/* 왜 사? */
.polaris { display: flex; align-items: center; gap: var(--sp-2); }
.polaris svg { flex: none; width: 64px; height: 64px; }
.pg { display: flex; gap: 6px; flex-wrap: wrap; }
.pg svg { width: 22px; height: 22px; }
.pg .p0 { fill: none; stroke: var(--faint); stroke-width: 1.5; }
.pg .p1 { fill: var(--wax); }
.ans { display: flex; flex-direction: column; gap: 12px; }
.ans button { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--sky-2); color: var(--ink); font: inherit; font-size: var(--fs-3); text-align: left; cursor: pointer; }
.ans button[aria-pressed="true"] { border-color: var(--moon); background: var(--sky-3); }
.ans button:disabled { cursor: default; }
.ans button:disabled:not([aria-pressed="true"]) { opacity: .45; }
.dot { flex: none; width: 16px; height: 16px; border-radius: 50%; }
.dot.g { background: var(--ok); } .dot.y { background: var(--warn); } .dot.r { background: var(--bad); }
.reply { display: flex; flex-direction: column; gap: 6px; padding: var(--sp-2); border-radius: var(--r); background: var(--sky-2); border: 1px solid var(--line); }
.reply b { font-size: var(--fs-2); }
.reply span { color: var(--dim); font-size: var(--fs-1); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: var(--fs-2); cursor: pointer; text-decoration: none; }
.btn.solid { background: var(--moon); border-color: var(--moon); color: var(--sky); font-weight: 700; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.verdict { margin: 0; font-family: var(--serif); font-size: var(--fs-5); font-weight: 700; line-height: 1.25; color: var(--moon); }
.verdict.stop { color: var(--bad); }
.ready { display: flex; flex-direction: column; gap: 6px; }
.ready svg { display: block; width: 100%; height: 18px; }
.ready .r0 { fill: var(--sky-3); } .ready .r1 { fill: var(--ok); } .ready .r1.mid { fill: var(--warn); } .ready .r1.low { fill: var(--bad); }
.redlist { margin: 0; padding-left: 1.2em; color: var(--dim); font-size: var(--fs-1); }

/* 이야기 판(달 읽는 법) */
.story { display: flex; flex-direction: column; gap: var(--sp-3); counter-reset: sc; }
.scene { display: flex; flex-direction: column; gap: 12px; padding: var(--sp-2); border: 1px solid var(--frame); border-radius: 8px; box-shadow: inset 0 0 0 4px var(--sky), inset 0 0 0 5px var(--frame-soft); background: rgba(12, 19, 34, .72); }
.scene .no { color: var(--frame); font-family: var(--serif); font-size: var(--fs-2); font-weight: 700; }
.scene h2 { margin: 0; font-family: var(--serif); font-size: var(--fs-4); line-height: 1.3; text-wrap: balance; }
.scene p { margin: 0; color: var(--dim); font-size: var(--fs-2); }
.scene figure { position: relative; margin: 0; }
.scene svg { display: block; width: 100%; height: auto; }
.beam { stroke: var(--wax); stroke-width: 2; stroke-dasharray: 4 8; fill: none; }
@media (prefers-reduced-motion: no-preference) {
  .beam { animation: flow 2.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -48; } }
  .orb { animation: spin 14s linear infinite; transform-origin: 180px 105px; }
  @keyframes spin { to { transform: rotate(360deg); } }
}
.planet { fill: var(--down); }
.orbit2 { fill: none; stroke: var(--faint); stroke-width: 1.2; stroke-dasharray: 2 6; }
.orbdot { fill: var(--wax); }

/* 찾기 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { color: var(--dim); font-size: var(--fs-1); }
.field input { min-height: 60px; padding: 0 18px; border: 1px solid var(--frame); border-radius: 16px; background: var(--sky-2); color: var(--ink); font: inherit; font-size: var(--fs-3); }
.field input::placeholder { color: var(--faint); }

/* 아래 단추 넷 */

    const q = norm(input.value); state.findQ = input.value; out.replaceChildren();
    if (!q) { put(out, [h('p', {class: 'eyebrow'}, '차오르는 달 가운데'), h('nav', {class: 'rows'}, D.order.S.slice(0, 8).map(n => go1('i:' + n, 'row', moonSvg('wax'), h('span', {class: 'mid'}, h('span', {class: 'nm'}, n), h('span', {class: 'meta'}, four(D.inds[n].dots))), h('i', {class: 'go', 'aria-hidden': 'true'}, '›'))))]); return; }
    const inds = Object.keys(D.inds).filter(n => norm(n).includes(q)).slice(0, 10);
    const cos = Object.entries(D.co).filter(([c, C]) => norm(C.n).includes(q) || c.includes(q)).slice(0, 20);
    if (!inds.length && !cos.length) { out.append(h('p', {class: 'sub'}, '? 찾지 못했어요. 시험판에는 업종 77곳과 회사 일부만 있어요.')); return; }
    if (inds.length) put(out, [h('p', {class: 'eyebrow'}, '업종'), h('nav', {class: 'rows'}, inds.map(n => go1('i:' + n, 'row', moonSvg(ZN[D.inds[n].z].moon), h('span', {class: 'mid'}, h('span', {class: 'nm'}, n), h('span', {class: 'meta'}, ZN[D.inds[n].z].name)), h('i', {class: 'go', 'aria-hidden': 'true'}, '›'))))]);
    if (cos.length) put(out, [h('p', {class: 'eyebrow'}, '회사'), h('nav', {class: 'rows'}, cos.map(([c, C]) => go1('c:' + c, 'row', h('span', {class: 'mid'}, h('span', {class: 'nm'}, C.n), h('span', {class: 'meta'}, C.i || '')), h('i', {class: 'go', 'aria-hidden': 'true'}, '›'))))]);
  };
  input.addEventListener('input', draw); draw();
  return [
    h('div', {class: 'block'}, h('p', {class: 'eyebrow'}, '찾기'), h('h1', {class: 't'}, '어느 별을 볼까?')),
    h('div', {class: 'field'}, h('label', {for: 'find-q'}, '업종이나 회사 이름'), input),
    out,
    safe(),
  ];
}

/* ── 길 ── */
function pageFor(route) {
  const [k, a, b] = route.split(':');
  if (k === 'home') return pHome();
  if (k === 'how') return pHow();
  if (k === 'zones') return pZones();
  if (k === 'z') return pZone(a, b);
  if (k === 'i') return pInd(a);
  if (k === 'c') return b === 'past' ? pPast(a) : b === 'near' ? pNear(a) : b === 'grow' ? pGrow(a) : b === 'range' ? pRange(a) : pCo(a);
  if (k === 'why') return pWhy(a);
  if (k === 'back') return pBack();
  if (k === 'find') return pFind();
  return pHome();
}
const TAB = r => (r.startsWith('find') ? 'find' : r.startsWith('why') ? 'why' : r === 'back' ? 'back' : 'home');
function render(keep, keepScroll, dir) {
  const page = h('div', {class: 'page'}, pageFor(state.route));
  if (!keep) page.classList.add('enter'); if (dir === 'back') page.classList.add('back-in');
  VIEW.replaceChildren(page);
  document.getElementById('back').hidden = state.stack.length === 0;
  for (const a of document.querySelectorAll('.dock a')) { if (a.dataset.tab === TAB(state.route)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
  if (!keepScroll) { window.scrollTo(0, 0); }
  if (!keep) VIEW.focus({preventScroll: true});
}
function go(route, root) {
  if (root) state.stack = []; else if (route !== state.route) state.stack.push(state.route);
  state.route = route; render(false, false, 'in');
}
function back() { if (!state.stack.length) return; state.route = state.stack.pop(); render(false, false, 'back'); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]'); if (!t) return;
  e.preventDefault(); go(t.dataset.go, t.dataset.root === '1');
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest && e.target.closest('[data-go]'); if (!t || t.tagName === 'A') return;
  e.preventDefault(); go(t.dataset.go, t.dataset.root === '1');
});
document.getElementById('back').addEventListener('click', back);
document.getElementById('when').textContent = `시험판 · ${kshort(D.asOf)}`;

/* ── 별 하늘(뒤 그림 · 움직임 줄이기면 멈춤) ── */
(function starfield() {
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d'); if (!ctx) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const col = getComputedStyle(document.documentElement).getPropertyValue('--star').trim() || '#DCE5FF';
  let W = 0, H = 0, dpr = 1, stars = [];
  function seed() { let r = 7; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647; const n = Math.round(W * H / 2400); stars = Array.from({length: n}, () => ({x: rnd() * W, y: rnd() * H, s: rnd() * 1.1 + 0.3, a: rnd() * 0.55 + 0.2, p: rnd() * 6.28, w: rnd() * 0.8 + 0.2})); }
  function draw(t) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H); ctx.fillStyle = col; for (const st of stars) { ctx.globalAlpha = st.a * (reduce ? 1 : 0.6 + 0.4 * Math.sin(st.p + t * 0.0011 * st.w)); ctx.beginPath(); ctx.arc(st.x, st.y, st.s, 0, 6.2832); ctx.fill(); } }
  function size() { dpr = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); seed(); draw(0); }
  size(); window.addEventListener('resize', size);
  if (!reduce) { let last = 0; const loop = t => { if (t - last > 70) { draw(t); last = t; } requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();

render(true);
})();
</script>
