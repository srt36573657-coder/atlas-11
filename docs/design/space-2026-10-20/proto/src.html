<title>우주 돌이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 판: 천장 벽화처럼 읽는 밤하늘 — 금빛 두 줄 테를 두른 큰 하늘 판 하나, 그 아래로 글판이 한 줄로 흐름 · 한 화면에 질문 하나 · 맨 아래는 늘 다음 한 걸음 */
:root {
  --sky: #070B17; --sky-2: #0D1428; --sky-3: #141C36; --line: rgba(150, 170, 220, .17); --line-2: rgba(150, 170, 220, .28);
  --ink: #EEF1F7; --dim: #B4BDCE; --faint: #8C97AC;
  --moon: #F1E6C8; --wax: #F2C46A; --wax-soft: rgba(242, 196, 106, .10);
  --up: #FF6A3D; --down: #5EA2FF;
  --ok: #4CC38A; --warn: #F2C14E; --bad: #FF6B6B;
  --frame: #A88A55; --frame-soft: rgba(168, 138, 85, .38);
  --moon-base: #0F1830; --moon-edge: #3A4766; --star: #DCE5FF; --sky-glow: #121C3C; --cool: #8FA0C4; --next-sub: #5A5446; --sheen: #FFF6D6;
  --serif: "Gowun Batang", "Nanum Myeongjo", "Noto Serif KR", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --fs-1: 17px; --fs-2: 20px; --fs-3: 23px; --fs-4: 28px; --fs-5: 34px; --fs-6: 46px;
  --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 40px;
  --r: 18px;
  color-scheme: dark;
}
html { background: radial-gradient(120% 55% at 88% -6%, rgba(72, 96, 186, .22) 0%, rgba(72, 96, 186, 0) 62%) no-repeat, radial-gradient(80% 45% at -12% 26%, rgba(118, 84, 170, .10) 0%, rgba(118, 84, 170, 0) 60%) no-repeat, var(--sky); color: var(--ink); }
body { background: transparent; color: var(--ink); }
body { margin: 0; font-family: var(--sans); font-size: var(--fs-2); line-height: 1.6; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sky); }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
a { color: inherit; }
figure { position: relative; margin: 0; }
[hidden] { display: none !important; } /* 숨긴 것은 늘 숨김 — 뒤로 단추처럼 display 를 따로 준 것도 */
:focus-visible { outline: 3px solid var(--wax); outline-offset: 3px; border-radius: 6px; }

/* 위 띠 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; gap: var(--sp-1); min-height: 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(7, 11, 23, .82); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.top .back { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-left: -12px; border: 0; background: none; color: var(--ink); font: inherit; font-size: var(--fs-4); cursor: pointer; }
.brand { flex: none; white-space: nowrap; display: inline-flex; align-items: center; min-height: 48px; min-width: 48px; font-family: var(--serif); font-size: var(--fs-4); font-weight: 700; color: var(--moon); text-decoration: none; letter-spacing: .02em; }
.top .when { min-width: 0; overflow: hidden; text-overflow: ellipsis; margin-left: auto; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-size: var(--fs-1); white-space: nowrap; }

/* 본문 */
main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--sp-3) calc(112px + env(safe-area-inset-bottom, 0px)); outline: none; }
.page { display: flex; flex-direction: column; gap: var(--sp-3); }
.block { display: flex; flex-direction: column; gap: var(--sp-1); }
.eyebrow { margin: 0; color: var(--faint); font-size: var(--fs-1); letter-spacing: .02em; }
.hero { margin: 0; font-family: var(--serif); font-size: var(--fs-6); font-weight: 700; line-height: 1.22; letter-spacing: -.01em; text-wrap: balance; }
.hero em { font-style: normal; color: var(--wax); }
.t { margin: 0; font-family: var(--serif); font-size: var(--fs-5); font-weight: 700; line-height: 1.22; text-wrap: balance; }
.q { margin: 0; font-family: var(--serif); font-size: var(--fs-4); font-weight: 700; line-height: 1.3; text-wrap: balance; }
.lead { margin: 0; font-size: var(--fs-3); line-height: 1.5; }
.sub { margin: 0; color: var(--dim); font-size: var(--fs-2); }
.cap { margin: 0; color: var(--faint); font-size: var(--fs-1); }
.center { text-align: center; }
b.wax, .wax { color: var(--wax); }
.up { color: var(--up); } .dn { color: var(--down); } .fl { color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 2px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-size: var(--fs-1); }
.chip.wax { border-color: var(--wax); color: var(--wax); }
.chip svg { width: 22px; height: 22px; }
a.chip { min-height: 44px; text-decoration: none; }
.meta .near { flex: 1 1 96px; min-width: 80px; max-width: 160px; }

/* 하늘 판 — 금빛 두 줄 테(천장 벽화의 그린 테두리) */
.sky { position: relative; margin: 0; border: 1px solid var(--frame); border-radius: 6px; padding: 7px; background: radial-gradient(120% 90% at 28% 22%, var(--sky-glow) 0%, var(--sky) 72%); box-shadow: inset 0 0 0 6px var(--sky), inset 0 0 0 7px var(--frame-soft); }
.sky svg { display: block; width: 100%; height: auto; }
.skyin { position: relative; }
.ov { position: absolute; z-index: 2; font-family: var(--serif); font-size: var(--fs-1); line-height: 1.2; white-space: nowrap; pointer-events: none; text-shadow: 0 0 2px var(--sky), 0 0 5px var(--sky), 0 0 10px var(--sky), 0 0 14px var(--sky); } /* 6판 — 이름 둘레를 밤빛으로 넓게 감싸 별 점이 글자에 붙어 보이지 않게 */
.ov.mid { transform: translate(-50%, -50%); }
.ov.end { transform: translate(-100%, -50%); }
.ov.start { transform: translate(0, -50%); }
.ov.wax { color: var(--wax); font-weight: 700; }
.ov.moon { color: var(--moon); }
.ov.dim { color: var(--dim); }
.ov.big { font-size: var(--fs-2); font-weight: 700; }
.ax { stroke: rgba(200, 212, 240, .16); stroke-width: 1; }
.orbit { fill: none; stroke: var(--moon); stroke-width: .9; opacity: .26; }
.orbit2 { fill: none; stroke: var(--moon); stroke-width: .8; stroke-dasharray: 1 5; stroke-linecap: round; opacity: .3; }
.tick { stroke: var(--moon); stroke-width: .8; opacity: .22; }
.arw { fill: var(--moon); opacity: .42; }
.zone-s { fill: url(#zoneglow); }
.st { fill: var(--faint); }
.st.S { fill: #F7CF7A; opacity: 1; stroke: rgba(242, 196, 106, .24); stroke-width: 3.4; }
.st.B { fill: var(--moon); opacity: .82; }
.st.W, .st.Q { fill: var(--cool); opacity: .55; }
.ring { fill: none; stroke: var(--wax); stroke-width: 1.4; opacity: .65; }
.trail { fill: none; stroke: var(--wax); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .55; stroke-dasharray: 2 5; }
.tdot { fill: var(--wax); opacity: .5; }
.glow { fill: url(#starglow); opacity: .9; } /* 6판 — 금빛이 번지는 빛(어두운 원판 대신) */
.real { fill: var(--wax); }
.tap { fill: transparent; cursor: pointer; }
.tap:focus-visible { outline: none; stroke: var(--wax); stroke-width: 2; }
/* 달 */
.m-base { fill: var(--moon-base); stroke: var(--moon-edge); stroke-width: 1.5; }
.moon.wax .m-lit { fill: var(--wax); }
.moon.full .m-lit { fill: var(--moon); }
.moon.wane .m-lit { fill: var(--dim); }
.mi { flex: none; width: 40px; height: 40px; }
.mi.s { width: 28px; height: 28px; }
.mi.xl { width: 64px; height: 64px; }

/* 줄 고리 */
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: var(--sp-2); min-height: 72px; padding-block: 10px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; cursor: pointer; }
.row:active { background: var(--sky-2); }
.row .mid { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
.row .nm { font-size: var(--fs-3); font-weight: 700; line-height: 1.3; }
.row .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--sp-1); color: var(--dim); font-size: var(--fs-1); }
.row .end { flex: none; color: var(--dim); font-size: var(--fs-2); text-align: right; }
.row .end b { color: var(--ink); font-size: var(--fs-3); }
.row .go { flex: none; color: var(--faint); font-size: var(--fs-4); line-height: 1; }
.row.static { cursor: default; }

/* 오늘 답 */
.answer { display: flex; flex-direction: column; gap: var(--sp-1); }
.realcard { display: flex; align-items: center; gap: var(--sp-2); min-height: 96px; padding: var(--sp-2); border: 1px solid rgba(242, 196, 106, .6); border-radius: var(--r); background: radial-gradient(120% 140% at 0% 0%, rgba(242, 196, 106, .12), rgba(242, 196, 106, .02) 70%); color: var(--ink); text-decoration: none; }
.realcard .nm { font-family: var(--serif); font-size: var(--fs-5); font-weight: 700; color: var(--wax); line-height: 1.2; }
.realcard .meta { color: var(--dim); font-size: var(--fs-1); }
.realcard .mid { display: flex; flex: 1; flex-direction: column; gap: 6px; min-width: 0; }
.realcard .go { flex: none; color: var(--wax); font-size: var(--fs-4); }

/* 네 별 · 작은 별 줄 */
.four { flex: none; }
.four .s4 { fill: none; stroke: var(--wax); stroke-width: 1.6; }
.four .s4.on { fill: var(--wax); }
.four .l4 { stroke: var(--wax); stroke-width: 1; opacity: .4; }
.cond { display: flex; flex-direction: column; gap: var(--sp-1); margin: 0; padding: 0; list-style: none; }
.cond li { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(13, 20, 40, .4); }
.cond li.on { border-color: rgba(242, 196, 106, .5); background: var(--wax-soft); }
.cond .k { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--faint); color: var(--faint); font-size: var(--fs-1); font-weight: 700; }
.cond li.on .k { border-color: var(--wax); background: var(--wax); color: var(--sky); }
.cond .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cond .tx b { font-size: var(--fs-2); }
.cond .tx span { color: var(--dim); font-size: var(--fs-1); }
.kite { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto; }
.kite .kl { stroke: var(--wax); stroke-width: 1.2; opacity: .35; }
.kite .ks { fill: var(--moon-base); stroke: var(--faint); stroke-width: 1.5; }
.kite .ks.on { fill: var(--wax); stroke: var(--wax); }
.kite .kg { fill: var(--wax); opacity: .18; }

/* 막대 */
.near { display: block; width: 100%; height: 8px; }
.near .b0 { fill: var(--sky-3); }
.near .b1 { fill: var(--wax); }
.bar100 { display: flex; flex-direction: column; gap: 12px; }
.bar100 .r { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3.4em; align-items: center; gap: var(--sp-1); font-size: var(--fs-1); color: var(--dim); }
.bar100 .r b { color: var(--ink); text-align: right; font-size: var(--fs-2); font-variant-numeric: tabular-nums; }
.bar100 .hbar { align-self: center; }
.bar100 .t0 { fill: var(--sky-3); }
.bar100 .t1 { fill: var(--wax); }
.bar100 .t2 { fill: var(--dim); }

/* 기록 상자 · 다음 단추 · 안전 글 */
.rec { display: flex; flex-direction: column; gap: 12px; padding: var(--sp-2); border: 1px dashed var(--frame); border-radius: var(--r); }
.next { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); min-height: 72px; padding: 10px 22px; border-radius: 999px; background: var(--moon); color: var(--sky); text-decoration: none; cursor: pointer; }
.next .nx { display: flex; flex-direction: column; min-width: 0; }
.next small { font-size: var(--fs-1); color: var(--next-sub); font-weight: 600; }
.next b { font-size: var(--fs-3); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.next i { flex: none; font-style: normal; font-size: var(--fs-4); }
.next.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.next.ghost small { color: var(--dim); }
.safe { margin: var(--sp-2) 0 0; padding-top: var(--sp-2); border-top: 1px solid var(--line); color: var(--faint); font-size: var(--fs-1); line-height: 1.6; }

/* 일곱 별(북두칠성) */
.steps { display: flex; align-items: center; gap: var(--sp-2); }
.steps svg { flex: none; width: 132px; height: auto; }
.steps .st-tx { display: flex; flex-direction: column; min-width: 0; }
.steps .st-tx b { font-size: var(--fs-2); }
.steps .st-tx span { color: var(--dim); font-size: var(--fs-1); }
.dl { stroke: var(--faint); stroke-width: 1.4; opacity: .45; }
.dl.on { stroke: var(--wax); opacity: .9; }
.dp { stroke: var(--moon); stroke-width: 1.2; stroke-dasharray: 3 5; opacity: .55; }
.ds { fill: var(--moon-base); stroke: var(--faint); stroke-width: 1.6; }
.ds.done { fill: var(--wax); stroke: var(--wax); }
.ds.now { fill: var(--wax); stroke: var(--moon); stroke-width: 2.5; }
.pol { fill: var(--moon); }
.dipfig { position: relative; margin: 0; }
.dipfig svg { display: block; width: 100%; height: auto; }

/* 그림(선 · 막대) */
.chart { position: relative; margin: 0; }
.chart svg { display: block; width: 100%; height: auto; }
.ln { fill: none; stroke: var(--moon); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ar { fill: url(#areamoon); }
.cf { fill: var(--star); }
.lnglow { fill: none; stroke: var(--moon); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; opacity: .09; }
.ln.trail2 { stroke: url(#trailgrad); stroke-width: 1.8; }
.gd { stroke: rgba(200, 212, 240, .12); stroke-width: 1; }
.hi { fill: var(--up); } .lo { fill: var(--down); } .nowp { fill: var(--wax); }
.hi, .lo, .nowp { stroke: var(--sky); stroke-width: 1.5; }
.halo { fill: url(#starglow); } .halo.r { fill: url(#redglow); } .halo.b { fill: url(#blueglow); } .halo.w { fill: url(#whiteglow); }
/* 8판 — 초롱초롱(3.5 ~ 7초에 한 번 · 움직임을 끄면 멈춤) */
.flare { fill: var(--sheen); opacity: .28; }
.mo-on .flare { animation: flareb 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flareb { 0%, 100% { opacity: .16; transform: scale(.9); } 50% { opacity: .42; transform: scale(1.06); } }
.mo-on .skyin .st.S[data-tw] { animation: halotw 4.6s ease-in-out infinite; animation-delay: var(--twd, 0s); }
@keyframes halotw { 0%, 100% { stroke: rgba(242, 196, 106, .2); stroke-width: 3.4; } 50% { stroke: rgba(255, 226, 150, .55); stroke-width: 7; } }
.mo-on .tw { animation: twk 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twk { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.16); } }
.mo-on .hbar i::after { animation: headtw 3.8s ease-in-out infinite; }
.mo-on .hb:nth-child(2n) .hbar i::after { animation-delay: -1.3s; } .mo-on .hb:nth-child(3n) .hbar i::after { animation-delay: -2.4s; }
@keyframes headtw { 0%, 100% { opacity: .82; transform: scale(1); } 50% { opacity: 1; transform: scale(1.22); } }
.hero em, .realcard .nm { text-shadow: 0 0 22px rgba(242, 196, 106, .32); }
.ov.cl { font-family: var(--sans); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.spark { flex: none; width: 96px; height: 36px; }
.spark .sl { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark .sl.up { stroke: var(--up); } .spark .sl.dn { stroke: var(--down); } .spark .sl.fl { stroke: var(--dim); }
.spark .se { stroke: var(--sky); stroke-width: 1; } .spark .se.up { fill: var(--up); } .spark .se.dn { fill: var(--down); } .spark .se.fl { fill: var(--dim); }
.facts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; margin: 0; }
.facts > div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px var(--sp-2); padding-block: 12px; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--dim); font-size: var(--fs-1); }
.facts dd { margin: 0; font-size: var(--fs-2); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.hbars { display: flex; flex-direction: column; gap: 14px; }
.hb { display: flex; flex-direction: column; gap: 6px; color: var(--ink); text-decoration: none; }
.hb .lbl { display: flex; justify-content: space-between; gap: var(--sp-1); font-size: var(--fs-1); color: var(--dim); }
.hb .lbl b { flex: none; color: var(--ink); font-size: var(--fs-2); white-space: nowrap; } /* 7판 — 좁은 폭에서 「23.7조 원」이 두 줄로 갈리지 않게 */
.hb.me .lbl b { color: var(--wax); }
.hbar { display: block; position: relative; height: 12px; margin-right: 6px; background: linear-gradient(rgba(150, 170, 220, .14), rgba(150, 170, 220, .14)) center / 100% 1px no-repeat; }
.hbar i { display: block; position: relative; height: 4px; margin-top: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(143, 160, 196, 0), rgba(143, 160, 196, .85)); }
.hbar i::after { content: ""; position: absolute; right: -5px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #F4F7FF; box-shadow: 0 0 8px 3px rgba(190, 205, 240, .6), 0 0 18px 4px rgba(143, 160, 196, .25); }
.hb.me .hbar i, .bar100 .hbar i.t1 { background: linear-gradient(90deg, rgba(242, 196, 106, 0), rgba(242, 196, 106, .95)); }
.hb.me .hbar i::after, .bar100 .hbar i.t1::after { background: #FFFBEA; box-shadow: 0 0 10px 4px rgba(242, 196, 106, .75), 0 0 22px 6px rgba(242, 196, 106, .3); }
.mo-on .page.enter .hbar i { animation: growx 1s cubic-bezier(.2, .7, .2, 1) .25s both; transform-origin: left center; }
.hb .h0 { fill: var(--sky-3); } .hb .h1 { fill: var(--dim); } .hb.me .h1 { fill: var(--wax); }
.grow3 { display: flex; flex-direction: column; gap: var(--sp-3); }
.g3 { display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-2); border: 1px solid var(--line); border-radius: var(--r); background: rgba(13, 20, 40, .4); }
.g3 h3 { margin: 0; font-size: var(--fs-3); }
.g3 .say { margin: 0; color: var(--dim); font-size: var(--fs-1); }
.g3 svg { display: block; width: 100%; height: auto; }
.g3 .pl.s { fill: url(#pillarS); } .g3 .pl.g { fill: url(#pillarG); } .g3 .pl.b { fill: url(#pillarB); }
.g3 .cap { stroke: var(--sky); stroke-width: 1.2; } .g3 .cap.s { fill: var(--star); } .g3 .cap.g { fill: var(--wax); } .g3 .cap.b { fill: var(--down); }
.mo-on .page.enter .g3 .cap { animation: fadein .6s ease-out .95s both; }
.g3 .zero { stroke: rgba(200, 212, 240, .28); stroke-width: 1; }
.yrs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-1); text-align: center; }
.yrs span { display: flex; flex-direction: column; color: var(--dim); font-size: var(--fs-1); }
.yrs b { color: var(--ink); font-size: var(--fs-1); font-variant-numeric: tabular-nums; }
.band svg { display: block; width: 100%; height: auto; }
.band .hz { stroke: rgba(200, 212, 240, .22); stroke-width: 1; }
.band .arc { fill: none; stroke: url(#arcgrad); stroke-width: 3; stroke-linecap: round; opacity: .85; }
.band .arcg { fill: none; stroke: url(#arcgrad); stroke-width: 12; stroke-linecap: round; opacity: .12; }
.band .atk { stroke: var(--moon); stroke-width: 1; opacity: .3; }
.band .bf { fill: rgba(243, 231, 200, .22); }
.band .bn { fill: var(--wax); stroke: var(--sky); stroke-width: 3; }
.band-l { display: flex; justify-content: space-between; gap: var(--sp-1); color: var(--dim); font-size: var(--fs-1); }

/* 왜 사? */
.polaris { display: flex; align-items: center; gap: var(--sp-2); }
.polaris svg { flex: none; width: 64px; height: 64px; }
.pg { display: flex; gap: 6px; flex-wrap: wrap; }
.pg svg { width: 22px; height: 22px; }
.pg .p0 { fill: none; stroke: var(--faint); stroke-width: 1.5; }
.pg .p1 { fill: var(--wax); }
.ans { display: flex; flex-direction: column; gap: 12px; }
.ans button { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--sky-2); color: var(--ink); font: inherit; font-size: var(--fs-3); text-align: left; cursor: pointer; }
.ans button[aria-pressed="true"] { border-color: var(--moon); background: var(--sky-3); }
.ans button:disabled { cursor: default; }
.ans button:disabled:not([aria-pressed="true"]) { opacity: .45; }
.dot { flex: none; width: 16px; height: 16px; border-radius: 50%; }
.dot.g { background: var(--ok); } .dot.y { background: var(--warn); } .dot.r { background: var(--bad); }
.reply { display: flex; flex-direction: column; gap: 6px; padding: var(--sp-2); border-radius: var(--r); background: var(--sky-2); border: 1px solid var(--line); }
.reply b { font-size: var(--fs-2); }
.reply span { color: var(--dim); font-size: var(--fs-1); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: var(--fs-2); cursor: pointer; text-decoration: none; }
.btn.solid { background: var(--moon); border-color: var(--moon); color: var(--sky); font-weight: 700; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.verdict { margin: 0; font-family: var(--serif); font-size: var(--fs-5); font-weight: 700; line-height: 1.25; color: var(--moon); }
.verdict.stop { color: var(--bad); }
.ready { display: flex; flex-direction: column; gap: 6px; }
.ready svg { display: block; width: 100%; height: 18px; }
.ready .r0 { fill: var(--sky-3); } .ready .r1 { fill: var(--ok); } .ready .r1.mid { fill: var(--warn); } .ready .r1.low { fill: var(--bad); }
.redlist { margin: 0; padding-left: 1.2em; color: var(--dim); font-size: var(--fs-1); }

/* 이야기 판(달 읽는 법) */
.story { display: flex; flex-direction: column; gap: var(--sp-3); counter-reset: sc; }
.scene { display: flex; flex-direction: column; gap: 12px; padding: var(--sp-2); border: 1px solid var(--frame); border-radius: 8px; box-shadow: inset 0 0 0 4px var(--sky), inset 0 0 0 5px var(--frame-soft); background: rgba(12, 19, 34, .72); }
.scene .no { color: var(--frame); font-family: var(--serif); font-size: var(--fs-2); font-weight: 700; }
.scene h2 { margin: 0; font-family: var(--serif); font-size: var(--fs-4); line-height: 1.3; text-wrap: balance; }
.scene p { margin: 0; color: var(--dim); font-size: var(--fs-2); }
.scene figure { position: relative; margin: 0; }
.scene svg { display: block; width: 100%; height: auto; }
.beam { stroke: var(--wax); stroke-width: 2; stroke-dasharray: 4 8; fill: none; }
.planet { fill: var(--down); }
.orbit2 { fill: none; stroke: var(--faint); stroke-width: 1.2; stroke-dasharray: 2 6; }
.orbdot { fill: var(--wax); }

/* 찾기 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { color: var(--dim); font-size: var(--fs-1); }
.field input { min-height: 60px; padding: 0 18px; border: 1px solid var(--frame); border-radius: 16px; background: var(--sky-2); color: var(--ink); font: inherit; font-size: var(--fs-3); }
.field input::placeholder { color: var(--faint); }

/* 아래 단추 넷 */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: rgba(6, 10, 20, .94); border-top: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.dock a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 68px; color: var(--faint); font-size: var(--fs-1); text-decoration: none; }
.dock a[aria-current="page"] { color: var(--moon); }
.dock svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dock a[aria-current="page"] svg { stroke: var(--wax); }

/* ── 2판: 움직이는 하늘 · 별 이름표 · 별 이야기 · 손가락 따라가기 ── */
.timebar { display: flex; flex-direction: column; gap: 10px; }
.tb-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.timebar input[type=range] { display: block; width: 100%; height: 44px; margin: 0; accent-color: var(--wax); }
.trails { transition: opacity 1.8s ease; }
.trails.off { opacity: 0; }
.skyin .st, .skyin .ring, .skyin .rl, .skyin .minering, .skyin .mineln, .skyin .ov.wax.big, .skyin .ov.mine { transition: opacity .9s ease; }
.skyin.dim .st, .skyin.dim .ring, .skyin.dim .rl, .skyin.dim .minering, .skyin.dim .mineln, .skyin.dim .ov.wax.big, .skyin.dim .ov.mine, .skyin.dim .trails { opacity: 0; }
.daylab { flex: none; text-align: right; color: var(--moon); font-size: var(--fs-2); font-variant-numeric: tabular-nums; }
.btn.play { flex: none; }
.strail { fill: none; stroke-width: 1; opacity: .36; stroke-linecap: round; stroke-linejoin: round; }
.strail.S { stroke: var(--wax); } .strail.B { stroke: var(--moon); } .strail.W, .strail.Q { stroke: var(--cool); opacity: .16; }
.sel { fill: none; stroke: var(--moon); stroke-width: 2; }
.lens { display: flex; flex-direction: column; gap: 12px; padding: var(--sp-2); border: 1px solid rgba(242, 196, 106, .55); border-radius: var(--r); background: rgba(13, 20, 40, .92); }
.lens-h { display: flex; align-items: center; gap: 12px; }
.lens-t { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.lens-t b { font-size: var(--fs-3); line-height: 1.3; }
.lens-t span { color: var(--dim); font-size: var(--fs-1); }
.lens .x { flex: none; width: 48px; height: 48px; border: 0; background: none; color: var(--dim); font: inherit; font-size: var(--fs-4); cursor: pointer; }
.lens .btn { align-self: flex-start; }
.ov.huge { font-family: var(--serif); font-size: var(--fs-5); font-weight: 700; }
.photon { fill: var(--moon); }
.rd { fill: var(--sky-3); } .rd.on { fill: var(--wax); }
.sdots { display: flex; gap: 8px; }
.sdots i { width: 12px; height: 12px; border-radius: 50%; background: var(--sky-3); border: 1px solid var(--line); }
.sdots i.on { background: var(--wax); border-color: var(--wax); }
.scene.show { gap: 14px; }
.chart.scrub { touch-action: pan-y; cursor: crosshair; -webkit-user-select: none; user-select: none; }
.guide { stroke: var(--moon); stroke-width: 1; opacity: .45; }
.pick { fill: var(--wax); stroke: var(--sky); stroke-width: 2; }
.tip { position: absolute; z-index: 3; display: flex; flex-direction: column; gap: 0; min-width: 9.5em; padding: 8px 12px; border: 1px solid rgba(242, 196, 106, .45); border-radius: 12px; background: rgba(13, 20, 40, .95); transform: translate(-50%, calc(-100% - 16px)); pointer-events: none; white-space: nowrap; }
.tip.below { transform: translate(-50%, 16px); }
.tip b { font-size: var(--fs-2); }
.tip span { color: var(--dim); font-size: var(--fs-1); }
.tip span.up { color: var(--up); } .tip span.dn { color: var(--down); }
.pgs { display: block; width: 100%; height: auto; }
.pgl { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 2 5; }
.pgnow { fill: none; stroke: var(--wax); stroke-width: 1.5; }

/* ── 3판 움직임 — html.mo-on 일 때만(위 띠 단추로 끔) · 날아 들어가기 · 크게 당기기는 mo-full(기기가 움직임 줄이기를 고르지 않았을 때)만 ── */
.top .mo { flex: none; margin-left: 0; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-right: -10px; border: 0; background: none; color: var(--faint); cursor: pointer; }
.top .mo svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.top .mo[aria-pressed="true"] { color: var(--wax); }
.tapring { position: fixed; z-index: 30; width: 60px; height: 60px; margin: -30px 0 0 -30px; border: 2px solid var(--wax); border-radius: 50%; pointer-events: none; opacity: 0; }
.trav { fill: var(--moon); }
.beckon { fill: none; stroke: var(--wax); stroke-width: 2; }
.mo-on .page.enter { animation: fadein .6s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.mo-full .page.enter.deep { animation: fadein .6s ease-out both; }
.mo-full .page.enter.back-in { animation: fadein .6s ease-out both; }
.mo-on .tapring { animation: tapring .8s ease-out forwards; }
@keyframes tapring { from { transform: scale(.4); opacity: .6; } to { transform: scale(1.4); opacity: 0; } }
/* 6판 — 큰 제목 금빛 번쩍임 없앰 */
@keyframes sheen { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0 0; } }
.mo-on .glow { animation: breathe 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes breathe { 0%, 100% { opacity: .75; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
.mo-on .real { animation: twinkle 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.mo-on .orbitg { animation: spin2 240s linear infinite; transform-origin: 166px 162.8px; }
@keyframes spin2 { to { transform: rotate(360deg); } }
.mo-on .beam { animation: flow 6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -48; } }
.mo-on .orb { animation: spin 36s linear infinite; transform-origin: 180px 105px; }
@keyframes spin { to { transform: rotate(360deg); } }
.mo-on .st.appear { animation: appear 1.6s ease-out both; }
@keyframes appear { from { opacity: .08; } }
.mo-on .ignite { animation: ignite 2s cubic-bezier(.2, .7, .2, 1) .6s both; transform-box: fill-box; transform-origin: center; }
@keyframes ignite { from { opacity: .2; transform: scale(.3); } }
.mo-on .photon { animation: photon 6.5s linear infinite; }
@keyframes photon { from { transform: translateX(0); } to { transform: translateX(206px); } }
.mo-on .rd.on { animation: lightdot .5s ease-out both; }
@keyframes lightdot { from { fill: var(--sky-3); } }
.mo-on .kite.seq .ks.on, .mo-on .show .ds { animation: lightup .55s ease-out both; }
@keyframes lightup { from { fill: var(--moon-base); stroke: var(--faint); } }
.mo-on .kite.seq .kg { animation: fadein .6s ease-out both; }
.mo-on .kite .kl { stroke-dasharray: 100; animation: draw100 .9s ease-out both; }
.mo-on .show .dp { animation: fadein .8s ease-out 2.1s both; }
.mo-on .show .pol, .mo-on .show .polg { animation: polglow 1.1s cubic-bezier(.2, .7, .2, 1) 2.5s both; transform-box: fill-box; transform-origin: center; }
@keyframes polglow { from { opacity: .1; transform: scale(.4); } }
@keyframes fadein { from { opacity: 0; } }
/* 6판 — 차오르는 달 칸 깜빡임 없앰 */
@keyframes zpulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.mo-on .ln.draw { stroke-dasharray: 1000; animation: draw 2.2s cubic-bezier(.3, .6, .2, 1) both; }
@keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
.mo-on .page.enter .spark .sl { stroke-dasharray: 100; animation: draw100 1s ease-out .35s both; }
.mo-on .page.enter .spark .se { animation: fadein .6s ease-out 1.2s both; }
@keyframes draw100 { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
.mo-on .ar.fade { animation: fadein 1.2s ease-out .5s both; }
.mo-on .pgnow, .mo-on .beckon { animation: ping 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ping { 0%, 100% { opacity: .9; transform: scale(1); } 50% { opacity: .5; transform: scale(1.12); } }
.mo-on .grow { animation: growx .9s cubic-bezier(.2, .7, .2, 1) .3s both; transform-box: fill-box; transform-origin: left center; }
@keyframes growx { from { transform: scaleX(0); } }
.mo-on .page.enter .yb { animation: growy .8s cubic-bezier(.2, .7, .2, 1) .2s both; transform-box: fill-box; transform-origin: center bottom; }
.mo-on .page.enter .yb.neg { transform-origin: center top; }
@keyframes growy { from { transform: scaleY(0); } }
.mo-on .lens.pop { animation: pop .45s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.98); } }
.mo-on .reply, .mo-on .qin { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
.mo-on .trav { transition: transform .9s cubic-bezier(.4, 0, .2, 1), opacity .5s ease-in .7s; }
.mo-on .dipnav .ds { animation: dstw 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes dstw { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.mo-on .nowp { animation: breathe2 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes breathe2 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.mo-on .row:active, .mo-on .next:active, .mo-on .btn:active, .mo-on .realcard:active { transform: scale(.985); transition: transform .08s; }

/* ── 4판: 돌이가 읽어 주기 · 내 별자리 · 맞혀 볼까 · 이유 타임캡슐 · 작은 소리 ── */
.top .ic { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 0; background: none; color: var(--faint); cursor: pointer; }
.top .ic svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.top .ic[aria-pressed="true"] { color: var(--wax); }
.top .gap { flex: 1; }
.speak { display: flex; flex-direction: column; gap: 10px; padding: var(--sp-2); border: 1px solid var(--line); border-radius: var(--r); background: rgba(13, 20, 40, .55); }
.speak-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.speak-h b { font-size: var(--fs-2); }
.speak-l { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.speak-l li { padding: 6px 10px; border-radius: 10px; color: var(--dim); font-size: var(--fs-2); line-height: 1.5; transition: background .3s, color .3s; }
.speak-l li.now { background: var(--wax-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--wax); }
.btn svg, .speak-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn { gap: 8px; }
.mine-btn[aria-pressed="true"] { border-color: var(--wax); color: var(--wax); }
.mine-btn svg.on { fill: var(--wax); stroke: var(--wax); }
.minering { fill: none; stroke: var(--moon); stroke-width: 2; }
.mineln { fill: none; stroke: var(--moon); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .75; }
.ov.mine { color: var(--moon); font-weight: 700; }
.quiz .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.quiz .choices .btn { width: 100%; min-height: 60px; font-size: var(--fs-3); font-weight: 700; border-color: var(--frame); }
.linkish { align-self: flex-start; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--dim); font: inherit; font-size: var(--fs-1); text-decoration: underline; cursor: pointer; }
.capsule { display: flex; flex-direction: column; gap: 12px; padding: var(--sp-2); border: 1px solid var(--frame-soft); border-radius: var(--r); background: rgba(13, 20, 40, .6); }
.seal { display: flex; align-items: center; gap: var(--sp-2); }
.seal svg { flex: none; width: 72px; height: 72px; }
.seal .days { display: flex; flex-direction: column; }
.seal .days b { font-family: var(--serif); font-size: var(--fs-5); color: var(--moon); line-height: 1.1; }
.seal .days span { color: var(--dim); font-size: var(--fs-1); }
.quote { margin: 0; padding: 12px 16px; border-radius: 12px; background: var(--sky-3); font-family: var(--serif); font-size: var(--fs-3); line-height: 1.45; }
.toast { box-sizing: border-box; position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: max-content; max-width: calc(100vw - 32px); padding: 12px 20px; border-radius: 999px; background: var(--moon); color: var(--sky); font-size: var(--fs-2); font-weight: 700; transform: translateX(-50%); box-shadow: 0 6px 24px rgba(0, 0, 0, .45); pointer-events: none; }
.toast.out { opacity: 0; transition: opacity .4s; }
.mo-on .toast { animation: toastin .5s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 6px); } }
.mo-on .seal svg { animation: sealin 1s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes sealin { from { opacity: 0; transform: scale(.92); } }
/* 6판 — 내 별 고리는 가만히 */

/* ── 5판: 망원경 하늘 · 별똥별 잡기 · 내 별자리 이름 · 네 별 켜 보기 · 하늘 퀴즈 ── */
.skyin svg { touch-action: pan-y; }
.sky.zoomed .skyin svg { touch-action: none; cursor: grab; }
.ov.zl { color: var(--ink); font-size: var(--fs-1); }
.zbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.zbar .zk { margin-right: auto; color: var(--dim); font-size: var(--fs-1); }
.zbar .btn { min-width: 52px; min-height: 48px; padding: 0 14px; font-size: var(--fs-3); }
.zbar .btn.rs { font-size: var(--fs-1); }
.toast.act { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; pointer-events: auto; }
.toast.act a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--sky); color: var(--moon); font-size: var(--fs-1); text-decoration: none; }
.mname { display: flex; flex-direction: column; gap: 6px; }
.mname input { min-height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--sky-2); color: var(--ink); font: inherit; font-size: var(--fs-2); }
.kgame { position: relative; margin: 0; }
.kbtn { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
.kbtn:focus-visible { outline: 3px solid var(--wax); outline-offset: 0; }
.kite .ks.lit { fill: var(--wax); stroke: var(--wax); }
.kite .ks.nope { fill: var(--moon-base); stroke: var(--down); }
.kite .kl.dim { opacity: .18; }
.kite .kl.lit { stroke: var(--wax); opacity: .9; }
.cond li.hid { border-style: dashed; }
.cond li.hid .tx span { color: var(--faint); }
.cond li.offk .k { border-color: var(--down); color: var(--down); }
/* 6판 — 아직 안 누른 별 흔들림 없앰 */
.mo-on .kite .ks.lit { animation: lightup .55s ease-out both; }
.mo-on .kite .ks.nope { animation: nope .9s ease-in-out; }
@keyframes nope { 50% { opacity: .35; } }
.qopts { display: flex; flex-direction: column; gap: 10px; }
.qopts button { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 60px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--sky-2); color: var(--ink); font: inherit; font-size: var(--fs-3); text-align: left; cursor: pointer; }
.qopts button.right { border-color: var(--ok); background: rgba(76, 195, 138, .12); }
.qopts button.wrong { border-color: var(--bad); background: rgba(255, 107, 107, .10); }
.qopts button:disabled { cursor: default; }
.qopts button i { font-style: normal; font-size: var(--fs-2); }
.hlring { fill: none; stroke: var(--moon); stroke-width: 2; }
.mo-on .hlring { animation: ping 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

/* ── 1년 하늘(5판) — 업종 77곳의 지난 1년 자리(닷새마다 · 테마 시계와 같은 셈) ── */
.seg2 { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
